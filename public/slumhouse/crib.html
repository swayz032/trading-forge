<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slumhouse · The Crib</title>
  <link rel="stylesheet" href="/slumhouse/slumhouse.css">
</head>
<body>
  <header class="sh-header">
    <a class="sh-logo" href="/slumhouse/crib.html" aria-label="Slumhouse">
      <svg viewBox="0 0 64 56" width="38" height="34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="lg-bull-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c5ff5f"/>
            <stop offset="100%" stop-color="#a3ff12"/>
          </linearGradient>
          <filter id="lg-bull-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="1.2" result="g"/>
            <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g filter="url(#lg-bull-glow)">
          <!-- Ears (small pointed triangles, slightly folded) -->
          <path d="M14 14 L17 4 L25 16 Z" fill="url(#lg-bull-grad)"/>
          <path d="M50 14 L47 4 L39 16 Z" fill="url(#lg-bull-grad)"/>
          <!-- Head silhouette: rounded square with jowls flaring -->
          <path d="
            M16 14
            C 16 8, 24 4, 32 4
            C 40 4, 48 8, 48 14
            L 52 26
            C 52 36, 48 42, 44 44
            L 41 50
            C 37 52, 27 52, 23 50
            L 20 44
            C 16 42, 12 36, 12 26
            Z
          " fill="url(#lg-bull-grad)"/>
        </g>
        <!-- Brow wrinkle -->
        <path d="M20 18 Q32 14 44 18" stroke="#000" stroke-width="1.4" fill="none" opacity="0.55"/>
        <!-- Eyes (square-ish slits) -->
        <rect x="20" y="22" width="6" height="4" rx="1" fill="#000"/>
        <rect x="38" y="22" width="6" height="4" rx="1" fill="#000"/>
        <!-- Eye gleam dots -->
        <circle cx="24" cy="23" r="0.7" fill="#fff" opacity="0.9"/>
        <circle cx="42" cy="23" r="0.7" fill="#fff" opacity="0.9"/>
        <!-- Snub nose -->
        <path d="M27 32 Q32 30 37 32 Q37 36 32 36 Q27 36 27 32 Z" fill="#000"/>
        <!-- Underbite mouth (slight frown line) -->
        <path d="M24 41 Q32 39 40 41" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <!-- Fangs (signature bulldog teeth) -->
        <path d="M28.5 41.2 L28.5 44.2 L30 42.5 Z" fill="#fff" opacity="0.95"/>
        <path d="M35.5 41.2 L35.5 44.2 L34 42.5 Z" fill="#fff" opacity="0.95"/>
      </svg>
      <div class="sh-logo-text">
        <span class="sh-logo-name">SLUMHOUSE</span>
        <span class="sh-logo-sub">/ TRADERS</span>
      </div>
    </a>
    <nav class="sh-nav">
      <a class="sh-pill active" href="/slumhouse/crib.html">The Crib</a>
      <a class="sh-pill" href="/slumhouse/kitchen.html">The Kitchen</a>
      <a class="sh-pill" href="/slumhouse/recipe.html">The Recipe</a>
    </nav>
    <div class="sh-header-spacer"></div>
  </header>

  <div class="sh-page">
    <h1 class="sh-title">The Crib</h1>
    <p class="sh-sub">Slumdawg's home — talk to him, see what's cooking.</p>

    <div id="sh-banner" class="sh-banner"></div>

    <!-- 2x2 grid: row heights are dictated by left column (Anam tall, Pot short),
         right column cards stretch to match row heights automatically. -->
    <div class="sh-main">
      <div class="sh-card sh-stage">
        <div class="sh-anam-host sh-anam-cover" id="sh-anam-stage">
          <span class="sh-anam-tagline">Tap below to start talking to <b>Slumdog UpTOP</b></span>
        </div>
        <button id="sh-anam-launch" class="sh-btn">Video with Slumdog UpTOP</button>
      </div>
      <div class="sh-card sh-rail-card">
        <div class="sh-rail-title">Fresh from Discord</div>
        <div id="sh-discord-feed"></div>
      </div>
      <div class="sh-card">
        <div class="sh-rail-title">In the Pot · click to peek</div>
        <div id="sh-pot" class="sh-horiz"></div>
      </div>
      <div class="sh-card sh-rail-card">
        <div class="sh-rail-title">The Crew · week leaderboard</div>
        <div id="sh-crew"></div>
      </div>
    </div>
  </div>

  <script src="/slumhouse/slumhouse.js"></script>
  <script>
    (async () => {
      const data = await SH.fetchJSON("/slumhouse/api/crib");
      if (!data) return;
      const { el, sparkline, sparkTrend } = SH;

      // ─── Premium fintech banner ─────────────────────────────────────
      const b = document.getElementById("sh-banner");
      const bag = data.banner;

      // Today's Bag
      b.appendChild(stat({
        label: "Today's Bag",
        value: bag.todayBag,
        valueClass: bag.todayBagRaw < 0 ? "red" : bag.todayBagRaw > 0 ? "green" : "",
        spark: bag.todayBagSpark,
        sub: bag.tradesToday.count > 0
          ? `${bag.tradesToday.wins}W · ${bag.tradesToday.losses}L`
          : "no trades yet",
      }));

      // Trades Today
      b.appendChild(stat({
        label: "Trades Today",
        value: String(bag.tradesToday.count),
        spark: bag.tradesSpark,
        sub: `${bag.tradesToday.wins} wins · ${bag.tradesToday.losses} losses`,
      }));

      // Open Right Now (no real time series yet — falls back to baseline)
      b.appendChild(stat({
        label: "Open Right Now",
        value: String(bag.openNow),
        sub: bag.openNow > 0 ? "live positions" : "none open",
      }));

      // In the Pot (custom SVG cooking pot with bubbling liquid + flames)
      const potTile = stat({
        label: "In the Pot",
        value: String(bag.inPot),
        valueClass: "amber",
        spark: null, // skip the default sparkline; we'll inject the pot instead
        sub: "testing",
      });
      // Replace the empty spark slot with the SVG pot chart
      const potSparkSlot = potTile.querySelector(".sh-stat-spark");
      if (potSparkSlot) {
        potSparkSlot.innerHTML = "";
        potSparkSlot.appendChild(SH.potChart(bag.inPot, { width: 320, height: 110 }));
      }
      // Steam sparkles in the top-right corner (above the lid)
      potTile.appendChild(SH.el("div", { class: "sh-tile-steam" },
        SH.el("i"), SH.el("i"), SH.el("i"), SH.el("i")));
      b.appendChild(potTile);

      // Kill switch (live pulse, no chart)
      b.appendChild(killStat(bag.killSwitch));

      // ─── Discord feed — premium intake list ─────────────────────────
      const df = document.getElementById("sh-discord-feed");
      if (data.discordFeed.length === 0) {
        df.appendChild(el("div", { class: "sh-feed-meta" }, "Nothing fresh in the queue."));
      } else {
        for (const f of data.discordFeed) {
          const sourceLower = String(f.source ?? "").toLowerCase();
          const sourceClass = sourceLower.includes("youtube") ? "youtube"
            : sourceLower.includes("discord") ? "discord"
            : "manual";
          const sourceIcon = sourceClass === "youtube" ? "▶"
            : sourceClass === "discord" ? "✦"
            : "+";
          const statusClass = String(f.status ?? "").toLowerCase();
          df.appendChild(el("div", { class: "sh-feed-item" },
            el("div", { class: `sh-feed-thumb ${sourceClass}` }, sourceIcon),
            el("div", {},
              el("div", { class: "sh-feed-name" }, f.name),
              el("div", { class: "sh-feed-meta" }, `${f.source} · ${f.ageMin}m ago`),
            ),
            el("div", { class: `sh-feed-status ${statusClass}` }, f.status),
          ));
        }
      }

      // ─── Pot — premium chips with floating steam (no chart) ─────────
      const pot = document.getElementById("sh-pot");
      if (data.pot.length === 0) {
        pot.appendChild(el("div", { class: "sh-chip-meta" }, "Nothing testing right now."));
      } else {
        for (const s of data.pot) {
          pot.appendChild(el("a", { class: "sh-chip", href: `/slumhouse/recipe.html?id=${encodeURIComponent(s.id)}` },
            el("div", { class: "sh-chip-head" },
              el("div", { class: "sh-chip-steam" },
                el("i"), el("i"), el("i"), el("i"),
              ),
              el("div", { class: "sh-chip-stage" }, s.stage),
            ),
            el("div", { class: "sh-chip-name", title: s.name }, shortName(s.name)),
            el("div", { class: "sh-chip-foot" },
              el("div", { class: "sh-chip-pnl" }, s.netPnl),
              el("div", { class: "sh-chip-meta" }, `${s.tradesCount} plays`),
            ),
          ));
        }
      }

      // Pretty-truncates a raw strategy name like
      // "extreme_band_reversal_strategy_mes_5m" → "Extreme Band Reversal"
      // Removes common operator suffixes, replaces underscores, title-cases,
      // and caps at ~22 chars so the chip stays clean.
      function shortName(raw) {
        const SUFFIX = /(_(mes|mnq|mcl|m15|m5|m1|h1|h4|5m|15m|30m|1h|4h|daily|weekly|long_v\d+|short_v\d+|short|long)){1,}$/i;
        let s = String(raw || "");
        for (let i = 0; i < 3; i++) s = s.replace(SUFFIX, ""); // strip up to 3 layered suffixes
        s = s.replace(/_/g, " ").trim();
        s = s.replace(/\b\w/g, (c) => c.toUpperCase());
        if (s.length > 22) s = s.slice(0, 20) + "…";
        return s;
      }

      // ─── Crew ───────────────────────────────────────────────────────
      const crew = document.getElementById("sh-crew");
      if (data.crew.length === 0) {
        crew.appendChild(el("div", { class: "sh-feed-meta" }, "No crew yet — operator hasn't mapped anyone."));
      } else {
        for (const c of data.crew) {
          crew.appendChild(el("div", { class: "sh-crew-row" },
            el("div", { class: "sh-jersey" }, String(c.jersey || "?")),
            el("div", { class: "sh-crew-name" }, c.displayName),
            el("div", { class: "sh-crew-pnl" }, c.weekBag),
          ));
        }
      }

      // ─── Anam launcher ──────────────────────────────────────────────
      const launch = document.getElementById("sh-anam-launch");
      launch.addEventListener("click", () => {
        const PERSONA_ID = "026cacc4-619e-4cec-a144-c4a8dfcb623e";
        const stage = document.getElementById("sh-anam-stage");
        const frame = document.createElement("iframe");
        frame.src = `https://lab.anam.ai/embed/${PERSONA_ID}`;
        frame.style.cssText = "width:100%;height:380px;border:0;border-radius:12px;background:#000";
        stage.innerHTML = "";
        stage.appendChild(frame);
        launch.style.display = "none";
      });
    })();

    function stat(opts) {
      const { el, sparkline, sparkTrend } = SH;
      const node = el("div", { class: "sh-stat" });

      // Trend pill (only when sparkline data present)
      let trendNode = null;
      if (opts.spark && opts.spark.length > 1) {
        const t = sparkTrend(opts.spark);
        const cls = "sh-stat-trend " + (t.direction === "down" ? "down" : t.direction === "up" ? "" : "flat");
        const arrow = t.direction === "down" ? "▼" : t.direction === "up" ? "▲" : "—";
        const pctText = t.direction === "flat" ? "" : ` ${Math.abs(Math.round(t.pct))}%`;
        trendNode = el("span", { class: cls }, `${arrow}${pctText}`);
      }

      node.appendChild(el("div", { class: "sh-stat-row" },
        el("div", { class: "sh-stat-label" }, opts.label),
        trendNode,
      ));
      node.appendChild(el("div", { class: "sh-stat-val " + (opts.valueClass || "") }, opts.value));

      node.appendChild(el("div", { class: "sh-stat-sub" }, opts.sub || ""));

      // Chart slot — bottom 60% of card, full-bleed.
      // - If opts.spark is an array → render sparkline (real or placeholder).
      // - If opts.spark === null → leave slot empty (caller will inject
      //   custom content, e.g. the SVG pot chart on the "In the Pot" tile).
      const sparkBox = el("div", { class: "sh-stat-spark" });
      if (opts.spark !== null) {
        const spark = (opts.spark && opts.spark.length >= 2)
          ? opts.spark
          : baselineSpark(opts.value);
        sparkBox.appendChild(sparkline(spark, { width: 320, height: 110 }));
      }
      node.appendChild(sparkBox);

      return node;
    }

    // Generates a 12-point subtle placeholder series. Used when the backend
    // returns no historical data yet — keeps the chart slot visually filled
    // with a calm baseline that doesn't pretend to show real activity.
    function baselineSpark(displayValue, len) {
      const N = len || 12;
      const v = (typeof displayValue === "number")
        ? displayValue
        : parseFloat(String(displayValue).replace(/[^\d.\-−]/g, "")) || 0;
      const out = [];
      const drift = Math.abs(v) * 0.04 + 1;
      for (let i = 0; i < N - 1; i++) {
        out.push(v * 0.6 + Math.sin(i * 0.7) * drift + (Math.random() - 0.5) * drift * 0.4);
      }
      out.push(v); // last point lands on the current value
      return out;
    }

    function killStat(state) {
      const { el } = SH;
      const isGreen = state === "green";
      const node = el("div", { class: "sh-stat" });

      node.appendChild(el("div", { class: "sh-stat-row" },
        el("div", { class: "sh-stat-label" }, "Kill Switch"),
        el("span", { class: "sh-stat-trend " + (isGreen ? "" : "down") }, isGreen ? "LIVE" : "HALT"),
      ));
      node.appendChild(el("div", { class: "sh-stat-val " + (isGreen ? "green" : "red") }, isGreen ? "Green" : "Red"));
      node.appendChild(el("div", { class: "sh-stat-sub" }, isGreen ? "bot running" : "bot halted"));

      // 3D toggle switch visual — fills the chart slot
      const toggleSlot = el("div", { class: "sh-stat-spark sh-killswitch-slot" });
      const toggle = el("div", { class: "sh-killswitch " + (isGreen ? "on" : "off") });
      const track = el("div", { class: "sh-killswitch-track" });
      const knob = el("div", { class: "sh-killswitch-knob" });
      track.appendChild(knob);
      toggle.appendChild(track);
      toggleSlot.appendChild(toggle);
      node.appendChild(toggleSlot);
      return node;
    }
  </script>
</body>
</html>
