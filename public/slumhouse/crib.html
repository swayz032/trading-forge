  <div class="sh-page">
    <h1 class="sh-title">The Crib</h1>
    <p class="sh-sub">Slumdawg's home — talk to him, see what's cooking.
      <span id="sh-exec-mode-badge" style="display:none;margin-left:10px;font-size:9px;padding:3px 10px;border-radius:999px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;vertical-align:middle;"></span>
    </p>

    <!-- deepscan17-wave2 (2026-07-05): tower-disconnect banner. NEVER let a stale
         "Kill Switch · Green" sit silently on a family PWA when the tower is down. -->
    <div id="sh-stale-banner" role="alert" style="display:none;margin:0 0 12px;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;letter-spacing:0.03em;color:#ffd9a0;background:rgba(120,80,0,0.25);border:1px solid rgba(255,190,90,0.4);"></div>
    <p id="sh-account-disclosure" class="sh-sub" style="display:none;margin-top:-4px;color:var(--mute,#8a938a);"></p>

    <div id="sh-banner" class="sh-banner"></div>

    <!-- 2x2 grid: row heights are dictated by left column (Anam tall, Pot short),
         right column cards stretch to match row heights automatically. -->
    <div class="sh-main">
      <div class="sh-card sh-stage">

  <script src="/slumhouse/slumhouse.js"></script>
  <script>
    // ─── Welcome modal — fires once per login ──────────────────────────
    (function initWelcome() {
      const cookies = Object.fromEntries(
        document.cookie.split(/;\s*/).filter(Boolean).map(p => {
          const i = p.indexOf("=");
          return [decodeURIComponent(p.slice(0, i)), decodeURIComponent(p.slice(i + 1))];
        })
      );
      if (cookies.slumhouse_welcome !== "1") return;
      // Clear the cookie immediately so it doesn't re-fire on refresh
      document.cookie = "slumhouse_welcome=; Max-Age=0; Path=/slumhouse";

      const backdrop = document.createElement("div");
      backdrop.className = "sw-backdrop";
      backdrop.innerHTML = `
        <div class="sw-card" role="dialog" aria-modal="true" aria-labelledby="sw-title">
          <button class="sw-close" aria-label="Close">×</button>
          <div class="sw-hero"></div>
          <div class="sw-body">
            <div class="sw-eyebrow">Slum Member</div>
            <h2 id="sw-title" class="sw-title">Welcome Back<br><b>to the Hood</b></h2>
            <div class="sw-chips" id="sw-chips"></div>
            <button class="sw-cta" type="button">Continue</button>
          </div>
        </div>
      `;
      document.body.appendChild(backdrop);

      function dismiss() {
        if (chipPollTimer) { clearInterval(chipPollTimer); chipPollTimer = null; } // DS19: stop re-poll once modal closes
        backdrop.style.transition = "opacity 0.2s ease";
        backdrop.style.opacity = "0";
        setTimeout(() => backdrop.remove(), 200);
      }

      backdrop.querySelector(".sw-cta").addEventListener("click", dismiss);
      backdrop.querySelector(".sw-close").addEventListener("click", dismiss);
      document.addEventListener("keydown", function esc(e) {
        if (e.key === "Escape") { dismiss(); document.removeEventListener("keydown", esc); }
      });

      // Live chips pulled from /crib API (best-effort — modal still works without).
      // DS19 (H-crib-html): (1) the kill chip now shows GREEN only when the value is
      // EXPLICITLY "green" — any other value (red / unknown / undefined / stale) reads
      // red, so an errored/missing read can never present as a reassuring green. (2) the
      // chips RE-POLL on the same cadence as the kill-tile watchdog (KILL_POLL_MS) so a
      // family member with the welcome modal open never watches a forever-stale number.
      const CHIP_POLL_MS = 15000; // matches KILL_POLL_MS in the kill-tile watchdog below
      let chipPollTimer = null;
      function renderChips(b) {
        const chips = backdrop.querySelector("#sw-chips");
        if (!chips || !b) return;
        const todayCls = b.todayBagRaw < 0 ? "red" : b.todayBagRaw > 0 ? "" : "dim";
        const killGreen = b.killSwitch === "green"; // explicit-healthy only
        chips.innerHTML = `
          <span class="sw-chip ${todayCls}">Today's bag · ${b.todayBag}</span>
          <span class="sw-chip dim">${b.openNow} open</span>
          <span class="sw-chip ${killGreen ? "" : "red"}">Kill switch · ${killGreen ? "Green" : "Red"}</span>
        `;
      }
      function pollChips() {
        SH.fetchJSON("/slumhouse/api/crib").then(data => {
          if (data && data.banner) renderChips(data.banner);
        }).catch(() => {});
      }
      pollChips();
      chipPollTimer = setInterval(pollChips, CHIP_POLL_MS);
    })();
  </script>

  <script>
    // ─── Kill-switch staleness watchdog (deepscan17-wave2, 2026-07-05) ──────
    // WHY: the crib is a family PWA left open on a screen. The page fetches
    // /slumhouse/api/crib once and never refreshes, so a dead tower leaves
    // "Kill Switch · Green / bot running" frozen with zero signal. Mirror the
    // Office (office-risk.js): re-poll, track the last SUCCESSFUL poll, and
    // degrade the safety-critical stat + show a disconnect banner when the poll
    // fails or the data ages past threshold. NEVER a silent frozen-green tile.
    const KILL_POLL_MS = 15000;   // re-fetch cadence
    const KILL_TICK_MS = 1000;    // "Xs ago" counter refresh
    const KILL_STALE_MS = 45000;  // older than this (or poll failing) ⇒ degrade
    let killLastState = "red";    // last known kill-switch color
    let killLastOkTs = 0;         // ms epoch of last SUCCESSFUL /api/crib poll
    // deepscan18 H-F2 (2026-07-05): tracks whether the initial full render succeeded.
    // When the tower is down AT LOAD the render IIFE bails before building any tiles, so
    // a later recovery poll has nothing to update — it must reload to run the full render.
    let cribInitialRenderOk = false;

    function updateStaleBanner(stale, ageSecs) {
      const banner = document.getElementById("sh-stale-banner");
      if (!banner) return;
      if (stale) {
        banner.textContent =
          "Can't reach the tower — showing the last status from " + ageSecs +
          "s ago. Safety switches are NOT being checked right now. If this stays up, tell Tony.";
        banner.style.display = "block";
      } else {
        banner.style.display = "none";
      }
    }

    // Re-renders the kill-switch tile in place. stale=true forces an explicit
    // "Unknown / data stale" state so a frozen page never reads as "bot running".
    function renderKillTile(state, stale, ageSecs) {
      const cur = document.getElementById("sh-killswitch-tile");
      if (!cur) return;
      cur.replaceWith(killStat(state, { stale: stale, ageSecs: ageSecs }));
    }

    function killTick() {
      if (!killLastOkTs) return;
      const age = Date.now() - killLastOkTs;
      if (age > KILL_STALE_MS) {
        const ageSecs = Math.round(age / 1000);
        renderKillTile(killLastState, true, ageSecs);
        updateStaleBanner(true, ageSecs);
      }
    }

    async function killPoll() {
      // SH.fetchJSON returns null on any failure (never throws). On null we keep
      // the last-known state; killTick() degrades the tile as it ages.
      const data = await SH.fetchJSON("/slumhouse/api/crib");
      const bag = data && data.banner;
      const ks = bag && bag.killSwitch;
      if (ks === "green" || ks === "red") {
        // deepscan18 H-F2: if the initial cold-load failed (blank crib — the kill tile
        // and banner content were never built), recover by reloading to run the full
        // render now that the tower is reachable again. Otherwise update in place.
        if (!cribInitialRenderOk) { location.reload(); return; }
        killLastState = ks;
        killLastOkTs = Date.now();
        renderKillTile(killLastState, false, 0);
        updateStaleBanner(false, 0);
        // DS19 (H-crib-html): refresh the four one-shot data tiles on the same 15s
        // cadence so "Today's Bag" / "Trades Today" / "Open Right Now" / "In the Pot"
        // track live numbers instead of freezing at their cold-load values.
        refreshBannerTiles(bag);
      }
    }

    // DS19 (H-crib-html): builds the four banner data tiles from a fresh `bag` payload,
    // each stamped with a stable id so refreshBannerTiles() can swap them in place.
    // Used by both the initial cold-load render and the killPoll re-poll cycle.
    function buildBannerTiles(bag) {
      const today = stat({
        label: "Today's Bag",
        value: bag.todayBag,
        valueClass: bag.todayBagRaw < 0 ? "red" : bag.todayBagRaw > 0 ? "green" : "",
        spark: bag.todayBagSpark,
        sub: bag.tradesToday.count > 0
          ? `${bag.tradesToday.wins}W · ${bag.tradesToday.losses}L`
          : "no trades yet",
      });
      today.id = "sh-tile-todaybag";

      const trades = stat({
        label: "Trades Today",
        value: String(bag.tradesToday.count),
        spark: bag.tradesSpark,
        sub: `${bag.tradesToday.wins} wins · ${bag.tradesToday.losses} losses`,
      });
      trades.id = "sh-tile-trades";

      const open = stat({
        label: "Open Right Now",
        value: String(bag.openNow),
        sub: bag.openNow > 0 ? "live positions" : "none open",
      });
      open.id = "sh-tile-open";

      // In the Pot (custom SVG cooking pot with bubbling liquid + flames)
      const potTile = stat({
        label: "In the Pot",
        value: String(bag.inPot),
        valueClass: "amber",
        spark: null, // skip the default sparkline; we'll inject the pot instead
        sub: "testing",
      });
      potTile.id = "sh-tile-pot";
      const potSparkSlot = potTile.querySelector(".sh-stat-spark");
      if (potSparkSlot) {
        potSparkSlot.innerHTML = "";
        potSparkSlot.appendChild(SH.potChart(bag.inPot, { width: 320, height: 110 }));
      }
      // Steam sparkles in the top-right corner (above the lid)
      potTile.appendChild(SH.el("div", { class: "sh-tile-steam" },
        SH.el("i"), SH.el("i"), SH.el("i"), SH.el("i")));

      return { today, trades, open, potTile };
    }

    // DS19 (H-crib-html): re-renders the four data tiles in place from a fresh `bag`.
    // No-ops for any tile whose node isn't present (e.g. cold-load never built them).
    function refreshBannerTiles(bag) {
      if (!bag) return;
      const tiles = buildBannerTiles(bag);
      const map = {
        "sh-tile-todaybag": tiles.today,
        "sh-tile-trades": tiles.trades,
        "sh-tile-open": tiles.open,
        "sh-tile-pot": tiles.potTile,
      };
      for (const id in map) {
        const cur = document.getElementById(id);
        if (cur) cur.replaceWith(map[id]);
      }
    }

    (async () => {
      const data = await SH.fetchJSON("/slumhouse/api/crib");
      if (!data) {
        // deepscan18 H-F2 (2026-07-05): tower down AT LOAD. Previously this early-return
        // left a blank crib with NO disconnect banner and NO recovery (the watchdog +
        // re-poll intervals used to be registered further down inside this IIFE, so a
        // first-fetch failure skipped them entirely). Surface the disconnect banner
        // immediately so a family member never stares at a blank page thinking all is
        // well; the killPoll interval (registered unconditionally below) reloads on
        // recovery. Mirrors office-risk.js start(), which polls unconditionally.
        updateStaleBanner(true, 0);
        return;
      }
      cribInitialRenderOk = true;
      const { el, sparkline, sparkTrend } = SH;

      // ─── Execution mode badge ───────────────────────────────────────
      (function () {
        const badge = document.getElementById("sh-exec-mode-badge");
        if (!badge || !data.executionModeLabel) return;
        badge.textContent = data.executionModeLabel;
        const isLive = data.executionMode === "live";
        badge.style.background = isLive ? "rgba(163,255,18,0.14)" : "rgba(255,255,255,0.06)";
        badge.style.color = isLive ? "var(--lime)" : "var(--mute,#666)";
        badge.style.display = "inline-block";
      }());

      // ─── Account-data disclosure (deepscan17-wave2, 2026-07-05) ─────────
      // Backend emits accountDisclosure (plain English) when account-scoped
      // numbers are NOT real (no broker mapping, or live-mode not wired). Surface
      // it so a bare $0 never reads as "I lost nothing".
      (function () {
        const note = document.getElementById("sh-account-disclosure");
        if (!note || !data.accountDisclosure) return;
        note.textContent = data.accountDisclosure;
        note.style.display = "block";
      }());

      // ─── Premium fintech banner ─────────────────────────────────────
      const b = document.getElementById("sh-banner");
      const bag = data.banner;

      // DS19 (H-crib-html): these four tiles were built ONCE at cold-load and never
      // refreshed — a family member would watch stale P&L / trade counts / open
      // positions forever. They are now built via buildBannerTiles() (below) with
      // stable ids so killPoll (the same 15s watchdog cadence that refreshes the kill
      // tile) re-renders them in place. See refreshBannerTiles().
      const initTiles = buildBannerTiles(bag);
      b.appendChild(initTiles.today);
      b.appendChild(initTiles.trades);
      b.appendChild(initTiles.open);
      b.appendChild(initTiles.potTile);

      // Kill switch (live pulse, no chart)
      killLastState = bag.killSwitch === "green" ? "green" : "red";
      killLastOkTs = Date.now();
      b.appendChild(killStat(killLastState));
      // deepscan18 H-F2: the staleness watchdog + re-poll intervals are now registered
      // UNCONDITIONALLY after this IIFE (see below) so a tower-down-at-load still gets a
      // disconnect banner + recovery. They used to be registered here, inside the IIFE,
      // which the cold-load early-return skipped — leaving a blank, silent, dead crib.

      // ─── Discord feed — premium intake list ─────────────────────────
      const df = document.getElementById("sh-discord-feed");
      if (data.discordFeed.length === 0) {
        df.appendChild(el("div", { class: "sh-feed-meta" }, "Nothing fresh in the queue."));
      } else {
        for (const f of data.discordFeed) {
          const sourceLower = String(f.source ?? "").toLowerCase();
          const sourceClass = sourceLower.includes("youtube") ? "youtube"
            : sourceLower.includes("discord") ? "discord"
            : "manual";
          const sourceIcon = sourceClass === "youtube" ? "▶"
            : sourceClass === "discord" ? "✦"
            : "+";
          const statusClass = String(f.status ?? "").toLowerCase();
          df.appendChild(el("div", { class: "sh-feed-item" },
            el("div", { class: `sh-feed-thumb ${sourceClass}` }, sourceIcon),
            el("div", {},
              el("div", { class: "sh-feed-name" }, f.name),
              el("div", { class: "sh-feed-meta" }, `${f.source} · ${f.ageMin}m ago`),
            ),
            el("div", { class: `sh-feed-status ${statusClass}` }, f.status),
          ));
        }
      }

      // ─── Pot — premium chips with floating steam (no chart) ─────────
      const pot = document.getElementById("sh-pot");
      if (data.pot.length === 0) {
        pot.appendChild(el("div", { class: "sh-chip-meta" }, "Nothing testing right now."));
      } else {
        for (const s of data.pot) {
          pot.appendChild(el("a", { class: "sh-chip", href: `/slumhouse/recipe.html?id=${encodeURIComponent(s.id)}` },
            el("div", { class: "sh-chip-head" },
              el("div", { class: "sh-chip-steam" },
                el("i"), el("i"), el("i"), el("i"),
              ),
              el("div", { class: "sh-chip-stage" }, s.stage),
            ),
            el("div", { class: "sh-chip-name", title: s.name }, shortName(s.name)),
            el("div", { class: "sh-chip-foot" },
              el("div", { class: "sh-chip-pnl" }, s.netPnl),
              el("div", { class: "sh-chip-meta" }, `${s.tradesCount} plays`),
            ),
          ));
        }
      }

      // Pretty-truncates a raw strategy name like
      // "extreme_band_reversal_strategy_mes_5m" → "Extreme Band Reversal"
      // Removes common operator suffixes, replaces underscores, title-cases,
      // and caps at ~22 chars so the chip stays clean.
      function shortName(raw) {
        const SUFFIX = /(_(mes|mnq|mcl|m15|m5|m1|h1|h4|5m|15m|30m|1h|4h|daily|weekly|long_v\d+|short_v\d+|short|long)){1,}$/i;
        let s = String(raw || "");
        for (let i = 0; i < 3; i++) s = s.replace(SUFFIX, ""); // strip up to 3 layered suffixes
        s = s.replace(/_/g, " ").trim();
        s = s.replace(/\b\w/g, (c) => c.toUpperCase());
        if (s.length > 22) s = s.slice(0, 20) + "…";
        return s;
      }

      // ─── Crew ───────────────────────────────────────────────────────
      const crew = document.getElementById("sh-crew");
      if (data.crew.length === 0) {
        crew.appendChild(el("div", { class: "sh-feed-meta" }, "No crew yet — operator hasn't mapped anyone."));
      } else {
        for (const c of data.crew) {
          crew.appendChild(el("div", { class: "sh-crew-row" },
            el("div", { class: "sh-jersey" }, String(c.jersey || "?")),
            el("div", { class: "sh-crew-name" }, c.displayName),
            el("div", { class: "sh-crew-pnl" }, c.weekBag),
          ));
        }
      }

      // ─── Anam launcher ──────────────────────────────────────────────
      const launch = document.getElementById("sh-anam-launch");
      let anamClient = null;
      launch.addEventListener("click", async () => {
        const stage = document.getElementById("sh-anam-stage");
        const originalLabel = launch.innerHTML;
        launch.disabled = true;
        launch.innerHTML = '<span>•</span> Connecting…';
        try {
          const r = await fetch("/slumhouse/api/anam-session", { method: "POST", credentials: "include" });
          if (!r.ok) throw new Error("session_mint_failed_" + r.status);
          const { sessionToken } = await r.json();
          if (!sessionToken) throw new Error("no_session_token");

          stage.classList.remove("sh-anam-cover");
          stage.innerHTML = "";
          const video = document.createElement("video");
          video.id = "sh-anam-video";
          video.autoplay = true;
          video.playsInline = true;
          video.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;";
          stage.appendChild(video);

          const hangup = document.createElement("button");
          hangup.id = "sh-anam-hangup";
          hangup.className = "sh-anam-hangup";
          hangup.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91" transform="rotate(135 12 12)"/></svg> End';
          stage.appendChild(hangup);
          hangup.addEventListener("click", async (ev) => {
            ev.stopPropagation();
            try { if (anamClient) await anamClient.stopStreaming(); } catch (_) {}
            anamClient = null;
            stage.classList.add("sh-anam-cover");
            stage.innerHTML = "";
            stage.appendChild(launch);
            launch.disabled = false;
            launch.innerHTML = originalLabel;
          });

          const { createClient } = await import("https://esm.sh/@anam-ai/js-sdk@latest");
          anamClient = createClient(sessionToken, {
            // Pin HD bitrate from session start — better-looking SDK avatar feed.
            // SDK will adaptively scale down if bandwidth drops, then back up.
            sessionOptions: { videoQuality: "high" },
          });
          await anamClient.streamToVideoElement("sh-anam-video");
        } catch (e) {
          console.error("[slumhouse] anam launch failed", e);
          launch.disabled = false;
          launch.innerHTML = originalLabel;
          alert("Couldn't connect to Slumdog UpTOP. Try again in a sec.");
        }
      });
    })();

    // deepscan18 H-F2 (2026-07-05): register the staleness watchdog + re-poll intervals
    // UNCONDITIONALLY, outside the async render IIFE above. This runs even when the initial
    // /api/crib fetch fails (tower down at load) — so the crib always re-polls, always shows
    // the disconnect banner while unreachable, and always recovers when the tower returns
    // (killPoll reloads the page on the first successful poll if the cold-load render bailed).
    // Mirrors office-risk.js start() which polls unconditionally regardless of first-fetch.
    setInterval(killTick, KILL_TICK_MS);
    setInterval(killPoll, KILL_POLL_MS);

    function stat(opts) {
      const { el, sparkline, sparkTrend } = SH;
      const node = el("div", { class: "sh-stat" });

      // Trend pill (only when sparkline data present)
      let trendNode = null;
      if (opts.spark && opts.spark.length > 1) {
        const t = sparkTrend(opts.spark);
        const cls = "sh-stat-trend " + (t.direction === "down" ? "down" : t.direction === "up" ? "" : "flat");
        const arrow = t.direction === "down" ? "▼" : t.direction === "up" ? "▲" : "—";
        const pctText = t.direction === "flat" ? "" : ` ${Math.abs(Math.round(t.pct))}%`;
        trendNode = el("span", { class: cls }, `${arrow}${pctText}`);
      }

      node.appendChild(el("div", { class: "sh-stat-row" },
        el("div", { class: "sh-stat-label" }, opts.label),
        trendNode,
      ));
      node.appendChild(el("div", { class: "sh-stat-val " + (opts.valueClass || "") }, opts.value));

      node.appendChild(el("div", { class: "sh-stat-sub" }, opts.sub || ""));

      // Chart slot — bottom 60% of card, full-bleed.
      // - If opts.spark is an array → render sparkline (real or placeholder).
      // - If opts.spark === null → leave slot empty (caller will inject
      //   custom content, e.g. the SVG pot chart on the "In the Pot" tile).
      const sparkBox = el("div", { class: "sh-stat-spark" });
      if (opts.spark !== null) {
        const spark = (opts.spark && opts.spark.length >= 2)
          ? opts.spark
          : baselineSpark(opts.value);
        sparkBox.appendChild(sparkline(spark, { width: 320, height: 110 }));
      }
      node.appendChild(sparkBox);

      return node;
    }

    // Generates a 12-point subtle placeholder series. Used when the backend
    // returns no historical data yet — keeps the chart slot visually filled
    // with a calm baseline that doesn't pretend to show real activity.
    function baselineSpark(displayValue, len) {
      const N = len || 12;
      const v = (typeof displayValue === "number")
        ? displayValue
        : parseFloat(String(displayValue).replace(/[^\d.\-−]/g, "")) || 0;
      const out = [];
      const drift = Math.abs(v) * 0.04 + 1;
      for (let i = 0; i < N - 1; i++) {
        out.push(v * 0.6 + Math.sin(i * 0.7) * drift + (Math.random() - 0.5) * drift * 0.4);
      }
      out.push(v); // last point lands on the current value
      return out;
    }

    // deepscan17-wave2 (2026-07-05): opts.stale forces an explicit "data stale"
    // state (amber "Unknown", off-toggle) so a frozen page can never keep showing
    // a reassuring green "bot running" when the tower is unreachable.
    function killStat(state, opts) {
      const { el } = SH;
      opts = opts || {};
      const stale = !!opts.stale;
      const isGreen = state === "green" && !stale;
      const node = el("div", { class: "sh-stat" + (stale ? " sh-stat-stale" : ""), id: "sh-killswitch-tile" });

      const trendText = stale ? "STALE" : (isGreen ? "LIVE" : "HALT");
      node.appendChild(el("div", { class: "sh-stat-row" },
        el("div", { class: "sh-stat-label" }, "Kill Switch"),
        el("span", { class: "sh-stat-trend " + (isGreen ? "" : "down") }, trendText),
      ));
      const valText = stale ? "Unknown" : (isGreen ? "Green" : "Red");
      const valClass = stale ? "amber" : (isGreen ? "green" : "red");
      node.appendChild(el("div", { class: "sh-stat-val " + valClass }, valText));
      const subText = stale
        ? ("data stale — last seen " + (opts.ageSecs || 0) + "s ago")
        : (isGreen ? "bot running" : "bot halted");
      node.appendChild(el("div", { class: "sh-stat-sub" }, subText));

      // 3D toggle switch visual — fills the chart slot. Stale ⇒ show "off" so the
      // green ON position never implies a running bot we can no longer confirm.
      const toggleSlot = el("div", { class: "sh-stat-spark sh-killswitch-slot" });
      const toggle = el("div", { class: "sh-killswitch " + (isGreen ? "on" : "off") });
      const track = el("div", { class: "sh-killswitch-track" });
      const knob = el("div", { class: "sh-killswitch-knob" });
      track.appendChild(knob);
      toggle.appendChild(track);
      toggleSlot.appendChild(toggle);
      node.appendChild(toggleSlot);
      return node;
    }
  </script>
</body>
