<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slumhouse · The Office</title>
  <link rel="stylesheet" href="/slumhouse/slumhouse.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/slumhouse/icons/slumdawg-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/slumhouse/icons/slumdawg-180.png">
  <meta name="theme-color" content="#000000">
  <style>
    /* ── The Office — Pass 2 (SlumDawg room background) ─────────────────────
       Floating switch-cards land in Pass 3. */
    .of-hide { display: none !important; }

    /* Pass 2: SlumDawg Traders room backdrop with a dark scrim for readability */
    body {
      background:
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.72)),
        url('/slumhouse/images/office-bg.png') center center / cover no-repeat fixed,
        #000;
    }

    /* Passcode lock screen — centered glassy card on pure black */
    .of-lock {
      min-height: 78vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .of-lock-card {
      width: 100%;
      max-width: 360px;
      /* glassy panel floating over the room */
      background: rgba(8, 10, 8, 0.55);
      backdrop-filter: blur(20px) saturate(1.15);
      -webkit-backdrop-filter: blur(20px) saturate(1.15);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 16px;
      padding: 30px 26px 26px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 24px 60px rgba(0, 0, 0, 0.55),
        0 0 50px rgba(163, 255, 18, 0.07);
      text-align: center;
    }
    .of-lock-badge {
      width: 46px; height: 46px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(163, 255, 18, 0.10);
      box-shadow: 0 0 18px rgba(163, 255, 18, 0.25);
      margin-bottom: 14px;
    }
    .of-lock-title {
      font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em;
      margin: 0 0 4px;
    }
    .of-lock-sub {
      font-size: 12px; color: var(--mute); margin: 0 0 20px; letter-spacing: 0.02em;
    }
    .of-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      font-family: var(--num-font);
      font-size: 15px;
      letter-spacing: 0.3em;
      text-align: center;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .of-input:focus {
      border-color: var(--lime-dim);
      box-shadow: 0 0 0 3px rgba(163, 255, 18, 0.08);
    }
    .of-btn {
      width: 100%;
      margin-top: 12px;
      background: var(--lime);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.04em;
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }
    .of-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .of-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .of-msg { min-height: 16px; margin-top: 12px; font-size: 12px; letter-spacing: 0.02em; }
    .of-msg.err { color: var(--red); }
    .of-msg.warn { color: var(--warm); }

    /* Pass 3: BIG wide floating 3D switch-cards, centered on the page (coverflow) */
    #of-shell { min-height: calc(100vh - 168px); display: flex; flex-direction: column; justify-content: center; }
    .of-carousel { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .of-stage3d {
      position: relative; flex: 1; max-width: 1500px; height: min(66vh, 540px);
      perspective: 1150px; perspective-origin: center 50%; overflow: visible;
    }
    .of-track { position: absolute; inset: 0; transform-style: preserve-3d; }
    .of-card3d {
      position: absolute; top: 50%; left: 50%;
      width: min(620px, 62vw); height: min(410px, 60vh);
      border-radius: 26px; overflow: hidden;
      background:
        radial-gradient(135% 95% at 50% -12%, rgba(163,255,18,0.08), transparent 56%),
        linear-gradient(158deg, rgba(28, 34, 30, 0.99), rgba(10, 13, 11, 0.995));
      border: 1px solid rgba(163, 255, 18, 0.20);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        inset 0 -40px 80px rgba(0,0,0,0.35),
        0 36px 80px rgba(0,0,0,0.70),
        0 0 34px rgba(163,255,18,0.08);
      display: flex; flex-direction: column; justify-content: center; padding: 44px 50px;
      transition: transform 0.55s cubic-bezier(0.2,0.7,0.2,1), opacity 0.45s, box-shadow 0.45s, border-color 0.45s;
      cursor: pointer; will-change: transform, opacity;
    }
    .of-card3d::before {
      content: ""; position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(163,255,18,0.55), transparent);
    }
    .of-card-top { display: flex; align-items: center; justify-content: space-between; }
    .of-card-eyebrow { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
    .of-card-badge {
      font-family: var(--num-font); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 5px 13px; border-radius: 999px; color: var(--mute);
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10);
    }
    .of-card-badge.on  { color: var(--lime); background: rgba(163,255,18,0.12); border-color: rgba(163,255,18,0.40); box-shadow: 0 0 14px rgba(163,255,18,0.22); }
    .of-card-badge.off { color: var(--red);  background: rgba(255,99,99,0.10); border-color: rgba(255,99,99,0.35); }
    .of-card-title { margin-top: 16px; font-size: 42px; font-weight: 800; color: var(--ink); letter-spacing: 0.004em; line-height: 1.04; }
    .of-card-sub { margin-top: 12px; font-size: 16px; color: var(--dim); line-height: 1.45; max-width: 90%; }
    /* explicit ON / OFF meanings (color-coded) */
    .of-onoff { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
    .of-on, .of-off { display: flex; gap: 12px; align-items: baseline; font-size: 15px; line-height: 1.4; color: var(--ink); }
    .of-on .lbl, .of-off .lbl { flex-shrink: 0; min-width: 36px; font-family: var(--num-font); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; }
    .of-on .lbl  { color: var(--lime); }
    .of-off .lbl { color: var(--red); }
    .of-locknote { margin-top: 14px; font-size: 13px; color: var(--warm); letter-spacing: 0.01em; }
    .of-card-slot {
      margin-top: auto; display: flex; align-items: center; gap: 9px;
      font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute);
    }
    .of-card-slot .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mute); }
    /* Pass 4: the switch (lime pill toggle) */
    .of-toggle-row { margin-top: 30px; display: flex; align-items: center; gap: 20px; }
    /* 3D toggle: recessed track + raised spherical knob */
    .of-toggle {
      position: relative; width: 100px; height: 48px; border-radius: 999px; flex-shrink: 0;
      background: linear-gradient(#191c19, #0b0d0b);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.75), inset 0 -1px 0 rgba(255,255,255,0.04);
      cursor: pointer; transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .of-knob {
      position: absolute; top: 5px; left: 5px; width: 38px; height: 38px; border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #9c9c9c, #565656 68%, #3a3a3a);
      box-shadow: 0 4px 9px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.5), inset 0 -3px 4px rgba(0,0,0,0.45);
      transition: transform 0.38s cubic-bezier(0.2,0.8,0.2,1), background 0.3s, box-shadow 0.3s;
    }
    /* GREEN — running (knob slides right; whole pill pulses green) */
    .of-toggle.on {
      background: linear-gradient(rgba(163,255,18,0.20), rgba(70,120,8,0.12)); border-color: rgba(163,255,18,0.6);
      animation: ofPulseGreen 1.8s ease-in-out infinite;
    }
    .of-toggle.on .of-knob {
      transform: translateX(52px);
      background: radial-gradient(circle at 35% 28%, #e6ffae, var(--lime) 62%, #7cbf0c);
      box-shadow: 0 4px 9px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.6), 0 0 14px rgba(163,255,18,0.8);
    }
    /* RED — paused / halted (knob left; whole pill pulses red) */
    .of-toggle.alert {
      background: linear-gradient(rgba(255,80,80,0.20), rgba(130,18,18,0.12)); border-color: rgba(255,99,99,0.6);
      animation: ofPulseRed 1.4s ease-in-out infinite;
    }
    .of-toggle.alert .of-knob {
      background: radial-gradient(circle at 35% 28%, #ffbfbf, #ff5757 62%, #c01e1e);
      box-shadow: 0 4px 9px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.5), 0 0 14px rgba(255,90,90,0.8);
    }
    .of-toggle.disabled { opacity: 0.45; cursor: not-allowed; animation: none; }
    @keyframes ofPulseGreen {
      0%,100% { box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 0 14px rgba(163,255,18,0.45); border-color: rgba(163,255,18,0.45); }
      50%     { box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 0 44px rgba(163,255,18,0.95); border-color: rgba(163,255,18,0.9); }
    }
    @keyframes ofPulseRed {
      0%,100% { box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 0 14px rgba(255,90,90,0.45); border-color: rgba(255,99,99,0.45); }
      50%     { box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 0 44px rgba(255,90,90,0.95); border-color: rgba(255,99,99,0.9); }
    }
    .of-status { font-family: var(--num-font); font-size: 24px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
    .of-status.on    { color: var(--lime); text-shadow: 0 0 16px rgba(163,255,18,0.45); }
    .of-status.alert { color: var(--red); text-shadow: 0 0 16px rgba(255,90,90,0.45); }
    .of-status.paused { color: var(--dim); }   /* PAUSED = blank/neutral, not red */
    .of-status.on { color: var(--lime); }
    .of-status.off { color: var(--red); }
    .of-card3d.is-active {
      transform: translate(-50%, -50%) translateZ(60px) scale(1) rotateY(0deg); opacity: 1; z-index: 5;
      border-color: rgba(163,255,18,0.6);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.13),
        inset 0 -40px 90px rgba(0,0,0,0.30),
        0 44px 100px rgba(0,0,0,0.72),
        0 0 64px rgba(163,255,18,0.24);
      cursor: default;
    }
    /* single-card mode: only the active card shows; others fade out (no side peek) */
    .of-card3d.is-prev,
    .of-card3d.is-next,
    .of-card3d.is-far { transform: translate(-50%, -50%) scale(0.94); opacity: 0; z-index: 1; pointer-events: none; }
    .of-arrow {
      position: relative; z-index: 20;
      flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%;
      background: rgba(8,12,8,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12); color: var(--ink);
      font-size: 22px; line-height: 1; cursor: pointer;
      transition: background 0.15s, transform 0.15s, border-color 0.15s;
    }
    .of-arrow:hover { background: rgba(163,255,18,0.12); border-color: var(--lime-dim); transform: translateY(-1px); }
    .of-dots { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
    .of-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.18); cursor: pointer; transition: background 0.15s, transform 0.15s; border: none; padding: 0; }
    .of-dot.on { background: var(--lime); box-shadow: 0 0 10px var(--lime); transform: scale(1.25); }
    .of-lock-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-left: auto;
      color: rgba(255, 120, 120, 0.85);
      background: rgba(40, 0, 0, 0.0);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    .of-lock-link:hover { background: rgba(40, 0, 0, 0.55); transform: translateY(-1px); }

    /* ─────────────────────────────────────────────────────────────────────────
       iPhone Pro (393pt) + Pro Max (430pt) portrait optimization.
       Header nav stacks onto its own row (was overflowing off-screen); card is
       sized to its CONTENT (no tall stretch); notch/home-indicator safe areas;
       16px passcode input (stops iOS auto-zoom on focus).
       ───────────────────────────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      /* HEADER: logo + lock on row 1, the 3 nav pills full-width on row 2 so
         they're all visible (slumhouse.css packs them in one row → overflow). */
      .sh-header {
        grid-template-columns: 1fr auto;
        grid-template-areas: "logo tools" "nav nav";
        row-gap: 10px; column-gap: 8px;
        padding: 12px 14px 8px;
      }
      .sh-logo { grid-area: logo; }
      .sh-header-spacer { grid-area: tools; min-width: 0; }
      .sh-nav { grid-area: nav; width: 100%; justify-content: center; }
      .sh-pill { padding: 8px 15px; font-size: 12px; }

      .sh-page {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-bottom: 16px;
      }

      /* CAROUSEL: one card centered, sized to its content (NOT stretched tall). */
      #of-shell {
        min-height: calc(100svh - 150px);
        padding-bottom: calc(env(safe-area-inset-bottom) + 8px);
      }
      .of-carousel { gap: 2px; }
      .of-stage3d { height: min(60svh, 470px); perspective: 1050px; }
      /* content-sized card — drop the min/max-height that stretched it tall */
      .of-card3d {
        width: 86vw; height: auto; min-height: 0; max-height: none;
        padding: 24px 22px; border-radius: 22px; justify-content: center;
      }
      .of-card3d.is-active {
        transform: translate(-50%, -50%) translateZ(30px) scale(1) rotateY(0deg);
      }
      .of-card-title { font-size: 28px; margin-top: 12px; line-height: 1.08; }
      .of-card-sub { font-size: 14px; max-width: 100%; }
      .of-onoff { margin-top: 14px; gap: 10px; }
      .of-on, .of-off { font-size: 14px; }
      .of-on .lbl, .of-off .lbl { min-width: 32px; }
      .of-locknote { font-size: 12px; margin-top: 14px; }
      .of-toggle-row { margin-top: 22px; gap: 16px; }
      .of-status { font-size: 19px; }

      /* touch-friendly nav controls */
      .of-arrow { width: 42px; height: 42px; font-size: 21px; }
      .of-dots { margin-top: 14px; gap: 12px; }
      .of-dot { width: 11px; height: 11px; }

      /* passcode lock screen */
      .of-lock { min-height: 64svh; padding: 18px; }
      .of-lock-card { padding: 26px 20px 22px; }
      .of-input { font-size: 16px; padding: 14px 16px; }   /* ≥16px = no iOS zoom-on-focus */
      .of-btn { font-size: 16px; padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <header class="sh-header">
    <a class="sh-logo" href="/slumhouse/office.html" aria-label="Slumhouse — The Office">
      <svg viewBox="0 0 64 56" width="38" height="34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="lg-bull-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c5ff5f"/>
            <stop offset="100%" stop-color="#a3ff12"/>
          </linearGradient>
          <filter id="lg-bull-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="1.2" result="g"/>
            <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g filter="url(#lg-bull-glow)">
          <path d="M14 14 L17 4 L25 16 Z" fill="url(#lg-bull-grad)"/>
          <path d="M50 14 L47 4 L39 16 Z" fill="url(#lg-bull-grad)"/>
          <path d="M16 14 C 16 8, 24 4, 32 4 C 40 4, 48 8, 48 14 L 52 26 C 52 36, 48 42, 44 44 L 41 50 C 37 52, 27 52, 23 50 L 20 44 C 16 42, 12 36, 12 26 Z" fill="url(#lg-bull-grad)"/>
        </g>
        <path d="M20 18 Q32 14 44 18" stroke="#000" stroke-width="1.4" fill="none" opacity="0.55"/>
        <rect x="20" y="22" width="6" height="4" rx="1" fill="#000"/>
        <rect x="38" y="22" width="6" height="4" rx="1" fill="#000"/>
        <circle cx="24" cy="23" r="0.7" fill="#fff" opacity="0.9"/>
        <circle cx="42" cy="23" r="0.7" fill="#fff" opacity="0.9"/>
        <path d="M27 32 Q32 30 37 32 Q37 36 32 36 Q27 36 27 32 Z" fill="#000"/>
        <path d="M24 41 Q32 39 40 41" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="sh-logo-text">
        <span class="sh-logo-name">SLUMHOUSE</span>
        <span class="sh-logo-sub">/ THE OFFICE</span>
      </div>
    </a>
    <nav class="sh-nav">
      <a class="sh-pill" href="/slumhouse/crib.html">The Crib</a>
      <a class="sh-pill" href="/slumhouse/kitchen.html">The Kitchen</a>
      <a class="sh-pill active" href="/slumhouse/office.html">The Office</a>
    </nav>
    <div class="sh-header-spacer">
      <button id="of-lock-btn" class="of-lock-link of-hide" title="Lock the Office">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Lock
      </button>
    </div>
  </header>

  <div class="sh-page">
    <!-- LOCKED state: passcode entry -->
    <section id="of-lock" class="of-lock">
      <div class="of-lock-card">
        <div class="of-lock-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3ff12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1 class="of-lock-title">The Office</h1>
        <p class="of-lock-sub">Operator only · enter passcode</p>
        <form id="of-form" autocomplete="off">
          <input id="of-passcode" class="of-input" type="password" inputmode="numeric"
                 name="of-otp" placeholder="• • • • • •" aria-label="Passcode"
                 autocomplete="one-time-code" data-lpignore="true" data-1p-ignore data-form-type="other" />
          <button id="of-submit" class="of-btn" type="submit">Unlock</button>
        </form>
        <div id="of-msg" class="of-msg"></div>
      </div>
    </section>

    <!-- UNLOCKED state: floating 3D switch-cards (Pass 3 — empty shells, no switches wired yet) -->
    <section id="of-shell" class="of-hide">
      <div class="of-carousel">
        <button class="of-arrow of-prev" type="button" aria-label="Previous">&#8249;</button>
        <div class="of-stage3d"><div class="of-track" id="of-track"></div></div>
        <button class="of-arrow of-next" type="button" aria-label="Next">&#8250;</button>
      </div>
      <div class="of-dots" id="of-dots"></div>
    </section>
  </div>

  <script>
    (function () {
      var lockSec = document.getElementById('of-lock');
      var shellSec = document.getElementById('of-shell');
      var lockBtn = document.getElementById('of-lock-btn');
      var form = document.getElementById('of-form');
      var input = document.getElementById('of-passcode');
      var submit = document.getElementById('of-submit');
      var msg = document.getElementById('of-msg');

      // ── Pass 3: floating 3D switch-card carousel (empty shells, no switches yet) ──
      var OF_CARDS = [
        { id: 'bot_power', eyebrow: 'Main switch', title: 'Bot Power',
          on: 'The bot makes trades.',
          off: 'The bot stops — no new trades. (Turns RED if it pauses itself for safety; flip ON to resume.)' },
        { id: 'learning_loop', eyebrow: 'Smart mode', title: 'Learning Loop',
          on: 'The bot studies its own trades overnight and improves itself.',
          off: 'The bot stays exactly as it is — it makes no changes to itself.' },
        { id: 'vacation_mode', eyebrow: 'Away', title: 'Vacation Mode',
          on: 'Fully hands-off while you are away — the bot can put strategies live and un-pause itself on its own.',
          off: 'You are in control — the bot waits for your OK before going live or un-pausing.' },
        { id: 'live_execution', eyebrow: 'Real money', title: 'Live Execution',
          on: 'Trades REAL money in your funded account.',
          off: 'Practice mode only (paper) — no real money at risk.',
          lockNote: 'Locked for now — needs broker setup before this can turn on.' }
      ];
      var ofTrack = document.getElementById('of-track');
      var ofDots = document.getElementById('of-dots');
      var ofCur = 0, ofInited = false, ofSwitches = {};

      function ofLayout() {
        var cards = ofTrack.children;
        var n = cards.length;
        var prevI = (ofCur - 1 + n) % n;   // wrap: always a card on the LEFT
        var nextI = (ofCur + 1) % n;        // wrap: always a card on the RIGHT
        for (var i = 0; i < n; i++) {
          var c = cards[i];
          c.classList.remove('is-active', 'is-prev', 'is-next', 'is-far');
          if (i === ofCur) c.classList.add('is-active');
          else if (i === prevI) c.classList.add('is-prev');
          else if (i === nextI) c.classList.add('is-next');
          else c.classList.add('is-far');
        }
        var dots = ofDots.children;
        for (var d = 0; d < dots.length; d++) {
          if (d === ofCur) dots[d].classList.add('on'); else dots[d].classList.remove('on');
        }
      }
      function ofGo(i) { var n = OF_CARDS.length; ofCur = ((i % n) + n) % n; ofLayout(); }

      function initCarousel() {
        if (ofInited) return; ofInited = true;
        OF_CARDS.forEach(function (cd, i) {
          var el = document.createElement('div');
          el.className = 'of-card3d';
          el.innerHTML =
            '<div class="of-card-top"><span class="of-card-eyebrow">' + cd.eyebrow + '</span><span class="of-card-badge" data-badge>—</span></div>' +
            '<div class="of-card-title">' + cd.title + '</div>' +
            '<div class="of-onoff">' +
              '<div class="of-on"><span class="lbl">ON</span><span>' + cd.on + '</span></div>' +
              '<div class="of-off"><span class="lbl">OFF</span><span>' + cd.off + '</span></div>' +
            '</div>' +
            (cd.lockNote ? '<div class="of-locknote">🔒 ' + cd.lockNote + '</div>' : '') +
            '<div class="of-toggle-row"><div class="of-toggle" data-toggle></div><span class="of-status" data-status>—</span></div>';
          el.addEventListener('click', function () { if (i !== ofCur) ofGo(i); });
          var tg = el.querySelector('[data-toggle]');
          tg.addEventListener('click', function (e) { e.stopPropagation(); onToggle(cd); });
          ofTrack.appendChild(el);
          var dot = document.createElement('button');
          dot.className = 'of-dot'; dot.type = 'button';
          dot.addEventListener('click', function () { ofGo(i); });
          ofDots.appendChild(dot);
        });
        var prev = document.querySelector('.of-prev');
        var next = document.querySelector('.of-next');
        if (prev) prev.addEventListener('click', function () { ofGo(ofCur - 1); });
        if (next) next.addEventListener('click', function () { ofGo(ofCur + 1); });
        ofLayout();
        loadSwitches();
      }

      function loadSwitches() {
        fetch('/slumhouse/admin/switches', { credentials: 'same-origin' })
          .then(function (r) { return r.json(); })
          .then(function (d) { ofSwitches = (d && d.switches) || {}; applySwitches(); })
          .catch(function () {});
      }
      function applySwitches() {
        OF_CARDS.forEach(function (cd, i) {
          var el = ofTrack.children[i]; if (!el) return;
          var s = ofSwitches[cd.id] || {};
          var tg = el.querySelector('[data-toggle]');
          var st = el.querySelector('[data-status]');
          var bd = el.querySelector('[data-badge]');
          var state = s.state || (s.on ? 'running' : 'paused');
          tg.classList.remove('on', 'alert');
          if (state === 'running') tg.classList.add('on');     // GREEN + green pulse
          else if (s.wired) tg.classList.add('alert');         // RED + red pulse (paused/halted on a LIVE switch)
          // not-yet-wired switches stay neutral gray (disabled)
          if (s.wired) tg.classList.remove('disabled'); else tg.classList.add('disabled');
          st.textContent = s.status || (s.on ? 'ON' : 'OFF');
          st.className = 'of-status ' + (state === 'running' ? 'on' : (s.wired ? 'alert' : 'paused'));
          if (bd) {
            bd.textContent = s.wired ? 'LIVE' : (s.needsSetup ? 'SETUP' : 'SOON');
            bd.className = 'of-card-badge' + (s.wired ? ' on' : '');
          }
        });
      }
      function onToggle(cd) {
        var s = ofSwitches[cd.id] || {};
        if (!s.wired) return;                                  // not wired yet
        var willBe = !s.on;
        if (s.momentary) {                                     // recovery — a trigger, not an on/off state
          if (s.confirmAction && !window.confirm('Clear the safety stop on ' + cd.title + '?\n\nThis re-enables the bot after it halted itself.')) return;
          willBe = true;
        } else if (s.dangerOff && s.on) {                      // turning a dangerous switch OFF
          if (!window.confirm('Turn OFF ' + cd.title + '?\n\nThis stops the bot from making any trades.')) return;
        } else if (s.dangerOn && !s.on) {                      // turning a sensitive switch ON
          if (!window.confirm('Turn ON ' + cd.title + '?')) return;
        }
        fetch('/slumhouse/admin/switch', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: cd.id, on: willBe })
        })
          .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
          .then(function (res) {
            if (res.status === 200 && res.body && res.body.ok) {
              ofSwitches[cd.id] = Object.assign({}, s, { on: res.body.on, state: res.body.state, status: res.body.status });
              applySwitches();
              loadSwitches();   // re-read derived states (e.g. recovery clearing a halt)
            } else if (res.status === 401) { showLocked(); }
          })
          .catch(function () {});
      }

      function showUnlocked() {
        lockSec.classList.add('of-hide');
        shellSec.classList.remove('of-hide');
        lockBtn.classList.remove('of-hide');
        initCarousel();
      }
      function showLocked() {
        shellSec.classList.add('of-hide');
        lockBtn.classList.add('of-hide');
        lockSec.classList.remove('of-hide');
        input.value = '';                 // never leave a passcode sitting in the box
        // clear again after any late browser autofill, then focus
        setTimeout(function () { input.value = ''; input.focus(); }, 60);
        setTimeout(function () { input.value = ''; }, 400);
      }
      function setMsg(text, cls) {
        msg.textContent = text || '';
        msg.className = 'of-msg' + (cls ? ' ' + cls : '');
      }

      // On load: ask the server if we're already unlocked / configured.
      fetch('/slumhouse/admin/status', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (s) {
          if (s && s.unlocked) { showUnlocked(); return; }
          showLocked();
          if (s && !s.configured) {
            setMsg('Office not configured — set SLUMHOUSE_ADMIN_PASSCODE in .env.', 'warn');
            submit.disabled = true;
          }
        })
        .catch(function () { showLocked(); });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var pass = input.value || '';
        if (!pass) { setMsg('Enter the passcode.', 'err'); return; }
        submit.disabled = true;
        setMsg('Checking…', '');
        fetch('/slumhouse/admin/auth', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode: pass })
        })
          .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
          .then(function (res) {
            submit.disabled = false;
            input.value = '';
            if (res.status === 200 && res.body && res.body.ok) { setMsg('', ''); showUnlocked(); return; }
            if (res.status === 429) { setMsg('Too many attempts — locked out, try again later.', 'err'); return; }
            if (res.status === 503) { setMsg('Office not configured — set SLUMHOUSE_ADMIN_PASSCODE in .env.', 'warn'); return; }
            setMsg('Wrong passcode.', 'err');
          })
          .catch(function () { submit.disabled = false; setMsg('Network error — try again.', 'err'); });
      });

      lockBtn.addEventListener('click', function () {
        fetch('/slumhouse/admin/logout', { method: 'POST', credentials: 'same-origin' })
          .then(function () { showLocked(); setMsg('Locked.', ''); })
          .catch(function () { showLocked(); });
      });

      // Lock-on-exit: the instant the operator leaves the Office (nav away, close,
      // refresh), clear the admin session so returning ALWAYS re-prompts for the
      // passcode. sendBeacon fires reliably during page teardown.
      window.addEventListener('pagehide', function () {
        try { navigator.sendBeacon('/slumhouse/admin/logout'); } catch (e) { /* noop */ }
      });
    })();
  </script>
</body>
</html>
