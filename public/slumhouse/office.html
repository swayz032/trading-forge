<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slumhouse · The Office</title>
  <link rel="stylesheet" href="/slumhouse/slumhouse.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/slumhouse/icons/slumdawg-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/slumhouse/icons/slumdawg-180.png">
  <meta name="theme-color" content="#000000">
  <style>
    /* ── The Office — Pass 2 (SlumDawg room background) ─────────────────────
       Floating switch-cards land in Pass 3. */
    .of-hide { display: none !important; }

    /* Pass 2: SlumDawg Traders room backdrop with a dark scrim for readability */
    body {
      background:
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.72)),
        url('/slumhouse/images/office-bg.png?v=2') center center / cover no-repeat fixed,
        #000;
    }

    /* Passcode lock screen — centered glassy card on pure black */
    .of-lock {
      min-height: 78vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .of-lock-card {
      width: 100%;
      max-width: 360px;
      /* glassy panel floating over the room */
      background: rgba(8, 10, 8, 0.55);
      backdrop-filter: blur(20px) saturate(1.15);
      -webkit-backdrop-filter: blur(20px) saturate(1.15);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 16px;
      padding: 30px 26px 26px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 24px 60px rgba(0, 0, 0, 0.55),
        0 0 50px rgba(163, 255, 18, 0.07);
      text-align: center;
    }
    .of-lock-badge {
      width: 46px; height: 46px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(163, 255, 18, 0.10);
      box-shadow: 0 0 18px rgba(163, 255, 18, 0.25);
      margin-bottom: 14px;
    }
    .of-lock-title {
      font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em;
      margin: 0 0 4px;
    }
    .of-lock-sub {
      font-size: 12px; color: var(--mute); margin: 0 0 20px; letter-spacing: 0.02em;
    }
    .of-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      font-family: var(--num-font);
      font-size: 15px;
      letter-spacing: 0.3em;
      text-align: center;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .of-input:focus {
      border-color: var(--lime-dim);
      box-shadow: 0 0 0 3px rgba(163, 255, 18, 0.08);
    }
    .of-btn {
      width: 100%;
      margin-top: 12px;
      background: var(--lime);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.04em;
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }
    .of-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .of-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .of-msg { min-height: 16px; margin-top: 12px; font-size: 12px; letter-spacing: 0.02em; }
    .of-msg.err { color: var(--red); }
    .of-msg.warn { color: var(--warm); }

    /* Pass 3: BIG wide floating 3D switch-cards, centered on the page (coverflow) */
    #of-shell { min-height: calc(100vh - 168px); display: flex; flex-direction: column; justify-content: center; }
    .of-carousel { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .of-stage3d {
      position: relative; flex: 1; max-width: 1500px; height: min(66vh, 540px);
      perspective: 1150px; perspective-origin: center 50%; overflow: visible;
    }
    .of-track { position: absolute; inset: 0; transform-style: preserve-3d; }
    .of-card3d {
      position: absolute; top: 50%; left: 50%;
      width: min(620px, 62vw); height: min(410px, 60vh);
      border-radius: 26px; overflow: hidden;
      background:
        radial-gradient(135% 95% at 50% -12%, rgba(163,255,18,0.08), transparent 56%),
        linear-gradient(158deg, rgba(28, 34, 30, 0.99), rgba(10, 13, 11, 0.995));
      border: 1px solid rgba(163, 255, 18, 0.20);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        inset 0 -40px 80px rgba(0,0,0,0.35),
        0 36px 80px rgba(0,0,0,0.70),
        0 0 34px rgba(163,255,18,0.08);
      display: flex; flex-direction: column; justify-content: center; padding: 44px 50px;
      transition: transform 0.55s cubic-bezier(0.2,0.7,0.2,1), opacity 0.45s, box-shadow 0.45s, border-color 0.45s;
      cursor: pointer; will-change: transform, opacity;
    }
    .of-card3d::before {
      content: ""; position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(163,255,18,0.55), transparent);
    }
    .of-card-top { display: flex; align-items: center; justify-content: space-between; }
    .of-card-eyebrow { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
    .of-card-badge {
      font-family: var(--num-font); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 5px 13px; border-radius: 999px; color: var(--mute);
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10);
    }
    .of-card-badge.on  { color: var(--lime); background: rgba(163,255,18,0.12); border-color: rgba(163,255,18,0.40); box-shadow: 0 0 14px rgba(163,255,18,0.22); }
    .of-card-badge.off { color: var(--red);  background: rgba(255,99,99,0.10); border-color: rgba(255,99,99,0.35); }
    .of-card-title { margin-top: 16px; font-size: 42px; font-weight: 800; color: var(--ink); letter-spacing: 0.004em; line-height: 1.04; }
    .of-card-sub { margin-top: 12px; font-size: 16px; color: var(--dim); line-height: 1.45; max-width: 90%; }
    /* Carter connect card — mirrors the Slumdawg UpTOP connect screen theme
       (cover art + dark veil + glassy black/lime pill), inside the 3D card. */
    /* Connect card is all absolutely-positioned (cover/veil/pill) — it has NO
       flow content, so it needs an explicit height or it collapses to 0 (this
       is why it vanished on mobile where .of-card3d is height:auto). The
       two-class selector outranks the mobile `.of-card3d { height:auto }`. */
    .of-card3d.of-connect { padding: 0; height: min(410px, 60vh); }
    .of-connect-cover {
      position: absolute; inset: 0; border-radius: inherit;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      -webkit-transform: translateZ(0); transform: translateZ(0); backface-visibility: hidden;
    }
    .of-connect-veil {
      position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
      box-shadow:
        inset 0 0 0 1px rgba(163,255,18,0.10),
        inset 0 -90px 110px rgba(0,0,0,0.72),
        inset 0 0 90px rgba(0,0,0,0.40);
    }
    .of-connect-foot {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
      display: flex; justify-content: center; padding-bottom: 24px;
    }
    .of-connect-pill {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: 0.02em;
      color: rgba(255,255,255,0.95);
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      padding: 13px 26px; border-radius: 999px; border: 1px solid rgba(163,255,18,0.40);
      text-shadow: 0 1px 4px rgba(0,0,0,0.6); cursor: pointer;
      box-shadow: 0 0 20px rgba(163,255,18,0.18);
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s, background 0.18s;
    }
    .of-connect-pill:hover { transform: translateY(-1px); border-color: rgba(163,255,18,0.75); background: rgba(0,0,0,0.72); box-shadow: 0 0 30px rgba(163,255,18,0.34); }
    .of-connect-pill:active { transform: translateY(0); }
    .of-connect-pill:disabled { opacity: 0.8; cursor: default; }
    .of-connect-pill span { color: var(--lime); font-size: 12px; text-shadow: 0 0 8px rgba(163,255,18,0.6); }
    /* explicit ON / OFF meanings (color-coded) */
    .of-onoff { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
    .of-on, .of-off { display: flex; gap: 12px; align-items: baseline; font-size: 15px; line-height: 1.4; color: var(--ink); }
    .of-on .lbl, .of-off .lbl { flex-shrink: 0; min-width: 36px; font-family: var(--num-font); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; }
    .of-on .lbl  { color: var(--lime); }
    .of-off .lbl { color: var(--red); }
    /* 3-mode dial (Learning Loop): OFF / OBSERVE / AUTOPILOT — inactive dimmed, active highlighted */
    .of-3mode .of-mode { display: flex; gap: 12px; align-items: baseline; font-size: 15px; line-height: 1.4; color: var(--ink); opacity: 0.38; padding: 5px 8px; border-radius: 8px; transition: opacity .15s ease, background .15s ease; }
    .of-3mode .of-mode .lbl { flex-shrink: 0; min-width: 84px; font-family: var(--num-font); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .of-3mode .of-mode[data-mode="0"] .lbl { color: var(--red); }
    .of-3mode .of-mode[data-mode="1"] .lbl { color: #f0b429; }
    .of-3mode .of-mode[data-mode="2"] .lbl { color: var(--lime); }
    .of-3mode .of-mode.active { opacity: 1; background: rgba(255,255,255,0.06); }
    .of-locknote { margin-top: 14px; font-size: 13px; color: var(--warm); letter-spacing: 0.01em; }
    .of-card-slot {
      margin-top: auto; display: flex; align-items: center; gap: 9px;
      font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute);
    }
    .of-card-slot .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mute); }
    /* Pass 4: the switch (lime pill toggle) */
    .of-toggle-row { margin-top: 30px; display: flex; align-items: center; gap: 20px; }
    /* 3D toggle: recessed track + raised spherical knob */
    .of-toggle {
      position: relative; width: 100px; height: 48px; border-radius: 999px; flex-shrink: 0;
      background: linear-gradient(#191c19, #0b0d0b);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.75), inset 0 -1px 0 rgba(255,255,255,0.04);
      cursor: pointer; transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .of-knob {
      position: absolute; top: 5px; left: 5px; width: 38px; height: 38px; border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #9c9c9c, #565656 68%, #3a3a3a);
      box-shadow: 0 4px 9px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.5), inset 0 -3px 4px rgba(0,0,0,0.45);
      transition: transform 0.38s cubic-bezier(0.2,0.8,0.2,1), background 0.3s, box-shadow 0.3s;
    }
    /* GREEN — running (knob slides right; whole pill pulses green) */
    .of-toggle.on {
      background: linear-gradient(rgba(163,255,18,0.20), rgba(70,120,8,0.12)); border-color: rgba(163,255,18,0.6);
      animation: ofPulseGreen 1.8s ease-in-out infinite;
    }
    .of-toggle.on .of-knob {
      transform: translateX(52px);
      background: radial-gradient(circle at 35% 28%, #e6ffae, var(--lime) 62%, #7cbf0c);
      box-shadow: 0 4px 9px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.6), 0 0 14px rgba(163,255,18,0.8);
    }
    /* RED — paused / halted (knob left; whole pill pulses red) */
    .of-toggle.alert {
      background: linear-gradient(rgba(255,80,80,0.20), rgba(130,18,18,0.12)); border-color: rgba(255,99,99,0.6);
      animation: ofPulseRed 1.4s ease-in-out infinite;
    }
    .of-toggle.alert .of-knob {
      background: radial-gradient(circle at 35% 28%, #ffbfbf, #ff5757 62%, #c01e1e);
      box-shadow: 0 4px 9px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.5), 0 0 14px rgba(255,90,90,0.8);
    }
    .of-toggle.disabled { opacity: 0.45; cursor: not-allowed; animation: none; }
    @keyframes ofPulseGreen {
      0%,100% { box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 0 14px rgba(163,255,18,0.45); border-color: rgba(163,255,18,0.45); }
      50%     { box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 0 44px rgba(163,255,18,0.95); border-color: rgba(163,255,18,0.9); }
    }
    @keyframes ofPulseRed {
      0%,100% { box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 0 14px rgba(255,90,90,0.45); border-color: rgba(255,99,99,0.45); }
      50%     { box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 0 44px rgba(255,90,90,0.95); border-color: rgba(255,99,99,0.9); }
    }
    .of-status { font-family: var(--num-font); font-size: 24px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
    .of-status.on    { color: var(--lime); text-shadow: 0 0 16px rgba(163,255,18,0.45); }
    .of-status.alert { color: var(--red); text-shadow: 0 0 16px rgba(255,90,90,0.45); }
    .of-status.paused { color: var(--dim); }   /* PAUSED = blank/neutral, not red */
    .of-status.on { color: var(--lime); }
    .of-status.off { color: var(--red); }
    .of-card3d.is-active {
      transform: translate(-50%, -50%) translateZ(60px) scale(1) rotateY(0deg); opacity: 1; z-index: 5;
      border-color: rgba(163,255,18,0.6);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.13),
        inset 0 -40px 90px rgba(0,0,0,0.30),
        0 44px 100px rgba(0,0,0,0.72),
        0 0 64px rgba(163,255,18,0.24);
      cursor: default;
    }
    /* single-card mode: only the active card shows; others fade out (no side peek) */
    .of-card3d.is-prev,
    .of-card3d.is-next,
    .of-card3d.is-far { transform: translate(-50%, -50%) scale(0.94); opacity: 0; z-index: 1; pointer-events: none; }
    .of-arrow {
      position: relative; z-index: 20;
      flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%;
      background: rgba(8,12,8,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12); color: var(--ink);
      font-size: 22px; line-height: 1; cursor: pointer;
      transition: background 0.15s, transform 0.15s, border-color 0.15s;
    }
    .of-arrow:hover { background: rgba(163,255,18,0.12); border-color: var(--lime-dim); transform: translateY(-1px); }
    .of-dots { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
    .of-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.18); cursor: pointer; transition: background 0.15s, transform 0.15s; border: none; padding: 0; }
    .of-dot.on { background: var(--lime); box-shadow: 0 0 10px var(--lime); transform: scale(1.25); }
    .of-lock-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-left: auto;
      color: rgba(255, 120, 120, 0.85);
      background: rgba(40, 0, 0, 0.0);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    .of-lock-link:hover { background: rgba(40, 0, 0, 0.55); transform: translateY(-1px); }

    /* ─────────────────────────────────────────────────────────────────────────
       iPhone Pro (393pt) + Pro Max (430pt) portrait optimization.
       Header nav stacks onto its own row (was overflowing off-screen); card is
       sized to its CONTENT (no tall stretch); notch/home-indicator safe areas;
       16px passcode input (stops iOS auto-zoom on focus).
       ───────────────────────────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      /* Flex column fills the screen so the card centers reliably (was floating
         high with empty space below). */
      body { display: flex; flex-direction: column; min-height: 100svh; }
      .sh-page {
        flex: 1 1 auto; display: flex; flex-direction: column; padding-bottom: 0;
        padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
      }

      /* HEADER: pushed BELOW the status bar / Dynamic Island (safe-area-top);
         nav pills drop to their own full-width row so all 3 are visible. */
      .sh-header {
        flex-shrink: 0;
        grid-template-columns: 1fr auto;
        grid-template-areas: "logo tools" "nav nav";
        row-gap: 8px; column-gap: 8px;
        padding: calc(env(safe-area-inset-top) + 10px) 14px 8px;
      }
      .sh-logo { grid-area: logo; }
      .sh-header-spacer { grid-area: tools; min-width: 0; }
      /* hide the manual Lock button on mobile — pagehide auto-locks on exit anyway */
      .of-lock-link { display: none !important; }
      .sh-nav { grid-area: nav; width: 100%; justify-content: center; }
      .sh-pill { padding: 8px 16px; font-size: 12px; }

      /* CAROUSEL: single card, swipe to change (arrows removed), centered. */
      #of-shell {
        flex: 1 1 auto; min-height: 0; justify-content: center;
        padding: 6px 0 calc(env(safe-area-inset-bottom) + 14px);
      }
      .of-arrow { display: none; }            /* operator swipes instead of tapping arrows */
      .of-carousel { gap: 0; }
      .of-stage3d { height: 56svh; perspective: 1050px; touch-action: pan-y; }
      /* content-sized card — no min/max-height stretch */
      .of-card3d {
        width: 88vw; height: auto; min-height: 0; max-height: none;
        padding: 24px 22px; border-radius: 22px; justify-content: center;
      }
      /* Carter connect card: match the cover's 3:2 landscape ratio so the FULL
         picture fits (was 56svh portrait → cropped the landscape photo).
         height = width / 1.5; explicit calc (no flow content, no aspect-ratio
         dependency) so it can't collapse. */
      .of-card3d.of-connect { width: 88vw; height: calc(88vw / 1.5); max-height: 72svh; padding: 0; }
      .of-card3d.is-active {
        transform: translate(-50%, -50%) translateZ(30px) scale(1) rotateY(0deg);
      }
      .of-card-title { font-size: 28px; margin-top: 12px; line-height: 1.08; }
      .of-card-sub { font-size: 14px; max-width: 100%; }
      .of-onoff { margin-top: 14px; gap: 10px; }
      .of-on, .of-off { font-size: 14px; }
      .of-on .lbl, .of-off .lbl { min-width: 32px; }
      .of-locknote { font-size: 12px; margin-top: 14px; }
      .of-toggle-row { margin-top: 22px; gap: 16px; }
      .of-status { font-size: 19px; }
      .of-dots { margin-top: 16px; gap: 12px; }
      .of-dot { width: 11px; height: 11px; }

      /* passcode lock screen */
      .of-lock { flex: 1 1 auto; min-height: 0; padding: 18px; }
      .of-lock-card { padding: 26px 20px 22px; }
      .of-input { font-size: 16px; padding: 14px 16px; }   /* ≥16px = no iOS zoom-on-focus */
      .of-btn { font-size: 16px; padding: 14px 16px; }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       CARTER CONNECT — full-screen "call Carter" overlay (Phase A calling /
       Phase B immersive). Lives inside office.html as a fixed inset:0 overlay,
       hidden by default. Opened by connectCarter() → window.openCarterCall().
       --carter-voice (0..1) is updated each frame from getOutputVolume() and
       drives the green Siri edge-glow + blob pulse.
       ═══════════════════════════════════════════════════════════════════════ */
    #carter-call {
      --carter-voice: 0;
      position: fixed; inset: 0; z-index: 4000;
      display: none; background: #000; overflow: hidden;
      font-family: var(--ui-font, inherit);
    }
    #carter-call.cc-open { display: block; }
    #carter-call .cc-phase { position: absolute; inset: 0; display: none; }
    #carter-call .cc-phase.cc-on { display: block; }

    /* round red hang-up button (shared by both phases) */
    .cc-hangup {
      width: 72px; height: 72px; border-radius: 50%; border: none; cursor: pointer;
      background: radial-gradient(circle at 38% 30%, #ff6b6b, #e0142a 70%, #a30d1e);
      box-shadow: 0 10px 30px rgba(0,0,0,0.55), 0 0 26px rgba(224,20,42,0.55),
                  inset 0 2px 3px rgba(255,255,255,0.35), inset 0 -4px 8px rgba(0,0,0,0.4);
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .cc-hangup:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(0,0,0,0.6), 0 0 36px rgba(224,20,42,0.75), inset 0 2px 3px rgba(255,255,255,0.35), inset 0 -4px 8px rgba(0,0,0,0.4); }
    .cc-hangup:active { transform: translateY(0) scale(0.96); }
    .cc-hangup svg { width: 32px; height: 32px; transform: rotate(135deg); }

    /* ── Phase A: CALLING ─────────────────────────────────────────────────── */
    .cc-calling {
      background: #000 url('/slumhouse/images/carter-calling.png?v=3') center center / cover no-repeat;
    }
    .cc-calling-veil {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to top,
        rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.45) 38%, rgba(0,0,0,0.10) 64%, rgba(0,0,0,0.42) 100%);
    }
    .cc-calling-inner {
      position: relative; z-index: 2; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center;
      padding: calc(env(safe-area-inset-top) + 7vh) 20px calc(env(safe-area-inset-bottom) + 7vh);
    }
    .cc-calling-status { font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(255,255,255,0.72); }
    .cc-calling-name { font-size: 54px; font-weight: 800; color: #fff; letter-spacing: 0.01em; margin: 8px 0 6px; text-shadow: 0 3px 26px rgba(0,0,0,0.7); }
    .cc-calling-sub { font-size: 14px; color: rgba(255,255,255,0.78); letter-spacing: 0.07em; }
    /* pulsing ring indicator */
    .cc-ring { position: relative; margin-top: 40px; width: 96px; height: 96px; }
    .cc-ring-core {
      position: absolute; inset: 28px; border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, rgba(163,255,18,0.95), rgba(70,120,8,0.5));
      box-shadow: 0 0 26px rgba(163,255,18,0.6);
    }
    .cc-ring-pulse {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(163,255,18,0.55);
      animation: ccRingPulse 2s ease-out infinite;
    }
    .cc-ring-pulse:nth-child(2) { animation-delay: 1s; }
    @keyframes ccRingPulse {
      0%   { transform: scale(0.45); opacity: 0.9; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    .cc-spacer { flex: 1 1 auto; min-height: 24px; }

    /* ── Phase B: IMMERSIVE (black + green Siri edge-glow + blob) ─────────── */
    /* Immersive backdrop = the "Carter on the phone" scene; a dark veil keeps
       the blob + glow + text legible over it. */
    .cc-immersive {
      background: #000 url("/slumhouse/images/carter-immersive.png?v=3") center / cover no-repeat;
    }
    .cc-immersive::after {
      content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: linear-gradient(rgba(0,0,0,0.30), rgba(0,0,0,0.55));
    }
    /* THE signature effect — Apple-Intelligence / Siri style: a bright ANIMATED
       conic-gradient GREEN border hugging the screen rim + an outer bloom.
       Masked to a ring (mask-composite) so the CENTER is transparent and the
       blob + scene show through. Reacts to --carter-voice (set each frame from
       getOutputVolume): the rim thickens, bloom widens, brightness rises when
       Carter speaks. z-index 2 = above blob (1), below foot (3). */
    @property --cc-spin { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
    /* THE effect, two parts:
       (1) a SLIM flowing Slumhouse-lime border LINE locked FLUSH to the screen
           edge (inset:0). Thickness is CONSTANT so it never detaches/gaps when
           Carter talks — voice only changes brightness, not geometry.
       (2) an inset "immersive" bloom that bleeds soft lime light INWARD from the
           rounded edges (the Apple-immersive glow). Both ride cheap OPACITY off
           --carter-voice, so it brightens when he speaks but the rim stays put. */
    .cc-glow {
      /* FLUSH to the screen edge (inset 0 — NO gap), a WIDE heavy lime band, and a
         deep immersive bloom bleeding inward. BREATHES on Carter's voice: the whole
         rim swells (scale) + brightens when he speaks — the 3D pulse. */
      position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: 50px;
      /* DRAMATIC voice reaction — all three ride --carter-voice (idle ~0.15,
         speaking → ~0.8+): the whole rim brightens, saturates, and swells when
         Carter talks. opacity affects the box-shadow too, so the glow pulses. */
      opacity: calc(0.6 + var(--carter-voice) * 0.4);
      transform: scale(calc(1 + var(--carter-voice) * 0.10));
      transform-origin: center;
      filter: brightness(calc(0.85 + var(--carter-voice) * 1.4)) saturate(calc(1.1 + var(--carter-voice) * 0.8));
      box-shadow:
        inset 0 0 0 7px     rgba(163, 255, 18, 0.95),  /* THICK solid edge band — flush + clearly visible */
        inset 0 0 22px 10px rgba(163, 255, 18, 0.85),  /* feathers the edge INTO the glow (blend) */
        inset 0 0 75px 18px rgba(140, 255, 70, 0.60),  /* heavy mid bloom */
        inset 0 0 220px 0   rgba(120, 230, 60, 0.50);  /* deep immersive light-bleed */
      transition: opacity 0.07s linear, transform 0.07s linear, filter 0.07s linear;
      will-change: opacity, transform, filter;
    }
    .cc-glow::before, .cc-glow::after {
      content: ""; position: absolute; inset: 0; border-radius: 50px;
      padding: 6px;   /* flowing lime color, blended over the thick edge band */
      background: conic-gradient(from var(--cc-spin),
        #a3ff12, #c6ff5a, #5dff8f, #19c37d, #7dffb0, #a3ff12, #c6ff3a, #a3ff12);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
              mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: ccSpin 7s linear infinite;
    }
    /* heavy bloom of the ring so the border + glow read as one thick luminous edge */
    .cc-glow::after { filter: blur(20px) saturate(1.7) brightness(1.35); opacity: 1; }
    @keyframes ccSpin { to { --cc-spin: 360deg; } }
    .cc-blob {
      position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%;
      object-fit: cover; pointer-events: none;
      mix-blend-mode: screen;   /* drops the video's black bg so the blob floats over the scene */
      transform: scale(calc(1 + var(--carter-voice) * 0.05));
      transition: transform 0.10s linear; will-change: transform;
    }
    .cc-immersive-foot {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
      display: flex; flex-direction: column; align-items: center; gap: 22px;
      padding: 0 20px calc(env(safe-area-inset-bottom) + 7vh);
    }
    .cc-mic-state {
      font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.82); text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      min-height: 18px;
    }
    .cc-mic-state.speaking { color: var(--lime, #a3ff12); text-shadow: 0 0 16px rgba(163,255,18,0.55); }

    /* ── Foot button row: inbox chat-bubble + end ── */
    .cc-foot-row { display: flex; align-items: center; gap: 22px; }
    .cc-iconbtn {
      position: relative; width: 56px; height: 56px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center; color: #cdff8a;
      border: 1px solid rgba(163,255,18,0.40);
      background: radial-gradient(120% 120% at 50% 0%, rgba(163,255,18,0.16), rgba(0,0,0,0.55));
      box-shadow: 0 6px 18px rgba(0,0,0,0.5), 0 0 22px rgba(163,255,18,0.18), inset 0 1px 0 rgba(255,255,255,0.10);
      cursor: pointer; transition: transform 0.15s, box-shadow 0.2s;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .cc-iconbtn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,0.5), 0 0 30px rgba(163,255,18,0.34); }
    .cc-iconbtn svg { width: 26px; height: 26px; }
    .cc-inbox-badge {
      position: absolute; top: 3px; right: 3px; width: 12px; height: 12px; border-radius: 50%;
      background: var(--lime, #a3ff12); box-shadow: 0 0 10px rgba(163,255,18,0.95); border: 2px solid #000; display: none;
    }
    .cc-inbox-badge.on { display: block; }

    /* ── Transient toast (attachment feedback) ── */
    .cc-toast {
      position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24vh); transform: translate(-50%, 8px);
      z-index: 4; max-width: 80%; padding: 10px 16px; border-radius: 14px; font-size: 14px; color: #eafff0; text-align: center;
      background: linear-gradient(145deg, rgba(163,255,18,0.20), rgba(25,195,125,0.12));
      border: 1px solid rgba(163,255,18,0.32); box-shadow: 0 8px 22px rgba(0,0,0,0.5), 0 0 24px rgba(163,255,18,0.14);
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .cc-toast.on { opacity: 1; transform: translate(-50%, 0); }

    /* ── Inbox phase — SOLID BLACK, full-bleed, THICK static green border, NO glow ── */
    .cc-inbox-phase .cc-glow { display: none; }   /* drop the Siri glow on the inbox */
    .cc-inbox {
      position: absolute; inset: 0; z-index: 1; background: #000;
      display: flex; flex-direction: column;
      padding: calc(env(safe-area-inset-top) + 7vh) 18px calc(env(safe-area-inset-bottom) + 5vh);
      box-shadow: inset 0 0 0 4px rgba(163,255,18,0.62);   /* thick clean border, 0 blur = no glow */
    }
    .cc-inbox-back {
      position: absolute; top: calc(env(safe-area-inset-top) + 18px); left: 16px; z-index: 4;
      width: 44px; height: 44px; border-radius: 50%; font-size: 26px; line-height: 1; color: #cdff8a;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid rgba(163,255,18,0.4); background: rgba(0,0,0,0.5); cursor: pointer;
      box-shadow: 0 0 18px rgba(163,255,18,0.18); backdrop-filter: blur(6px);
    }
    .cc-inbox-back:hover { box-shadow: 0 0 26px rgba(163,255,18,0.32); }
    .cc-inbox-head {
      text-align: center; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; flex: none;
      color: rgba(163,255,18,0.88); text-shadow: 0 0 14px rgba(163,255,18,0.4); margin-bottom: 16px;
    }
    .cc-inbox-feed {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
      -webkit-overflow-scrolling: touch; padding: 4px 2px;
    }
    .cc-inbox-empty { color: rgba(255,255,255,0.42); text-align: center; font-size: 14px; margin-top: 28px; line-height: 1.55; }

    /* ── Message bubbles — BLACK background, thin green border, no glow ── */
    .cc-bubble {
      align-self: stretch; max-width: 100%;
      background: #000;
      border: 1px solid rgba(163,255,18,0.55); border-radius: 14px;
      padding: 14px 16px; color: #e6ffd0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      animation: ccBubbleIn 0.3s ease both;
    }
    @keyframes ccBubbleIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
    .cc-bubble-type { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(163,255,18,0.78); margin-bottom: 5px; display: inline-block; }
    .cc-bubble-title { font-size: 14px; font-weight: 700; color: #f1ffe0; margin-bottom: 4px; line-height: 1.3; }
    .cc-bubble-body { font-size: 14px; line-height: 1.5; color: #d8f5be; }
    .cc-bubble-report { color: #e9ffd4; line-height: 1.55; }
    .cc-bubble-sources { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(163,255,18,0.6); margin: 13px 0 3px; }
    .cc-link-snip { display: block; font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; line-height: 1.4; }
    .cc-bubble-link {
      display: block; font-size: 13px; color: #b6ff5a; text-decoration: none; margin-top: 7px;
      padding-left: 12px; border-left: 2px solid rgba(163,255,18,0.4); line-height: 1.35;
    }
    .cc-bubble-link:hover { color: #d6ff8e; }
    .cc-bubble.running { background: #000; border-color: rgba(163,255,18,0.35); }
    .cc-bubble.running .cc-bubble-title::after {
      content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 8px; vertical-align: middle;
      background: var(--lime, #a3ff12); box-shadow: 0 0 10px rgba(163,255,18,0.9); animation: ccPulse 1.1s ease-in-out infinite;
    }
    @keyframes ccPulse { 0%,100% { opacity: 0.35; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } }
    .cc-bubble.alert { border-color: rgba(255,180,60,0.6); background: #000; }
    .cc-bubble.alert .cc-bubble-type { color: rgba(255,190,90,0.92); }

    /* ── Slumdawg Lobby phase ── */
    .cc-lobby {
      background: #000 url("/slumhouse/images/carter-lobby.png?v=1") center / cover no-repeat;
      display: flex; align-items: center; justify-content: center;
    }
    .cc-lobby-veil { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.78)); }
    .cc-lobby-close {
      position: absolute; top: calc(env(safe-area-inset-top) + 16px); right: 18px; z-index: 4;
      width: 42px; height: 42px; border-radius: 50%; font-size: 26px; line-height: 1; color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.45); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; backdrop-filter: blur(6px);
    }
    .cc-lobby-inner { position: relative; z-index: 2; width: 100%; max-width: 460px; padding: 0 24px; text-align: center; }
    .cc-lobby-kicker { font-size: 13px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(163,255,18,0.92); text-shadow: 0 0 16px rgba(163,255,18,0.5); }
    .cc-lobby-title { font-size: 46px; font-weight: 800; color: #fff; letter-spacing: 0.01em; margin: 4px 0 30px; text-shadow: 0 4px 22px rgba(0,0,0,0.85); }
    .cc-lobby-opts { display: flex; flex-direction: column; gap: 16px; }
    .cc-lobby-btn {
      position: relative; display: flex; align-items: center; gap: 16px; text-align: left;
      padding: 18px 20px; border-radius: 18px; cursor: pointer; color: #eafff0; font-family: inherit;
      background: linear-gradient(150deg, rgba(28,34,30,0.92), rgba(10,13,11,0.96));
      border: 1px solid rgba(163,255,18,0.30);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 16px 36px rgba(0,0,0,0.6), 0 0 28px rgba(163,255,18,0.10);
      transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .cc-lobby-btn:hover { transform: translateY(-2px); border-color: rgba(163,255,18,0.6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 16px 36px rgba(0,0,0,0.6), 0 0 40px rgba(163,255,18,0.24); }
    .cc-lobby-ic {
      position: relative; flex: none; width: 52px; height: 52px; border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center; color: var(--lime, #a3ff12);
      background: rgba(163,255,18,0.12); border: 1px solid rgba(163,255,18,0.30); box-shadow: 0 0 16px rgba(163,255,18,0.2);
    }
    .cc-lobby-ic svg { width: 26px; height: 26px; }
    .cc-lobby-txt { display: flex; flex-direction: column; gap: 3px; }
    .cc-lobby-txt b { font-size: 18px; font-weight: 700; color: #f3ffe4; }
    .cc-lobby-txt i { font-size: 13px; font-style: normal; color: rgba(255,255,255,0.55); }
    .cc-lobby-badge {
      position: absolute; top: -3px; right: -3px; width: 13px; height: 13px; border-radius: 50%;
      background: var(--lime, #a3ff12); box-shadow: 0 0 10px rgba(163,255,18,0.95); border: 2px solid #0a0d0b; display: none;
    }
    .cc-lobby-badge.on { display: block; }

    @media (max-width: 480px) {
      .cc-calling-name { font-size: 42px; }
      .cc-hangup { width: 64px; height: 64px; }
      .cc-hangup svg { width: 28px; height: 28px; }
      /* phones — thick flush edge band feathered into the glow, smaller blur radii */
      .cc-glow { box-shadow:
        inset 0 0 0 6px     rgba(163,255,18,0.95),
        inset 0 0 18px 9px  rgba(163,255,18,0.85),
        inset 0 0 60px 16px rgba(140,255,70,0.58),
        inset 0 0 170px 0   rgba(120,230,60,0.48); }
      .cc-glow::after { filter: blur(15px) saturate(1.6) brightness(1.3); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cc-ring-pulse, .cc-glow::before, .cc-glow::after { animation: none; }
    }
  </style>
</head>

            <span class="cc-lobby-ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.24 1.01l-2.21 2.2z"/></svg></span>

  <script>
    (function () {
      var lockSec = document.getElementById('of-lock');
      var shellSec = document.getElementById('of-shell');
      var lockBtn = document.getElementById('of-lock-btn');
      var form = document.getElementById('of-form');
      var input = document.getElementById('of-passcode');
      var submit = document.getElementById('of-submit');
      var msg = document.getElementById('of-msg');

      // ── Pass 3: floating 3D switch-card carousel (empty shells, no switches yet) ──
      var OF_CARDS = [
        { id: 'carter', connect: true, eyebrow: 'Your AI', title: 'Carter',
          cover: '/slumhouse/images/carter-cover.png?v=3', connectLabel: 'Connect to Carter' },
        { id: 'reporting', connect: true, eyebrow: 'GPT-5 Analyst', title: 'Reporting Room',
          cover: '/slumhouse/images/office-reporting.png?v=2', connectLabel: 'Enter Room' },
        { id: 'bot_power', eyebrow: 'Main switch', title: 'Bot Power',
          on: 'The bot makes trades.',
          off: 'The bot stops — no new trades. (Turns RED if it pauses itself for safety; flip ON to resume.)' },
        { id: 'learning_loop', eyebrow: 'Smart mode', title: 'Learning Loop', threeMode: true,
          modes: [
            { key: 0, label: 'OFF', desc: 'Brain asleep — no overnight study, no changes. Everything stays frozen.' },
            { key: 1, label: 'OBSERVE', desc: 'Brain studies your trades overnight and sends a morning report (regime, leaks, decay, rankings). It changes nothing on its own — insight only, zero risk.' },
            { key: 2, label: 'AUTOPILOT', desc: 'Brain studies AND improves itself — proposes and tests its own changes. Every change still passes all safety gates before it can go live.' }
          ],
          on: 'The bot studies its own trades overnight and improves itself.',
          off: 'The bot stays exactly as it is — it makes no changes to itself.' },
        { id: 'vacation_mode', eyebrow: 'Away', title: 'Vacation Mode',
          on: 'Fully hands-off while you are away — the bot can put strategies live and un-pause itself on its own.',
          off: 'You are in control — the bot waits for your OK before going live or un-pausing.' },
        // Layer-4 Office P0 (2026-07-02): the recovery switch existed on the
        // backend (momentary — clears a safety auto-halt) but had no card, so it
        // was unreachable from the UI. Momentary handling already lives in
        // onToggle (s.momentary + confirmAction).
        { id: 'recovery', eyebrow: 'Safety stop', title: 'Recovery',
          on: 'Press to clear the safety stop after the bot halted itself — it goes straight back to work.',
          off: 'Nothing to clear — the bot has not halted itself. (Turns RED when a safety halt is active.)' },
        { id: 'live_execution', eyebrow: 'Real money', title: 'Live Execution',
          on: 'Trades REAL money in your funded account.',
          off: 'Practice mode only (paper) — no real money at risk.',
          lockNote: 'Locked for now — needs broker setup before this can turn on.' }
      ];
      var ofTrack = document.getElementById('of-track');
      var ofDots = document.getElementById('of-dots');
      var ofCur = 0, ofInited = false, ofSwitches = {};

      function ofLayout() {
        var cards = ofTrack.children;
        var n = cards.length;
        var prevI = (ofCur - 1 + n) % n;   // wrap: always a card on the LEFT
        var nextI = (ofCur + 1) % n;        // wrap: always a card on the RIGHT
        for (var i = 0; i < n; i++) {
          var c = cards[i];
          c.classList.remove('is-active', 'is-prev', 'is-next', 'is-far');
          if (i === ofCur) c.classList.add('is-active');
          else if (i === prevI) c.classList.add('is-prev');
          else if (i === nextI) c.classList.add('is-next');
          else c.classList.add('is-far');
        }
        var dots = ofDots.children;
        for (var d = 0; d < dots.length; d++) {
          if (d === ofCur) dots[d].classList.add('on'); else dots[d].classList.remove('on');
        }
      }
      function ofGo(i) { var n = OF_CARDS.length; ofCur = ((i % n) + n) % n; ofLayout(); }

      // Reporting Room — the room UI is being designed next; the door is wired,
      // this is a placeholder toast until the room build lands.
      function enterReportingRoom() {
        var t = document.createElement('div');
        t.textContent = 'Reporting Room — building this next.';
        t.style.cssText = 'position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:99999;background:rgba(0,0,0,0.88);color:#a3ff12;border:1px solid rgba(163,255,18,0.4);padding:12px 22px;border-radius:12px;font-size:14px;font-weight:700;box-shadow:0 0 26px rgba(163,255,18,0.22);opacity:0;transition:opacity 0.2s;';
        document.body.appendChild(t);
        requestAnimationFrame(function () { t.style.opacity = '1'; });
        setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 260); }, 1800);
      }

      function initCarousel() {
        if (ofInited) return; ofInited = true;
        OF_CARDS.forEach(function (cd, i) {
          var el = document.createElement('div');
          el.className = 'of-card3d';
          if (cd.connect) {
            // Carter connect card — mirrors the Slumdawg UpTOP connect screen
            // (cover art + dark veil + glassy lime pill). No toggle.
            el.classList.add('of-connect');
            el.innerHTML =
              '<div class="of-connect-cover" style="background-image:url(\'' + cd.cover + '\')"></div>' +
              '<div class="of-connect-veil"></div>' +
              '<div class="of-connect-foot">' +
                '<button class="of-connect-pill" type="button" data-connect><span>&#9658;</span> ' + cd.connectLabel + '</button>' +
              '</div>';
            el.addEventListener('click', function () { if (i !== ofCur) ofGo(i); });
            var cbtn = el.querySelector('[data-connect]');
            cbtn.addEventListener('click', function (e) { e.stopPropagation(); if (cd.id === 'reporting') enterReportingRoom(); else connectCarter(); });
            ofTrack.appendChild(el);
            var cdot = document.createElement('button');
            cdot.className = 'of-dot'; cdot.type = 'button';
            cdot.addEventListener('click', function () { ofGo(i); });
            ofDots.appendChild(cdot);
            return; // connect card has no toggle — skip the switch-card wiring
          }
          var ofBody;
          if (cd.threeMode) {
            ofBody = '<div class="of-onoff of-3mode">' +
              cd.modes.map(function (m) {
                return '<div class="of-mode" data-mode="' + m.key + '"><span class="lbl">' + m.label + '</span><span>' + m.desc + '</span></div>';
              }).join('') +
              '</div>';
          } else {
            ofBody = '<div class="of-onoff">' +
              '<div class="of-on"><span class="lbl">ON</span><span>' + cd.on + '</span></div>' +
              '<div class="of-off"><span class="lbl">OFF</span><span>' + cd.off + '</span></div>' +
            '</div>';
          }
          el.innerHTML =
            '<div class="of-card-top"><span class="of-card-eyebrow">' + cd.eyebrow + '</span><span class="of-card-badge" data-badge>—</span></div>' +
            '<div class="of-card-title">' + cd.title + '</div>' +
            ofBody +
            (cd.lockNote ? '<div class="of-locknote">🔒 ' + cd.lockNote + '</div>' : '') +
            '<div class="of-toggle-row"><div class="of-toggle" data-toggle></div><span class="of-status" data-status>—</span></div>';
          el.addEventListener('click', function () { if (i !== ofCur) ofGo(i); });
          var tg = el.querySelector('[data-toggle]');
          tg.addEventListener('click', function (e) { e.stopPropagation(); onToggle(cd); });
          ofTrack.appendChild(el);
          var dot = document.createElement('button');
          dot.className = 'of-dot'; dot.type = 'button';
          dot.addEventListener('click', function () { ofGo(i); });
          ofDots.appendChild(dot);
        });
        var prev = document.querySelector('.of-prev');
        var next = document.querySelector('.of-next');
        if (prev) prev.addEventListener('click', function () { ofGo(ofCur - 1); });
        if (next) next.addEventListener('click', function () { ofGo(ofCur + 1); });

        // Swipe to change cards (mobile — arrows are hidden there).
        var stage = document.querySelector('.of-stage3d');
        if (stage) {
          var sx = 0, sy = 0, tracking = false;
          stage.addEventListener('touchstart', function (e) {
            var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; tracking = true;
          }, { passive: true });
          stage.addEventListener('touchend', function (e) {
            if (!tracking) return; tracking = false;
            var t = e.changedTouches[0];
            var dx = t.clientX - sx, dy = t.clientY - sy;
            if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
              ofGo(dx < 0 ? ofCur + 1 : ofCur - 1);   // swipe left → next, right → prev
            }
          }, { passive: true });
        }
        ofLayout();
        loadSwitches();
      }

      // Carter connect — opens the Slumdawg Lobby (Call Carter | Check Messages).
      // The overlay logic lives in the ES module at the end of the body, which
      // exposes window.openCarterLobby(). This non-module script just hands off.
      function connectCarter() {
        if (typeof window.openCarterLobby === 'function') {
          window.openCarterLobby();
          return;
        }
        // Module not ready yet (very early tap) — brief affordance, no-op.
        var pill = document.querySelector('.of-connect-pill');
        if (!pill) return;
        var prev = pill.innerHTML;
        pill.innerHTML = '<span>&#9679;</span> One moment…';
        pill.disabled = true;
        setTimeout(function () { pill.innerHTML = prev; pill.disabled = false; }, 900);
      }

      function loadSwitches() {
        fetch('/slumhouse/admin/switches', { credentials: 'same-origin' })
          .then(function (r) { return r.json(); })
          .then(function (d) { ofSwitches = (d && d.switches) || {}; applySwitches(); })
          .catch(function () {});
      }
      function applySwitches() {
        OF_CARDS.forEach(function (cd, i) {
          if (cd.connect) return; // Carter connect card has no toggle/badge/status
          var el = ofTrack.children[i]; if (!el) return;
          var s = ofSwitches[cd.id] || {};
          var tg = el.querySelector('[data-toggle]');
          var st = el.querySelector('[data-status]');
          var bd = el.querySelector('[data-badge]');
          if (cd.threeMode) {                                  // 3-mode dial render
            var mode3 = (typeof s.mode === 'number') ? s.mode : 0;
            var rows = el.querySelectorAll('.of-mode');
            for (var r = 0; r < rows.length; r++) {
              if (parseInt(rows[r].getAttribute('data-mode'), 10) === mode3) rows[r].classList.add('active');
              else rows[r].classList.remove('active');
            }
            tg.classList.remove('on', 'alert', 'disabled');
            if (!s.wired) tg.classList.add('disabled');
            else if (mode3 === 2) tg.classList.add('on');        // AUTOPILOT = green
            else if (mode3 === 1) tg.classList.add('alert');     // OBSERVE = amber
            // mode 0 (OFF) = neutral
            var lbl3 = s.label || (mode3 === 2 ? 'AUTOPILOT' : mode3 === 1 ? 'OBSERVE' : 'OFF');
            st.textContent = lbl3;
            st.className = 'of-status ' + (mode3 === 2 ? 'on' : (mode3 === 1 ? 'alert' : 'paused'));
            if (bd) {
              bd.textContent = s.wired ? 'LIVE' : (s.needsSetup ? 'SETUP' : 'SOON');
              bd.className = 'of-card-badge' + (s.wired ? ' on' : '');
            }
            return;
          }
          var state = s.state || (s.on ? 'running' : 'paused');
          tg.classList.remove('on', 'alert');
          if (state === 'running') tg.classList.add('on');     // GREEN + green pulse
          else if (s.wired) tg.classList.add('alert');         // RED + red pulse (paused/halted on a LIVE switch)
          // not-yet-wired switches stay neutral gray (disabled)
          if (s.wired) tg.classList.remove('disabled'); else tg.classList.add('disabled');
          st.textContent = s.status || (s.on ? 'ON' : 'OFF');
          st.className = 'of-status ' + (state === 'running' ? 'on' : (s.wired ? 'alert' : 'paused'));
          if (bd) {
            bd.textContent = s.wired ? 'LIVE' : (s.needsSetup ? 'SETUP' : 'SOON');
            bd.className = 'of-card-badge' + (s.wired ? ' on' : '');
          }
        });
      }
      function onToggle(cd) {
        var s = ofSwitches[cd.id] || {};
        if (!s.wired) return;                                  // not wired yet
        if (cd.threeMode) {                                    // 3-mode dial: OFF → OBSERVE → AUTOPILOT → OFF
          var cur = (typeof s.mode === 'number') ? s.mode : 0;
          var nextMode = (cur + 1) % 3;
          if (nextMode === 2 && !window.confirm('Turn ON AUTOPILOT for ' + cd.title + '?\n\nThe bot will start proposing + testing its OWN changes overnight (each still passes every safety gate before it can go live).')) return;
          fetch('/slumhouse/admin/switch', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: cd.id, mode: nextMode })
          })
            .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
            .then(function (res) {
              if (res.status === 200 && res.body && res.body.ok) {
                loadSwitches();   // re-read authoritative mode/label from the server
              } else if (res.status === 401) { showLocked(); }
            })
            .catch(function () {});
          return;
        }
        var willBe = !s.on;
        if (s.momentary) {                                     // recovery — a trigger, not an on/off state
          if (s.confirmAction && !window.confirm('Clear the safety stop on ' + cd.title + '?\n\nThis re-enables the bot after it halted itself.')) return;
          willBe = true;
        } else if (s.dangerOff && s.on) {                      // turning a dangerous switch OFF
          if (!window.confirm('Turn OFF ' + cd.title + '?\n\nThis stops the bot from making any trades.')) return;
        } else if (s.dangerOn && !s.on) {                      // turning a sensitive switch ON
          if (!window.confirm('Turn ON ' + cd.title + '?')) return;
        }
        fetch('/slumhouse/admin/switch', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: cd.id, on: willBe })
        })
          .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
          .then(function (res) {
            if (res.status === 200 && res.body && res.body.ok) {
              ofSwitches[cd.id] = Object.assign({}, s, { on: res.body.on, state: res.body.state, status: res.body.status });
              applySwitches();
              loadSwitches();   // re-read derived states (e.g. recovery clearing a halt)
            } else if (res.status === 401) { showLocked(); }
          })
          .catch(function () {});
      }

      function showUnlocked() {
        lockSec.classList.add('of-hide');
        shellSec.classList.remove('of-hide');
        lockBtn.classList.remove('of-hide');
        initCarousel();
        // Layer-4 Office P0: wake the risk-truth + approvals modules.
        document.dispatchEvent(new CustomEvent('office:unlocked'));
      }
      function showLocked() {
        shellSec.classList.add('of-hide');
        lockBtn.classList.add('of-hide');
        lockSec.classList.remove('of-hide');
        // Layer-4 Office P0: hide + stop the risk-truth + approvals modules.
        document.dispatchEvent(new CustomEvent('office:locked'));
        input.value = '';                 // never leave a passcode sitting in the box
        // clear again after any late browser autofill, then focus
        setTimeout(function () { input.value = ''; input.focus(); }, 60);
        setTimeout(function () { input.value = ''; }, 400);
      }
      function setMsg(text, cls) {
        msg.textContent = text || '';
        msg.className = 'of-msg' + (cls ? ' ' + cls : '');
      }

      // On load: ask the server if we're already unlocked / configured.
      fetch('/slumhouse/admin/status', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (s) {
          if (s && s.unlocked) { showUnlocked(); return; }
          showLocked();
          if (s && !s.configured) {
            setMsg('Office not configured — set SLUMHOUSE_ADMIN_PASSCODE in .env.', 'warn');
            submit.disabled = true;
          }
        })
        .catch(function () { showLocked(); });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var pass = input.value || '';
        if (!pass) { setMsg('Enter the passcode.', 'err'); return; }
        submit.disabled = true;
        setMsg('Checking…', '');
        fetch('/slumhouse/admin/auth', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode: pass })
        })
          .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
          .then(function (res) {
            submit.disabled = false;
            input.value = '';
            if (res.status === 200 && res.body && res.body.ok) { setMsg('', ''); showUnlocked(); return; }
            if (res.status === 429) { setMsg('Too many attempts — locked out, try again later.', 'err'); return; }
            if (res.status === 503) { setMsg('Office not configured — set SLUMHOUSE_ADMIN_PASSCODE in .env.', 'warn'); return; }
            setMsg('Wrong passcode.', 'err');
          })
          .catch(function () { submit.disabled = false; setMsg('Network error — try again.', 'err'); });
      });

      lockBtn.addEventListener('click', function () {
        fetch('/slumhouse/admin/logout', { method: 'POST', credentials: 'same-origin' })
          .then(function () { showLocked(); setMsg('Locked.', ''); })
          .catch(function () { showLocked(); });
      });

      // Lock-on-exit: the instant the operator leaves the Office (nav away, close,
      // refresh), clear the admin session so returning ALWAYS re-prompts for the
      // passcode. sendBeacon fires reliably during page teardown.
      window.addEventListener('pagehide', function () {
        try { navigator.sendBeacon('/slumhouse/admin/logout'); } catch (e) { /* noop */ }
      });
    })();
  </script>

    var inboxBadge = document.getElementById('cc-inbox-badge');
    var inboxReturnPhase = 'cc-lobby';
    var inboxTimer = null;
    var lastSeenInboxId = (function () { try { return localStorage.getItem('cc-inbox-seen') || ''; } catch (e) { return ''; } })();
    var attachBtn   = document.getElementById('cc-attach-btn');
    var attachInput = document.getElementById('cc-attach-input');
    var toastEl     = document.getElementById('cc-toast');
    var toastTimer  = null;

    var conversation = null;   // ElevenLabs Conversation instance
    var ringEl = document.getElementById('cc-ring');  // looping <audio> ringtone
    var ringTimer = null;
    var ringsPlayed = 0;
    var connected = false;
    var phase = 'idle';        // 'idle' | 'calling' | 'immersive'
    var rafId = null;
    var voice = 0;             // smoothed [0..1] → --carter-voice
    var mode = 'listening';    // 'speaking' | 'listening'
    var MIN_RINGS = 2;         // let it ring a couple times for realism

    function setVoice(v) { overlay.style.setProperty('--carter-voice', v.toFixed(3)); }

    // ── Ringback via a looping <audio> element ──────────────────────────────
    // Reliable on iOS across REPEAT calls. (Web Audio suspend/resume kept dying
    // after the first call — that's why the ring only worked once.)
    function startRinging() {
      if (ringEl) {
        try { ringEl.currentTime = 0; var p = ringEl.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
      }
      ringsPlayed = 1;          // first ring is playing now
      maybeAnswer();
      ringTimer = setInterval(function () {
        if (phase !== 'calling') return;
        ringsPlayed++;          // one ring per 3.5s loop of the tone
        maybeAnswer();
      }, 3500);
    }
    function stopRinging() {
      if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
      if (ringEl) { try { ringEl.pause(); ringEl.currentTime = 0; } catch (e) {} }
    }

    // Answer-transition: cut to immersive ONLY once connected AND ≥2 rings played.
    // If connect is slow we keep ringing; if connect is fast we still let it ring.
    function maybeAnswer() {
      if (phase === 'calling' && connected && ringsPlayed >= MIN_RINGS) goImmersive();
    }
    function goImmersive() {
      phase = 'immersive';
      stopRinging();
      // Keep audioCtx alive + reuse it (closing it here is what broke the ring
      // on every call after the first). stopRinging() already silences it.
      showCarterPhase('cc-immersive');
      updateMicState();
      var blob = document.getElementById('cc-blob');
      if (blob) { var p = blob.play(); if (p && p.catch) p.catch(function(){}); }
    }

    function updateMicState() {
      if (!micState) return;
      if (mode === 'speaking') { micState.textContent = 'Carter is speaking'; micState.classList.add('speaking'); }
      else { micState.textContent = 'Listening…'; micState.classList.remove('speaking'); }
    }

    // ── Voice-reactive loop: drives --carter-voice every frame ──
    function startVoiceLoop() {
      cancelAnimationFrame(rafId);
      var tick = function (t) {
        var target;
        if (connected && mode === 'speaking' && conversation && typeof conversation.getOutputVolume === 'function') {
          var vol = 0;
          try { vol = conversation.getOutputVolume() || 0; } catch (e) { vol = 0; }
          // speaking: bright floor 0.5 + amplified volume so even quiet speech reacts hard
          target = Math.min(1, 0.5 + vol * 3.5);
        } else {
          // idle / listening: DIM gentle breathe so speaking clearly pops brighter
          target = 0.12 + 0.06 * (0.5 + 0.5 * Math.sin(t / 1500));
        }
        voice += (target - voice) * 0.18;   // smoothing
        setVoice(voice);
        rafId = requestAnimationFrame(tick);
      };
      rafId = requestAnimationFrame(tick);
    }

    function showError(msg) {
      stopRinging();
      if (callStat) callStat.textContent = msg || 'Couldn’t reach Carter';
      if (callSub) callSub.textContent = 'Tap the red button to hang up and try again.';
    }

    async function openCarterCall() {
      if (phase === 'calling' || phase === 'immersive') return; // already in a call
      phase = 'calling';
      connected = false; mode = 'listening'; voice = 0.2;
      // Establish mic permission INSIDE this click gesture (so the prompt times
      // right on iOS), then immediately STOP the tracks — we don't hold the mic
      // open ourselves (that's what left the mic on after disconnect). The grant
      // persists for the page, so the ConvAI SDK acquires its own without a new
      // prompt, and endSession() releases it cleanly when the call ends.
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function (s) { s.getTracks().forEach(function (t) { t.stop(); }); })
            .catch(function () {});
        }
      } catch (e) {}
      if (callStat) callStat.textContent = 'Calling…';
      if (callSub) callSub.textContent = 'CEO · Slumdawg Traders';
      overlay.classList.add('cc-open');
      overlay.setAttribute('aria-hidden', 'false');
      startInboxPolling();
      showCarterPhase('cc-calling');
      setVoice(voice);
      startVoiceLoop();
      startRinging();          // synchronous → stays inside the click gesture (iOS)

      try {
        var r = await fetch('/slumhouse/api/carter-session', { method: 'POST', credentials: 'same-origin' });
        if (!r.ok) { showError(r.status === 401 ? 'Session expired — re-unlock the Office' : 'Couldn’t reach Carter'); return; }
        var data = await r.json();
        var token = data && data.conversationToken;
        if (!token) { showError('Couldn’t reach Carter'); return; }
        if (phase !== 'calling') return;   // user hung up / navigated away while minting
        conversation = await Conversation.startSession({
          conversationToken: token,
          connectionType: 'webrtc',
          onConnect: function () { connected = true; maybeAnswer(); },
          onModeChange: function (m) { mode = (m && m.mode) || 'listening'; updateMicState(); },
          onDisconnect: function () { endCarterCall(); },
          onError: function () { showError('Call error — hang up and retry'); }
        });
      } catch (e) {
        showError('Couldn’t reach Carter');
      }
    }

    async function endCarterCall() {
      stopRinging();
      cancelAnimationFrame(rafId); rafId = null;
      phase = 'idle';
      // endSession() releases the SDK's mic — that turns the mic indicator OFF.
      if (conversation) { try { await conversation.endSession(); } catch (e) {} conversation = null; }
      connected = false; mode = 'listening';
      overlay.classList.remove('cc-open');
      overlay.setAttribute('aria-hidden', 'true');
      if (lobbyPhase) lobbyPhase.classList.remove('cc-on');
      if (inboxPhase) inboxPhase.classList.remove('cc-on');
      phaseCall.classList.remove('cc-on');
      phaseImm.classList.remove('cc-on');
      setVoice(0);
      stopInboxPolling();
    }

    // ── Deliverables inbox — premium green-gradient bubbles over solid black ──
    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    var INBOX_EMPTY = '<div class="cc-inbox-empty">Nothing yet. Ask Carter to research something and it\'ll land here.</div>';
    function renderInbox(items) {
      if (!inboxFeed) return;
      items = items || [];
      if (!items.length) { inboxFeed.innerHTML = INBOX_EMPTY; return; }
      var html = '';
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var cls = 'cc-bubble' + (it.status === 'running' ? ' running' : '') + (it.type === 'alert' ? ' alert' : '');
        var label = it.type === 'research' ? (it.status === 'running' ? 'Researching' : 'Research')
                  : (it.type === 'insight' ? 'Insight' : 'Alert');
        var body = '';
        if (it.status === 'running') {
          body = '<div class="cc-bubble-body">On it — pulling this now, about a minute or two.</div>';
        } else if (it.status === 'failed') {
          body = '<div class="cc-bubble-body">That scan didn\'t come back — ask me to try again.</div>';
        } else {
          // Findings report (synthesized) is the headline act; raw links become "Sources".
          if (it.summary) {
            body += '<div class="cc-bubble-body cc-bubble-report">' + escHtml(it.summary).replace(/\n/g, '<br>') + '</div>';
          } else if (it.headline) {
            body += '<div class="cc-bubble-body">' + escHtml(it.headline) + '</div>';
          }
          var links = it.items || [];
          if (links.length) body += '<div class="cc-bubble-sources">Sources</div>';
          for (var j = 0; j < links.length; j++) {
            var lk = links[j];
            if (!lk) continue;
            var snip = lk.snippet ? '<span class="cc-link-snip">' + escHtml(lk.snippet) + '</span>' : '';
            if (lk.url) body += '<a class="cc-bubble-link" href="' + escHtml(lk.url) + '" target="_blank" rel="noopener">' + escHtml(lk.title) + snip + '</a>';
            else body += '<div class="cc-bubble-link">' + escHtml(lk.title) + snip + '</div>';
          }
        }
        html += '<div class="' + cls + '"><span class="cc-bubble-type">' + escHtml(label) + '</span>' +
                '<div class="cc-bubble-title">' + escHtml(it.title) + '</div>' + body + '</div>';
      }
      inboxFeed.innerHTML = html;
      var newest = items.length ? String(items[0].id) : '';
      var atInbox = (phase === 'inbox');
      if (atInbox && newest) {
        lastSeenInboxId = newest;
        try { localStorage.setItem('cc-inbox-seen', newest); } catch (e) {}
      }
      var hasNew = !!newest && newest !== lastSeenInboxId && !atInbox;
      if (inboxBadge) inboxBadge.classList.toggle('on', hasNew);
      if (lobbyBadge) lobbyBadge.classList.toggle('on', hasNew);
    }
    function pollInbox() {
      fetch('/slumhouse/api/carter-inbox', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : { items: [] }; })
        .then(function (d) { renderInbox((d && d.items) || []); })
        .catch(function () {});
    }
    function startInboxPolling() { stopInboxPolling(); pollInbox(); inboxTimer = setInterval(pollInbox, 12000); }
    function stopInboxPolling() { if (inboxTimer) { clearInterval(inboxTimer); inboxTimer = null; } }

    // ── Phase navigation across the Carter overlay (lobby → call | inbox) ──
    function showCarterPhase(id) {
      [lobbyPhase, phaseCall, phaseImm, inboxPhase].forEach(function (el) { if (el) el.classList.remove('cc-on'); });
      var t = document.getElementById(id);
      if (t) t.classList.add('cc-on');
    }
    function openCarterLobby() {
      phase = 'lobby';
      overlay.classList.add('cc-open');
      overlay.setAttribute('aria-hidden', 'false');
      showCarterPhase('cc-lobby');
      startInboxPolling();   // keep the Check-Messages badge fresh
    }
    function goInbox(fromPhase) {
      inboxReturnPhase = fromPhase || 'cc-lobby';
      phase = 'inbox';
      if (inboxBadge) inboxBadge.classList.remove('on');
      if (lobbyBadge) lobbyBadge.classList.remove('on');
      showCarterPhase('cc-inbox-phase');
      pollInbox();
    }
    function inboxBack() {
      if (inboxReturnPhase === 'cc-immersive') { phase = 'immersive'; showCarterPhase('cc-immersive'); }
      else { phase = 'lobby'; showCarterPhase('cc-lobby'); }
    }
    if (inboxBtn) inboxBtn.addEventListener('click', function () { goInbox('cc-immersive'); });
    if (inboxBackBtn) inboxBackBtn.addEventListener('click', inboxBack);
    if (lobbyMsgsBtn) lobbyMsgsBtn.addEventListener('click', function () { goInbox('cc-lobby'); });
    if (lobbyCallBtn) lobbyCallBtn.addEventListener('click', function () { openCarterCall(); });
    if (lobbyCloseBtn) lobbyCloseBtn.addEventListener('click', function () { endCarterCall(); });

    // ── Show Carter an image/PDF — sent INTO the live conversation so his EL
    //    GPT-5.4 (multimodal) actually sees it; he answers on voice. ──
    function showToast(msg) {
      if (!toastEl) return;
      toastEl.textContent = msg;
      toastEl.classList.add('on');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 3200);
    }
    function sendAttachment(file) {
      if (!file) return;
      if (!conversation || !connected) { showToast('Wait for Carter to pick up, then attach'); return; }
      if (typeof conversation.uploadFile !== 'function' || typeof conversation.sendMultimodalMessage !== 'function') {
        showToast('Attach not available on this connection'); return;
      }
      var isPdf = (file.type || '').indexOf('pdf') >= 0 || /\.pdf$/i.test(file.name || '');
      var kind = isPdf ? 'document' : 'image';
      showToast('Sending Carter your ' + kind + '…');
      Promise.resolve(conversation.uploadFile(file))
        .then(function (res) {
          var fileId = res && (res.fileId || res.file_id);
          if (!fileId) throw new Error('no file_id in upload response');
          conversation.sendMultimodalMessage({
            text: 'I just sent you a ' + kind + ' — take a look and tell me what you see.',
            fileId: fileId,
          });
          showToast("Sent — Carter's looking…");
        })
        .catch(function (e) {
          var m = (e && e.message) ? e.message : String(e);
          showToast('Send failed: ' + m.slice(0, 80));
          try { console.error('[carter-attach] upload/send failed:', e); } catch (_) {}
        });
    }
    if (attachBtn) attachBtn.addEventListener('click', function () {
      if (!conversation || !connected) { showToast('Wait for Carter to pick up, then attach'); return; }
      if (attachInput) attachInput.click();
    });
    if (attachInput) attachInput.addEventListener('change', function () {
      var f = attachInput.files && attachInput.files[0];
      sendAttachment(f);
      attachInput.value = '';   // reset so the same file can be re-picked
    });

    var hangA = document.getElementById('cc-hangup-a');
    var hangB = document.getElementById('cc-hangup-b');
    if (hangA) hangA.addEventListener('click', function () { endCarterCall(); });
    if (hangB) hangB.addEventListener('click', function () { endCarterCall(); });
    // Release the mic + session if the operator leaves the page mid-call.
    window.addEventListener('pagehide', function () { if (phase !== 'idle') endCarterCall(); });

    window.openCarterCall = openCarterCall;
    window.openCarterLobby = openCarterLobby;
  </script>
</body>
</html>
