<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slumhouse · The Menu</title>
  <link rel="stylesheet" href="/slumhouse/slumhouse.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/slumhouse/icons/slumdawg-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/slumhouse/icons/slumdawg-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/slumhouse/icons/slumdawg-180.png">
  <link rel="manifest" href="/slumhouse/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Slumdawg">
  <style>
    /* ─── The Menu — tabbed dish board (Crib-grade pitch-black glassy 3D) ─── */

    /* Tab bar — glassy pills, same DNA as .sh-nav but full-width row */
    .mn-tabbar {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      background: rgba(8, 10, 8, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      padding: 5px;
      width: fit-content;
      max-width: 100%;
      margin-bottom: 14px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.015), 0 8px 28px rgba(0, 0, 0, 0.55);
    }
    .mn-tab {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: 0;
      cursor: pointer;
      font-family: inherit;
      padding: 9px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--mute);
      transition: color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .mn-tab:hover { color: #bbb; }
    .mn-tab.active {
      background: #161616;
      color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(163, 255, 18, 0.12);
    }

    /* Symbol sub-pills under "In the Kitchen" */
    .mn-subpills {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      align-items: center;
    }
    .mn-subpills-lbl {
      font-size: 10px;
      color: var(--mute);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
      margin-right: 4px;
    }
    .mn-subpill {
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      font-family: var(--num-font);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--dim);
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .mn-subpill:hover { color: #bbb; border-color: rgba(255, 255, 255, 0.16); }
    .mn-subpill.active {
      background: rgba(163, 255, 18, 0.08);
      border-color: rgba(163, 255, 18, 0.3);
      color: var(--lime);
    }

    /* Card grid */
    .mn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    /* Dish card — black-glass, hairline top sheen, deep shadow (kitchen DNA) */
    .mn-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: rgba(8, 10, 8, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 20px 20px 16px;
      overflow: hidden;
      text-decoration: none;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.015),
        0 8px 28px rgba(0, 0, 0, 0.55);
      transition: transform 0.22s ease, border-color 0.2s, box-shadow 0.22s;
      transform-style: preserve-3d;
    }
    .mn-card::before {
      content: "";
      position: absolute;
      top: 0; left: 18px; right: 18px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.10), transparent);
      pointer-events: none;
    }
    .mn-card:hover {
      transform: perspective(900px) rotateX(1.5deg) translateY(-2px);
      border-color: rgba(163, 255, 18, 0.22);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.02),
        0 18px 40px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(163, 255, 18, 0.08);
    }

    .mn-card-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .mn-card-tag {
      font-size: 11px;
      color: var(--dim);
      font-family: var(--num-font);
      letter-spacing: 0.02em;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mn-card-note {
      font-size: 11px;
      color: var(--warm);
      font-style: italic;
      margin-top: 10px;
    }
    .mn-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed rgba(255, 255, 255, 0.07);
    }
    .mn-chip {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--num-font);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(163, 255, 18, 0.06);
      border: 1px solid rgba(163, 255, 18, 0.22);
      color: var(--lime);
    }
    .mn-chip.gray {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.1);
      color: var(--dim);
    }
    .mn-card-meta {
      font-size: 11px;
      color: var(--mute);
      font-family: var(--num-font);
      letter-spacing: 0.02em;
      text-align: right;
    }
    .mn-card-meta b { color: var(--ink); font-weight: 700; }

    /* State panels (error + empty) */
    .mn-state {
      background: rgba(8, 10, 8, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.015), 0 8px 28px rgba(0, 0, 0, 0.55);
    }
    .mn-state-err { color: #e6674c; font-size: 14px; line-height: 1.6; }
    .mn-state-empty { color: var(--mute); font-size: 14px; font-style: italic; }
    .mn-retry {
      color: var(--lime);
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .mn-retry:hover { text-shadow: 0 0 10px rgba(163, 255, 18, 0.5); }

    .mn-loading { color: var(--mute); font-size: 13px; padding: 30px 4px; font-style: italic; }

    @media (max-width: 640px) {
      .mn-tab { padding: 8px 13px; font-size: 12px; }
      .mn-grid { grid-template-columns: minmax(0, 1fr); }
      .mn-card-name { font-size: 16px; }
      .mn-subpills { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header class="sh-header">
    <a class="sh-logo" href="/slumhouse/crib.html" aria-label="Slumhouse">
      <svg viewBox="0 0 64 56" width="38" height="34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="mn-bull-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c5ff5f"/>
            <stop offset="100%" stop-color="#a3ff12"/>
          </linearGradient>
          <filter id="mn-bull-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="1.2" result="g"/>
            <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g filter="url(#mn-bull-glow)">
          <path d="M14 14 L17 4 L25 16 Z" fill="url(#mn-bull-grad)"/>
          <path d="M50 14 L47 4 L39 16 Z" fill="url(#mn-bull-grad)"/>
          <path d="M16 14 C 16 8, 24 4, 32 4 C 40 4, 48 8, 48 14 L 52 26 C 52 36, 48 42, 44 44 L 41 50 C 37 52, 27 52, 23 50 L 20 44 C 16 42, 12 36, 12 26 Z" fill="url(#mn-bull-grad)"/>
        </g>
        <path d="M20 18 Q32 14 44 18" stroke="#000" stroke-width="1.4" fill="none" opacity="0.55"/>
        <rect x="20" y="22" width="6" height="4" rx="1" fill="#000"/>
        <rect x="38" y="22" width="6" height="4" rx="1" fill="#000"/>
        <circle cx="24" cy="23" r="0.7" fill="#fff" opacity="0.9"/>
        <circle cx="42" cy="23" r="0.7" fill="#fff" opacity="0.9"/>
        <path d="M27 32 Q32 30 37 32 Q37 36 32 36 Q27 36 27 32 Z" fill="#000"/>
        <path d="M24 41 Q32 39 40 41" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M28.5 41.2 L28.5 44.2 L30 42.5 Z" fill="#fff" opacity="0.95"/>
        <path d="M35.5 41.2 L35.5 44.2 L34 42.5 Z" fill="#fff" opacity="0.95"/>
      </svg>
      <div class="sh-logo-text">
        <span class="sh-logo-name">SLUMHOUSE</span>
        <span class="sh-logo-sub">/ TRADERS</span>
      </div>
    </a>
    <nav class="sh-nav">
      <a class="sh-pill" href="/slumhouse/crib.html">The Crib</a>
      <a class="sh-pill" href="/slumhouse/kitchen.html">The Kitchen</a>
      <a class="sh-pill active" href="/slumhouse/menu.html">The Menu</a>
      <a class="sh-pill" href="/slumhouse/recipe.html">The Recipe</a>
      <a class="sh-pill" href="/slumhouse/office.html">The Office</a>
    </nav>
    <div class="sh-header-spacer">
      <a class="sh-signout" href="/slumhouse/auth/logout" title="Sign out of Slumhouse">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </a>
    </div>
  </header>

  <div class="sh-page">
    <h1 class="sh-title">The Menu</h1>
    <p class="sh-sub">Every dish the kitchen is serving, plating, cooking — and the ones it buried.</p>

    <div id="mn-tabbar" class="mn-tabbar"></div>
    <div id="mn-subpills" class="mn-subpills" style="display:none"></div>
    <div id="menu-body"><div class="mn-loading">Loading the menu…</div></div>
  </div>

  <script src="/slumhouse/slumhouse.js"></script>
  <script>
    // ─── Tab definitions ────────────────────────────────────────────────
    // Each tab knows its route + how to render the payload. "kitchen" carries
    // the symbol sub-pills; the active symbol drives its ?symbol= query.
    const TABS = [
      { key: "now-serving",  label: "Now Serving",   kind: "dishes",   route: () => "/slumhouse/api/menu/now-serving", showMonth: true },
      { key: "deploy-ready", label: "Deploy-Ready",  kind: "dishes",   route: () => "/slumhouse/api/menu/deploy-ready", showMonth: false },
      { key: "kitchen",      label: "In the Kitchen", kind: "families", route: () => `/slumhouse/api/menu/kitchen?symbol=${encodeURIComponent(activeSymbol)}`, symbols: true },
      { key: "graveyard",    label: "The Graveyard", kind: "families", route: () => "/slumhouse/api/menu/graveyard", graveyard: true },
    ];
    const SYMBOLS = ["MES", "MNQ", "MCL"];

    let activeTab = "now-serving";
    let activeSymbol = "MES";

    const ERR_MSG = "Couldn't reach the kitchen — the menu is unavailable right now.";
    const EMPTY_MSG = "Nothing on this menu yet.";

    const recipeHref = (id) => `/slumhouse/recipe.html?id=${encodeURIComponent(id)}`;

    // ─── Tab bar + sub-pills render ─────────────────────────────────────
    function renderTabs() {
      const bar = document.getElementById("mn-tabbar");
      bar.innerHTML = "";
      for (const t of TABS) {
        const btn = SH.el("button",
          { class: "mn-tab" + (t.key === activeTab ? " active" : ""), type: "button", "data-tab": t.key },
          t.label
        );
        btn.addEventListener("click", () => selectTab(t.key));
        bar.appendChild(btn);
      }
      renderSubpills();
    }

    function renderSubpills() {
      const host = document.getElementById("mn-subpills");
      const tab = TABS.find(t => t.key === activeTab);
      if (!tab || !tab.symbols) { host.style.display = "none"; host.innerHTML = ""; return; }
      host.style.display = "flex";
      host.innerHTML = "";
      host.appendChild(SH.el("span", { class: "mn-subpills-lbl" }, "Symbol"));
      for (const sym of SYMBOLS) {
        const btn = SH.el("button",
          { class: "mn-subpill" + (sym === activeSymbol ? " active" : ""), type: "button", "data-symbol": sym },
          sym
        );
        btn.addEventListener("click", () => { activeSymbol = sym; renderSubpills(); loadActive(); });
        host.appendChild(btn);
      }
    }

    function selectTab(key) {
      if (key === activeTab) return;
      activeTab = key;
      renderTabs();
      loadActive();
    }

    // ─── State panels ───────────────────────────────────────────────────
    function showLoading() {
      document.getElementById("menu-body").innerHTML = '<div class="mn-loading">Loading the menu…</div>';
    }
    function showError() {
      const body = document.getElementById("menu-body");
      body.innerHTML = "";
      const retry = SH.el("a", { class: "mn-retry" }, "Try again");
      retry.addEventListener("click", loadActive);
      body.appendChild(SH.el("div", { class: "mn-state" },
        SH.el("div", { class: "mn-state-err" }, ERR_MSG + " ", retry)
      ));
    }
    function showEmpty() {
      const body = document.getElementById("menu-body");
      body.innerHTML = "";
      body.appendChild(SH.el("div", { class: "mn-state" },
        SH.el("div", { class: "mn-state-empty" }, EMPTY_MSG)
      ));
    }

    // ─── Card builders ──────────────────────────────────────────────────
    function dishCard(d, showMonth) {
      const foot = SH.el("div", { class: "mn-card-foot" },
        SH.el("span", { class: "mn-chip" }, d.symbol || "—"),
        SH.el("div", { class: "mn-card-meta" },
          d.variantCount != null
            ? SH.el("span", {}, SH.el("b", {}, String(d.variantCount)), ` cut${d.variantCount === 1 ? "" : "s"}`)
            : SH.el("span", {}, d.lifecycleState || "")
        )
      );
      return SH.el("a", { class: "mn-card", href: recipeHref(d.id) },
        SH.el("div", { class: "mn-card-name" }, d.premiumName || "Untitled dish"),
        d.variantTag ? SH.el("div", { class: "mn-card-tag" }, d.variantTag) : null,
        (showMonth && d.monthMade) ? SH.el("div", { class: "mn-card-note" }, `Made this month — ${d.monthMade}`) : null,
        foot
      );
    }

    function familyCard(f, graveyard) {
      const champ = f.champion || {};
      const cuts = Array.isArray(f.variants) ? f.variants.length : 0;
      const countLabel = graveyard
        ? `${cuts} buried`
        : `${cuts} cut${cuts === 1 ? "" : "s"}`;
      const foot = SH.el("div", { class: "mn-card-foot" },
        SH.el("span", { class: "mn-chip" + (graveyard ? " gray" : "") }, champ.symbol || "—"),
        SH.el("div", { class: "mn-card-meta" }, SH.el("b", {}, String(cuts)), " ", countLabel.replace(/^\d+\s/, ""))
      );
      // champion headline: prefer the family premiumName, show champion tag beneath
      const tagBits = [champ.variantTag, champ.timeframe, champ.lifecycleState].filter(Boolean).join(" · ");
      return SH.el("a", { class: "mn-card", href: recipeHref(champ.id) },
        SH.el("div", { class: "mn-card-name" }, f.premiumName || champ.premiumName || "Untitled family"),
        tagBits ? SH.el("div", { class: "mn-card-tag" }, tagBits) : null,
        (champ.premiumName && champ.premiumName !== f.premiumName)
          ? SH.el("div", { class: "mn-card-note" }, `Champion: ${champ.premiumName}`)
          : null,
        foot
      );
    }

    // ─── Fetch + render the active tab ──────────────────────────────────
    async function loadActive() {
      const tab = TABS.find(t => t.key === activeTab);
      if (!tab) return;
      showLoading();
      const data = await SH.fetchJSON(tab.route());
      // fetchJSON returns null on any non-auth error (401/403 already redirect
      // to login). Render a reachable error state, never a fake-empty list.
      if (!data) { showError(); return; }

      const body = document.getElementById("menu-body");
      body.innerHTML = "";

      if (tab.kind === "dishes") {
        const dishes = Array.isArray(data.dishes) ? data.dishes : [];
        if (dishes.length === 0) { showEmpty(); return; }
        const grid = SH.el("div", { class: "mn-grid" });
        for (const d of dishes) grid.appendChild(dishCard(d, tab.showMonth));
        body.appendChild(grid);
      } else {
        const families = Array.isArray(data.families) ? data.families : [];
        if (families.length === 0) { showEmpty(); return; }
        const grid = SH.el("div", { class: "mn-grid" });
        for (const f of families) grid.appendChild(familyCard(f, tab.graveyard));
        body.appendChild(grid);
      }
    }

    // ─── Boot ───────────────────────────────────────────────────────────
    renderTabs();
    loadActive();
  </script>
</body>
</html>
