<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>The Night Desk · Slumhouse</title>
  <style>
    :root{--lime:#a3ff12;--ink:#f7f4ec;--soft:#bbb7ad;--muted:#77736b;--amber:#e8b75d;--red:#ff706d;--line:rgba(255,255,255,.095);--glass:rgba(5,6,5,.76);--mono:"SFMono-Regular",Consolas,monospace}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#040504;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body::before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,.04) 55%,rgba(0,0,0,.38)),url('/slumhouse/assets/night-desk-suite.png') center/cover no-repeat;filter:saturate(.86) contrast(1.06);transform:scale(1.01)}
    body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 42% 47%,transparent 5%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.65)),linear-gradient(180deg,rgba(0,0,0,.38),transparent 24%,rgba(0,0,0,.42));box-shadow:inset 0 0 110px #000}
    button{font:inherit}.shell{position:relative;z-index:1;height:100dvh;min-height:620px;padding:16px 22px 20px;display:grid;grid-template-rows:72px minmax(0,1fr);gap:12px}.shell.embed{padding-top:12px}.shell.embed header>div:first-child{padding-left:112px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 5px;text-shadow:0 2px 20px #000}.eyebrow,.kicker{font:850 9px/1.2 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--lime)}h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:500;letter-spacing:-.04em;margin:4px 0 0}.sub{margin-top:2px;color:#aaa69d;font-size:11px}.seal{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid rgba(163,255,18,.25);border-radius:999px;background:rgba(0,0,0,.58);backdrop-filter:blur(14px);font:800 8px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}.seal i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 14px var(--lime)}
    .desk{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:14px;perspective:1500px}.glass{border:1px solid rgba(255,255,255,.12);background:linear-gradient(145deg,rgba(7,8,7,.82),rgba(2,3,2,.7));box-shadow:0 32px 80px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(22px) saturate(.82)}
    .stage{position:relative;min-width:0;min-height:0;border-radius:22px;overflow:hidden;transform:rotateY(.28deg);transform-origin:right center}.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 48% 42%,rgba(163,255,18,.045),transparent 33%),linear-gradient(105deg,rgba(255,255,255,.025),transparent 24% 78%,rgba(163,255,18,.025));z-index:2}.stage::after{content:"";position:absolute;left:15%;right:15%;bottom:-18px;height:45px;border-radius:50%;background:rgba(163,255,18,.05);filter:blur(25px);pointer-events:none}.stage-view{position:relative;z-index:1;height:100%;min-height:0;overflow:auto;scrollbar-width:none;padding:34px 42px}.stage-view::-webkit-scrollbar,.rail-list::-webkit-scrollbar{display:none}
    .scene{min-height:100%;display:grid;align-content:center;max-width:1050px;margin:auto}.scene-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}.scene-title{max-width:840px;margin:12px 0 0;font:500 clamp(35px,4.1vw,68px)/.98 Georgia,"Times New Roman",serif;letter-spacing:-.045em;text-wrap:balance}.scene-deck{max-width:720px;margin:17px 0 0;color:var(--soft);font-size:15px;line-height:1.65}.stamp{text-align:right;flex:0 0 auto;color:var(--muted);font:750 9px/1.6 var(--mono);letter-spacing:.08em;text-transform:uppercase}.stamp strong{display:block;color:var(--ink);font-size:11px}
    .hero-number{display:grid;place-items:center;margin:30px auto 18px;width:min(31vh,290px);aspect-ratio:1;border-radius:50%;position:relative;background:radial-gradient(circle,rgba(163,255,18,.12),rgba(0,0,0,.25) 58%,transparent 59%);border:1px solid rgba(163,255,18,.2);box-shadow:0 0 70px rgba(163,255,18,.09),inset 0 0 45px rgba(163,255,18,.05)}.hero-number::before,.hero-number::after{content:"";position:absolute;border-radius:50%;border:1px dashed rgba(163,255,18,.22);inset:12px;animation:orbit 18s linear infinite}.hero-number::after{inset:-14px;border-color:rgba(255,255,255,.08);animation-direction:reverse;animation-duration:26s}.hero-number b{font:800 clamp(48px,6vw,86px)/1 var(--mono);letter-spacing:-.07em}.hero-number span{margin-top:8px;color:var(--lime);font:850 9px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase}.hero-number div{text-align:center}.hero-number small{display:block;margin-top:9px;color:var(--soft);font-size:11px}
    @keyframes orbit{to{transform:rotate(360deg)}}
    .authority{justify-self:center;display:flex;align-items:center;gap:11px;max-width:760px;margin-top:16px;padding:11px 15px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.38);color:#aaa69d;font-size:11px}.authority b{color:var(--lime);white-space:nowrap}.authority.warn b{color:var(--amber)}.authority.off b{color:#aaa}
    .focus-panel{position:relative;margin-top:34px;padding:32px 34px;border:1px solid rgba(255,255,255,.09);border-radius:20px;background:linear-gradient(135deg,rgba(0,0,0,.38),rgba(10,12,9,.56));box-shadow:inset 0 1px rgba(255,255,255,.035)}.focus-panel.signal{padding-left:62px}.focus-panel.signal::before{content:"";position:absolute;left:28px;top:36px;width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 24px var(--lime)}.focus-panel.bad::before{background:var(--red);box-shadow:0 0 24px var(--red)}.focus-panel h2{margin:8px 0 0;font:500 clamp(26px,3vw,42px)/1.1 Georgia,serif;letter-spacing:-.025em}.focus-panel p{max-width:900px;margin:16px 0 0;color:#c2beb5;font-size:15px;line-height:1.75}.focus-list{list-style:none;padding:0;margin:23px 0 0;display:grid;gap:13px}.focus-list li{position:relative;padding:15px 18px 15px 42px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.065);color:#cbc7be;font-size:14px;line-height:1.6}.focus-list li::before{content:counter(item,decimal-leading-zero);counter-increment:item;position:absolute;left:15px;top:17px;color:var(--lime);font:800 8px/1 var(--mono)}.focus-list{counter-reset:item}.focus-list.bad li::before{color:var(--red)}
    .wave{height:150px;margin-top:26px;position:relative;overflow:hidden;border-radius:18px;border:1px solid rgba(255,255,255,.075);background:linear-gradient(180deg,rgba(163,255,18,.04),rgba(0,0,0,.28))}.wave::before,.wave::after{content:"";position:absolute;left:-8%;right:-8%;top:48%;height:2px;background:linear-gradient(90deg,transparent,var(--lime),transparent);filter:drop-shadow(0 0 10px var(--lime));transform:rotate(-3deg)}.wave::after{top:62%;opacity:.28;transform:rotate(4deg)}.wave.bad::before,.wave.bad::after{background:linear-gradient(90deg,transparent,var(--red),transparent);filter:drop-shadow(0 0 10px var(--red))}
    .timeline{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.timeline article{padding:20px;border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.3)}.timeline time{color:var(--amber);font:850 9px/1 var(--mono)}.timeline b{display:block;margin-top:9px;font-size:15px}.timeline p{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.receipt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:28px}.receipt-grid div{padding:22px;border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.3)}.receipt-grid span{display:block;color:var(--muted);font:800 8px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}.receipt-grid b{display:block;margin-top:10px;font-size:18px}.empty{height:100%;display:grid;place-items:center;text-align:center}.empty div{max-width:500px;color:var(--soft);font-size:14px;line-height:1.7}.empty b{display:block;margin-bottom:12px;color:var(--ink);font:500 38px/1.05 Georgia,serif}
    .rail{min-height:0;border-radius:18px;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr);transform:rotateY(-.55deg);transform-origin:left center}.rail-top{padding:17px 16px 15px;border-bottom:1px solid var(--line)}.rail-title{display:flex;align-items:center;justify-content:space-between}.loop-pill{padding:6px 8px;border:1px solid rgba(163,255,18,.27);border-radius:999px;color:var(--lime);font:900 8px/1 var(--mono);letter-spacing:.1em}.rail-help{margin-top:7px;color:var(--muted);font-size:9px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:14px;padding:4px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(0,0,0,.35)}.mode{border:0;border-radius:8px;padding:9px 5px;background:transparent;color:#77736b;cursor:pointer;font:850 8px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}.mode.on{background:var(--lime);color:#101500;box-shadow:0 0 18px rgba(163,255,18,.18)}
    .rail-list{min-height:0;overflow:auto;scrollbar-width:none;padding:11px}.rail-group{padding:10px 7px 8px;color:#8c877e;font:800 8px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}.remote-card{width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;text-align:left;border:1px solid transparent;border-radius:12px;padding:10px;background:rgba(0,0,0,.22);color:var(--ink);cursor:pointer;margin-bottom:5px}.remote-card:hover{background:rgba(255,255,255,.035)}.remote-card.on{border-color:rgba(163,255,18,.3);background:rgba(163,255,18,.055)}.remote-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);color:var(--lime);font:850 9px/1 var(--mono)}.remote-copy b{display:block;font-size:10px;line-height:1.3}.remote-copy span{display:block;margin-top:4px;color:var(--muted);font-size:8.5px;line-height:1.35}.remote-card em{font-style:normal;color:#777;font-size:13px}.remote-card.on em{color:var(--lime)}
    .hero-number b,.hero-number span{display:block}.hero-number b{margin-bottom:12px}.hero-number span{margin-top:0}.hero-number div{transform:translateY(-8px)}
    .rail{grid-template-rows:auto auto minmax(0,1fr)}.day-strip{display:flex;gap:6px;overflow-x:auto;padding:10px 11px;border-bottom:1px solid var(--line);scrollbar-width:none}.day-strip:empty,.day-strip[hidden]{display:none}.day-strip::-webkit-scrollbar{display:none}.day-btn{flex:0 0 auto;border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:7px 10px;background:rgba(0,0,0,.28);color:#8d8981;cursor:pointer;font:800 8px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}.day-btn.on{border-color:rgba(163,255,18,.35);background:rgba(163,255,18,.09);color:var(--lime)}
    @media(max-width:1100px){body{overflow:auto}.shell{height:auto;min-height:100vh}.desk{grid-template-columns:1fr}.stage{height:720px}.rail{height:560px}.timeline,.receipt-grid{grid-template-columns:1fr}}
    @media(max-width:700px){.shell{padding:10px;grid-template-rows:58px minmax(0,1fr)}h1{font-size:29px}.sub,.seal{display:none}.stage-view{padding:26px 20px}.scene-top{display:block}.stamp{text-align:left;margin-top:14px}.desk{gap:10px}.stage{height:680px}.rail{height:540px}.focus-panel{padding:24px}.focus-panel.signal{padding-left:46px}.focus-panel.signal::before{left:22px}.timeline{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){.hero-number::before,.hero-number::after{animation:none}}
  </style>
</head>
<body>
  <main class="shell" id="shell">
    <header>
      <div><div class="eyebrow">Slumhouse · Night work</div><h1>The Night Desk</h1><div class="sub">Pick one thing on the remote. The big screen will explain it.</div></div>
      <div class="seal"><i></i><span id="room-health">Opening night records</span></div>
    </header>
    <section class="desk">
      <section class="glass stage" aria-label="Night Agent stage"><div class="stage-view" id="stage"><div class="empty"><div><b>The room is waking up.</b>Reading the real overnight records now.</div></div></div></section>
      <aside class="glass rail" aria-label="Night Desk remote">
        <div class="rail-top"><div class="rail-title"><span class="kicker">The remote</span><span class="loop-pill" id="loop-pill">Checking</span></div><div class="rail-help" id="loop-help">Reading the Learning Loop switch.</div><div class="modes" role="tablist"><button class="mode on" data-mode="brief" role="tab" aria-selected="true">Last night</button><button class="mode" data-mode="reviews" role="tab" aria-selected="false">Trades</button><button class="mode" data-mode="changes" role="tab" aria-selected="false">Changes</button></div></div>
        <div class="day-strip" id="day-strip" aria-label="Choose report day"></div>
        <div class="rail-list" id="rail-list"><div class="empty"><div>Opening the remote…</div></div></div>
      </aside>
    </section>
  </main>
  <script>
  (function(){
    if(new URLSearchParams(location.search).get('embed')==='1')document.getElementById('shell').classList.add('embed');
    var data=null,mode='brief',choice='score',selectedNight='',selectedReview='',selectedChange='';
    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function plain(v){var raw=String(v==null?'':v).trim(),s=raw.toLowerCase();if(!raw)return'';if(/mode-collapse|near-identical|llm_hallucination_loop/.test(s))return'The bot kept making the same trade idea again and again. It needs to find different ideas.';if(/news.headline|direct url|news.article|news_headline_as_strategy|orb candidate/.test(s))return'The bot treated a news story like a trade plan. A news story is not a full trade plan.';if(/missing gating|untiered|gates=none|no tests were saved/.test(s))return'The idea was saved before the system finished testing it.';if(/regime fragility|regime_fragile|one kind of market/.test(s))return'This idea may work in only one kind of market. It still needs to be tried when prices are slow, fast, rising, and falling.';if(/look-ahead|look_ahead|next-bar|confirming candle/.test(s))return'The rule may have used price information too early. The bot must wait before entering.';if(/over-concentration|11 of 12|under-exploration/.test(s))return'Almost every idea used the same market and chart. The bot needs to try different markets and chart times.';if(/absence of regime|multi-regime validation/.test(s))return'The bot did not show that this idea works in different kinds of markets.';if(/open[_ ]range[_ ]breakout|opening range breakout/.test(s))return'The bot tried to trade when price broke above or below the first part of the day. This works best when prices are moving fast.';if(/ema.?9.?21|ema crossover/.test(s))return'The bot used two moving lines to follow the market direction.';return raw.replace(/^[a-z0-9 _-]+:\s*/i,'').replace(/\([^)]*(entry_indicator|entry tool|preferred_regime|best market type)[^)]*\)/gi,'').replace(/llm_hallucination_loop/gi,'the bot kept making the same idea').replace(/news_headline_as_strategy/gi,'a news story was mistaken for a trade plan').replace(/regime_fragile_setup/gi,'it may only work in one kind of market').replace(/look_ahead_close_bias/gi,'it used information too early').replace(/UNTIERED/gi,'not tested yet').replace(/gates=none/gi,'no tests were saved').replace(/backtest/gi,'test').replace(/proposer/gi,'idea maker').replace(/timeframe/gi,'chart time').replace(/symbol/gi,'market').replace(/_/g,' ').replace(/\s{2,}/g,' ').trim()}
    function when(v){if(!v)return'Not recorded';try{return new Date(v).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){return'Not recorded'}}
    function currentNight(){return(data.nights||[]).find(function(n){return n.id===selectedNight&&n.critique})||data.latest}
    function stateLine(){var l=data.learningLoop;if(l.autonomousOn)return'<div class="authority"><b>FULL LEARNING ON</b><span>The bot can study and run safe tests. It still cannot skip the rules.</span></div>';if(l.advisoryOn)return'<div class="authority warn"><b>WATCH MODE ON</b><span>The bot can study and explain. It cannot change anything.</span></div>';return'<div class="authority off"><b>LEARNING OFF</b><span>You can see old nights. The bot is not learning right now.</span></div>'}
    function sceneHead(kicker,title,deck,stamp){return'<div class="scene-top"><div><div class="kicker">'+esc(kicker)+'</div><h2 class="scene-title">'+esc(title)+'</h2><p class="scene-deck">'+esc(deck)+'</p></div>'+(stamp?'<div class="stamp"><strong>'+esc(stamp.top)+'</strong>'+esc(stamp.bottom)+'</div>':'')+'</div>'}
    function focus(kicker,title,text,bad){return'<div class="scene">'+sceneHead(kicker,title,'One thing the bot saved last night.',null)+'<div class="wave'+(bad?' bad':'')+'"></div><section class="focus-panel signal'+(bad?' bad':'')+'"><div class="kicker">Simple answer</div><h2>'+esc(title)+'</h2><p>'+esc(plain(text)||'Nothing was saved here.')+'</p></section></div>'}
    function listScene(kicker,title,deck,items,bad){var rows=items&&items.length?'<ol class="focus-list'+(bad?' bad':'')+'">'+items.map(function(x){return'<li>'+esc(plain(x))+'</li>'}).join('')+'</ol>':'<p class="scene-deck">Nothing was saved here.</p>';return'<div class="scene">'+sceneHead(kicker,title,deck,null)+'<section class="focus-panel">'+rows+'</section></div>'}
    function paintBrief(){var n=currentNight();if(!n){stageEmpty('No night note yet',data.health.message+' This screen will fill when the bot saves a real night.');return}var c=n.critique||{};if(choice==='score'){var rate=c.pass_rate==null?'—':esc(c.pass_rate)+'%';document.getElementById('stage').innerHTML='<div class="scene">'+sceneHead('Quick score','How last night went.','This only shows how many ideas passed the first test. It does not promise money.',{top:when(n.completedAt),bottom:n.status})+'<div class="hero-number"><div><b>'+rate+'</b><span>ideas passed</span><small>'+esc(c.strategies_passed==null?'—':c.strategies_passed)+' out of '+esc(c.strategies_generated==null?'—':c.strategies_generated)+' ideas · the bot felt '+esc(c.confidence||'unsure')+'</small></div></div>'+stateLine()+'</div>';return}if(choice==='best'){document.getElementById('stage').innerHTML=focus('Best thing','What worked',c.top_concept,false);return}if(choice==='worst'){document.getElementById('stage').innerHTML=focus('Biggest problem','What went wrong',c.worst_concept,true);return}if(choice==='patterns'){document.getElementById('stage').innerHTML=listScene('Things it saw','What kept happening','The same things showed up more than once.',c.pattern_insights,false);return}if(choice==='market'){document.getElementById('stage').innerHTML=listScene('Market trouble','Where it had problems','These market types made the ideas weaker.',c.regime_insights,true);return}if(choice==='next'){document.getElementById('stage').innerHTML=listScene('Next steps','What it wants to try','These are only ideas. They must pass the rules first.',c.recommendations,false);return}if(choice==='shift'){var source=function(k){var s=data.health.sources[k];return s==='ok'?'Done':s==='error'?'Could not read':'Nothing saved'};document.getElementById('stage').innerHTML='<div class="scene">'+sceneHead('Night clock','What ran while you slept.','Three real checks. Nothing fake.',null)+'<div class="timeline"><article><time>11:30 PM</time><b>Idea check</b><p>'+source('factoryBrief')+' · looked at new ideas and bad ideas</p></article><article><time>2:00 AM</time><b>Trade check</b><p>'+source('tradeReviews')+' · looked at saved trades</p></article><article><time>3:00 AM</time><b>Final night check</b><p>'+source('intelligence')+' · looked for problems and changes</p></article></div></div>';return}document.getElementById('stage').innerHTML='<div class="scene">'+sceneHead('How it ran','Which AI ran and how much work was reused.','If the system did not save an answer, this screen says so.',null)+'<div class="receipt-grid"><div><span>AI used</span><b>'+esc(n.model||n.provider||'Not saved')+'</b></div><div><span>Speed plan</span><b>'+esc(n.serviceTier||'Not saved')+'</b></div><div><span>Old words reused</span><b>'+(Number(n.cachedTokens)>0?Number(n.cachedTokens).toLocaleString()+' words saved':'No saved reuse yet')+'</b></div><div><span>Time it took</span><b>'+(n.durationMs==null?'Not saved':Math.round(n.durationMs/1000)+' seconds')+'</b></div></div></div>'}
    function paintReview(){var r=data.reviews.find(function(x){return x.id===selectedReview});if(!r){stageEmpty('Pick a trade','Choose one saved trade on the remote.');return}document.getElementById('stage').innerHTML='<div class="scene">'+sceneHead('Trade grade · '+(r.grade||'no grade'),r.strategy,r.symbol||'Market not saved',{top:when(r.critiquedAt),bottom:r.dataCompleteness||'some details may be missing'})+'<section class="focus-panel"><div class="kicker">Simple answer</div><h2>'+esc(plain(r.oneLiner)||'No short answer was saved.')+'</h2><p><b>Good:</b> '+esc(plain(r.whatWentRight)||'Nothing saved.')+'</p><p><b>Problem:</b> '+esc(plain(r.whatToWatch)||'Nothing saved.')+'</p><p><b>Do next:</b> '+esc(plain(r.actionNeeded)||'Nothing needed.')+'</p></section></div>'}
    function paintChange(){var c=data.changes.find(function(x){return x.id===selectedChange});if(!c){stageEmpty('Pick a change','Choose one saved test or change on the remote.');return}var applied=c.status==='applied';document.getElementById('stage').innerHTML='<div class="scene">'+sceneHead('What changed',applied?'The change was used.':'The change is still being tested.','This comes from the saved record, not an AI guess.',{top:when(c.happenedAt),bottom:c.status})+'<section class="focus-panel"><div class="kicker">'+esc(plain(c.kind))+'</div><h2>'+esc(c.name)+'</h2><p>'+esc(plain(c.detail))+'</p></section>'+stateLine()+'</div>'}
    function stageEmpty(title,copy){document.getElementById('stage').innerHTML='<div class="empty"><div><b>'+esc(title)+'</b>'+esc(copy)+'</div></div>'}
    function paintStage(){if(mode==='brief')paintBrief();else if(mode==='reviews')paintReview();else paintChange();document.getElementById('stage').scrollTop=0}
    function remote(id,icon,title,meta,on){return'<button class="remote-card'+(on?' on':'')+'" data-id="'+esc(id)+'"><span class="remote-icon">'+esc(icon)+'</span><span class="remote-copy"><b>'+esc(title)+'</b><span>'+esc(meta)+'</span></span><em>›</em></button>'}
    function dayLabel(v){if(!v)return'Date missing';try{return new Date(v).toLocaleDateString([],{month:'short',day:'numeric'})}catch(e){return'Date missing'}}
    function paintDays(){var box=document.getElementById('day-strip');if(mode!=='brief'){box.hidden=true;box.innerHTML='';return}var nights=(data.nights||[]).filter(function(n){return n.critique}),seen={};if(data.latest&&data.latest.critique&&!nights.some(function(n){return n.id===data.latest.id}))nights.unshift(data.latest);nights=nights.filter(function(n){if(!n.id||seen[n.id])return false;seen[n.id]=true;return true});box.hidden=false;box.innerHTML=nights.map(function(n,i){return'<button class="day-btn'+(n.id===selectedNight?' on':'')+'" data-night="'+esc(n.id)+'">'+esc(i===0?'Latest · '+dayLabel(n.completedAt):dayLabel(n.completedAt))+'</button>'}).join('');box.querySelectorAll('[data-night]').forEach(function(b){b.addEventListener('click',function(){selectedNight=b.getAttribute('data-night')||'';choice='score';paintDays();paintRail();paintStage()})})}
    function paintRail(){var box=document.getElementById('rail-list'),html='';if(mode==='brief'){var n=currentNight(),c=n&&n.critique||{};html='<div class="rail-group">Pick one thing</div>'+remote('score','01','Quick score',(c.strategies_generated==null?'No number saved':c.strategies_generated+' ideas checked'),choice==='score')+remote('best','02','What worked','Best thing it saw',choice==='best')+remote('worst','03','What went wrong','Biggest problem',choice==='worst')+remote('patterns','04','Things it saw',(c.pattern_insights||[]).length+' notes',choice==='patterns')+remote('market','05','Market trouble',(c.regime_insights||[]).length+' notes',choice==='market')+remote('next','06','What to try',(c.recommendations||[]).length+' ideas',choice==='next')+remote('shift','07','What ran','Three night checks',choice==='shift')+remote('receipt','08','How it ran','AI, saved work and time',choice==='receipt')}else if(mode==='reviews'){html='<div class="rail-group">Pick one trade</div>'+((data.reviews||[]).length?data.reviews.map(function(r){return remote(r.id,(r.grade||'—').slice(0,2),r.strategy,(r.symbol||'market missing')+' · '+when(r.critiquedAt),r.id===selectedReview)}).join(''):'<div class="empty"><div>No trade notes were saved.</div></div>')}else{html='<div class="rail-group">Pick one change</div>'+((data.changes||[]).length?data.changes.map(function(c){return remote(c.id,(c.status||'—').slice(0,2).toUpperCase(),c.name,c.status+' · '+when(c.happenedAt),c.id===selectedChange)}).join(''):'<div class="empty"><div>No changes were saved.</div></div>')}box.innerHTML=html;box.querySelectorAll('[data-id]').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-id')||'';if(mode==='brief')choice=id;else if(mode==='reviews')selectedReview=id;else selectedChange=id;paintRail();paintStage()})})}
    function setMode(next){mode=next;if(mode==='brief')choice='score';document.querySelectorAll('[data-mode]').forEach(function(b){var on=b.getAttribute('data-mode')===mode;b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false')});paintDays();paintRail();paintStage()}
    function load(){fetch('/slumhouse/api/night-desk',{credentials:'same-origin',cache:'no-store'}).then(function(r){if(r.status===401){location.href='/slumhouse/office.html';throw new Error('auth')}if(!r.ok)throw new Error('unavailable');return r.json()}).then(function(payload){data=payload;var l=data.learningLoop;document.getElementById('loop-pill').textContent=l.autonomousOn?'FULL':l.advisoryOn?'WATCH':'OFF';document.getElementById('loop-help').textContent=l.autonomousOn?'The bot can learn and run safe tests.':l.advisoryOn?'The bot can study. It cannot change things.':'The bot is not learning right now.';document.getElementById('room-health').textContent=data.health.state==='complete'?'Night notes ready':data.health.state==='waiting'?'Waiting for the first night':'Some notes could not load';selectedNight=((data.nights||[]).find(function(n){return n.critique})||data.latest||{}).id||'';selectedReview=(data.reviews[0]||{}).id||'';selectedChange=(data.changes[0]||{}).id||'';setMode('brief')}).catch(function(e){if(e.message==='auth')return;document.getElementById('room-health').textContent='Connection lost';stageEmpty('The room lost connection','This does not mean nothing happened. The room is trying again.');setTimeout(load,5000)})}
    document.querySelectorAll('[data-mode]').forEach(function(b){b.addEventListener('click',function(){if(data)setMode(b.getAttribute('data-mode')||'brief')})});load();
  })();
  </script>
</body>
