name: Current MNQ Strategy v1 Fast Research
on:
  push:
    branches:
      - research/current-mnq-strategy-v1
    paths:
      - research/current_mnq_strategy_v1_fast.py
      - .github/workflows/current-mnq-strategy-v1-fast.yml
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run current strategy v1
        run: python research/current_mnq_strategy_v1_fast.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-mnq-strategy-v1-fast-results
          path: research/_mnq_results_fast/
          if-no-files-found: warn
