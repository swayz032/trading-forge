name: Current MNQ Strategy v2.4 Development Diagnostic

on:
  push:
    branches:
      - research/current-mnq-strategy-v2-4-zone-first-candles
    paths:
      - 'research/current_mnq_strategy_v2_4_dev_diagnostic.py'
      - 'research/current_mnq_strategy_v2_4_engine.py'
      - 'research/current_mnq_strategy_v2_4_kernel.py'
      - 'research/current_mnq_strategy_v2_4_candles.py'
      - 'research/current_mnq_strategy_v2_4_zone_candles.py'
      - 'research/current_mnq_strategy_v2_4_gate.py'
      - 'research/current_mnq_strategy_v2_4_spec.json'
      - '.github/workflows/current-mnq-strategy-v2-4-dev-diagnostic.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/current_mnq_strategy_v2_4_dev_diagnostic.py'
      - 'research/current_mnq_strategy_v2_4_engine.py'
      - 'research/current_mnq_strategy_v2_4_kernel.py'
      - 'research/current_mnq_strategy_v2_4_candles.py'
      - 'research/current_mnq_strategy_v2_4_zone_candles.py'
      - 'research/current_mnq_strategy_v2_4_gate.py'
      - 'research/current_mnq_strategy_v2_4_spec.json'
      - '.github/workflows/current-mnq-strategy-v2-4-dev-diagnostic.yml'
  workflow_dispatch:

jobs:
  contaminated-development-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install frozen research dependencies
        run: python -m pip install --disable-pip-version-check -r research/mnq_v23_requirements.txt
      - name: Run diagnostic exactly once with frozen Params
        run: PYTHONPATH=. python -m research.current_mnq_strategy_v2_4_dev_diagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: mnq-v2-4-contaminated-development-diagnostic
          path: research/_mnq_v24_dev_diagnostic/results/
          if-no-files-found: error
