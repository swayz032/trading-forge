name: Current MNQ Strategy v2.4 Human-Bot Replay Lab

on:
  push:
    branches:
      - research/current-mnq-strategy-v2-4-zone-first-candles
    paths:
      - 'research/current_mnq_strategy_v2_4_replay_lab.py'
      - 'research/current_mnq_strategy_v2_4_replay_lab_generate.py'
      - 'tests/test_current_mnq_strategy_v2_4_replay_lab.py'
      - 'research/current_mnq_strategy_v2_4_replay_lab_v3.py'
      - 'research/current_mnq_strategy_v2_4_replay_lab_v3_selection.py'
      - 'research/current_mnq_strategy_v2_4_replay_lab_v3_generate.py'
      - 'research/current_mnq_strategy_v2_4_replay_lab_v3_bundle.py'
      - 'research/current_mnq_strategy_v2_4_replay_lab_v3_contract.json'
      - 'research/current_mnq_strategy_v2_4_replay_lab_v3_enhance.js'
      - 'tests/test_current_mnq_strategy_v2_4_replay_lab_v3.py'
      - 'tests/test_current_mnq_strategy_v2_4_replay_lab_v3_enhance.py'
      - 'tests/test_current_mnq_strategy_v2_4_replay_lab_v3_bundle.py'
      - 'research/current_mnq_strategy_v2_4_user_fidelity_gold.json'
      - '.github/workflows/current-mnq-strategy-v2-4-replay-lab.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/current_mnq_strategy_v2_4_replay_lab.py'
      - 'research/current_mnq_strategy_v2_4_replay_lab_generate.py'
      - 'tests/test_current_mnq_strategy_v2_4_replay_lab.py'
      - 'research/current_mnq_strategy_v2_4_replay_lab_v3.py'
      - 'research/current_mnq_strategy_v2_4_replay_lab_v3_selection.py'
      - 'research/current_mnq_strategy_v2_4_replay_lab_v3_generate.py'
      - 'research/current_mnq_strategy_v2_4_replay_lab_v3_bundle.py'
      - 'research/current_mnq_strategy_v2_4_replay_lab_v3_contract.json'
      - 'research/current_mnq_strategy_v2_4_replay_lab_v3_enhance.js'
      - 'tests/test_current_mnq_strategy_v2_4_replay_lab_v3.py'
      - 'tests/test_current_mnq_strategy_v2_4_replay_lab_v3_enhance.py'
      - 'tests/test_current_mnq_strategy_v2_4_replay_lab_v3_bundle.py'
      - 'research/current_mnq_strategy_v2_4_user_fidelity_gold.json'
      - '.github/workflows/current-mnq-strategy-v2-4-replay-lab.yml'
  workflow_dispatch:

concurrency:
  group: current-mnq-v2-4-replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install frozen research dependencies
        run: python -m pip install --disable-pip-version-check -r research/mnq_v23_requirements.txt
      - name: Prove V2 frozen lab and V3 interactive fidelity contracts
        run: |
          PYTHONPATH=. pytest --confcutdir=tests -q \
            tests/test_current_mnq_strategy_v2_4_replay_lab.py \
            tests/test_current_mnq_strategy_v2_4_replay_lab_v3.py \
            tests/test_current_mnq_strategy_v2_4_replay_lab_v3_enhance.py \
            tests/test_current_mnq_strategy_v2_4_replay_lab_v3_bundle.py
      - name: Generate fresh-session interactive V3 replay pack on contaminated development data
        run: PYTHONPATH=. python -m research.current_mnq_strategy_v2_4_replay_lab_v3_generate
      - name: Bind single-trade cross-timeframe interaction layer
        run: |
          set -euo pipefail
          pack="research/_mnq_v24_replay_lab_v3/pack"
          cp research/current_mnq_strategy_v2_4_replay_lab_v3_enhance.js "$pack/replay_v3_enhance.js"
          python - <<'PY'
          from pathlib import Path
          p = Path('research/_mnq_v24_replay_lab_v3/pack/review_v3.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="replay_v3_enhance.js"></script>'
          if marker not in text:
              text = text.replace('</body>', marker + '</body>')
          p.write_text(text, encoding='utf-8')
          PY
          grep -q 'replay_v3_enhance.js' "$pack/review_v3.html"
          grep -q 'paintLayer(ov5, c5, l.trader_zones, l.trader_tp_reaction_cluster)' "$pack/replay_v3_enhance.js"
          grep -q 'if (l.final_action) return;' "$pack/replay_v3_enhance.js"
          grep -q 'RESET DECISION' "$pack/replay_v3_enhance.js"
          grep -q 'Date.UTC' "$pack/replay_v3_enhance.js"
      - name: Vendor pinned TradingView Lightweight Charts 5.2.0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          pkg="$(npm pack lightweight-charts@5.2.0 --silent)"
          tar -xzf "$pkg"
          cp package/dist/lightweight-charts.standalone.production.js \
            "$GITHUB_WORKSPACE/research/_mnq_v24_replay_lab_v3/pack/lightweight-charts.standalone.production.js"
          test -s "$GITHUB_WORKSPACE/research/_mnq_v24_replay_lab_v3/pack/lightweight-charts.standalone.production.js"
      - name: Bundle one-file standalone trader page
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m research.current_mnq_strategy_v2_4_replay_lab_v3_bundle
          html="research/_mnq_v24_replay_lab_v3/pack/review_v3.html"
          ! grep -q 'src="lightweight-charts.standalone.production.js"' "$html"
          ! grep -q 'src="replay_v3_enhance.js"' "$html"
          grep -q 'RESET DECISION' "$html"
          grep -q 'if (l.final_action) return;' "$html"
      - name: Syntax-check generated V3 browser JavaScript
        run: |
          set -euo pipefail
          node --check research/_mnq_v24_replay_lab_v3/pack/replay_v3_enhance.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('research/_mnq_v24_replay_lab_v3/pack/review_v3.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          inline = [b for b in blocks if b.strip()]
          if len(inline) < 3:
              raise SystemExit(f'REPLAY_V3_EXPECTED_3_INLINE_SCRIPTS:{len(inline)}')
          Path('/tmp/replay_v3_core.js').write_text(inline[-2], encoding='utf-8')
          Path('/tmp/replay_v3_enhance.js').write_text(inline[-1], encoding='utf-8')
          PY
          node --check /tmp/replay_v3_core.js
          node --check /tmp/replay_v3_enhance.js
      - name: Prove fresh sessions and standalone receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pack = Path('research/_mnq_v24_replay_lab_v3/pack')
          review = json.loads((pack/'review_pack_v3.json').read_text())
          receipt = json.loads((pack/'receipt_v3.json').read_text())
          old = set(receipt['prior_v2_review_sessions_excluded'])
          new = {c['session'] for c in review['cases']}
          overlap = old & new
          if overlap:
              raise SystemExit('REPLAY_V3_PRIOR_OVERLAP:' + ','.join(sorted(overlap)))
          if len(new) != receipt['case_count'] or len(new) != receipt['session_count']:
              raise SystemExit('REPLAY_V3_CASE_SESSION_COUNT_MISMATCH')
          if not new:
              raise SystemExit('REPLAY_V3_NO_FRESH_CASES')
          if receipt['case_count'] != receipt['available_fresh_scoreable_sessions']:
              raise SystemExit('REPLAY_V3_DID_NOT_USE_ALL_FRESH_SESSIONS')
          if receipt['prior_v2_session_overlap_count'] != 0:
              raise SystemExit('REPLAY_V3_RECEIPT_OVERLAP_NOT_ZERO')
          if receipt['repeated_old_sessions_used_to_fill_case_count'] is not False:
              raise SystemExit('REPLAY_V3_OLD_SESSION_FILL_NOT_FALSE')
          html = (pack/'review_v3.html').read_text(encoding='utf-8')
          if 'src="lightweight-charts.standalone.production.js"' in html or 'src="replay_v3_enhance.js"' in html:
              raise SystemExit('REPLAY_V3_NOT_STANDALONE')
          PY
      - name: Upload V3 trader replay pack — safe bot answers withheld
        uses: actions/upload-artifact@v4
        with:
          name: mnq-v2-4-interactive-replay-v3-review-pack
          path: |
            research/_mnq_v24_replay_lab_v3/pack/review_v3.html
            research/_mnq_v24_replay_lab_v3/pack/review_pack_v3.json
            research/_mnq_v24_replay_lab_v3/pack/labels_template_v3.json
            research/_mnq_v24_replay_lab_v3/pack/receipt_v3.json
          if-no-files-found: error
      - name: Upload hidden V3 bot answer key — do not open before labels freeze
        uses: actions/upload-artifact@v4
        with:
          name: mnq-v2-4-hidden-replay-v3-answer-key
          path: research/_mnq_v24_replay_lab_v3/pack/answer_key_v3.json
          if-no-files-found: error
