name: Current MNQ Strategy v2.2 Robustness

on:
  push:
    branches:
      - research/current-mnq-strategy-v2-2-robustness
    paths:
      - 'research/current_mnq_strategy_v2_2_*.py'
      - 'research/current_mnq_strategy_v2_2_*.json'
      - 'tests/test_current_mnq_strategy_v2_2*.py'
      - '.github/workflows/current-mnq-strategy-v2-2.yml'
  workflow_dispatch:

jobs:
  manifest-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy pytest click
      - name: Run v2.2 correctness and safety tests
        run: PYTHONPATH=. pytest -q tests/test_current_mnq_strategy_v2_2.py tests/test_current_mnq_strategy_v2_2_live_safety.py
      - name: Capture pinned data manifest only
        run: PYTHONPATH=. python research/current_mnq_strategy_v2_2_runner.py --manifest-only
      - name: Upload pre-PnL manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: mnq-v2-2-manifest-evidence
          path: research/_mnq_v22/results/
          if-no-files-found: error
