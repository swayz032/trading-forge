name: Current MNQ Strategy v2.2 Robustness

on:
  push:
    branches:
      - research/current-mnq-strategy-v2-2-robustness
    paths:
      - 'research/current_mnq_strategy_v2_2_*.py'
      - 'research/current_mnq_strategy_v2_2_*.json'
      - 'tests/test_current_mnq_strategy_v2_2*.py'
      - '.github/workflows/current-mnq-strategy-v2-2.yml'
  workflow_dispatch:

jobs:
  full-v22:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install v2.2 research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy pytest
      - name: Run isolated v2.2 correctness and safety tests
        run: PYTHONPATH=. pytest --confcutdir=tests -q tests/test_current_mnq_strategy_v2_2.py tests/test_current_mnq_strategy_v2_2_live_safety.py
      - name: Run pinned-data v2.2 development diagnostics
        run: PYTHONPATH=. python research/current_mnq_strategy_v2_2_runner_compat.py --full
      - name: Upload complete v2.2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: mnq-v2-2-complete-results
          path: research/_mnq_v22/results/
          if-no-files-found: error
