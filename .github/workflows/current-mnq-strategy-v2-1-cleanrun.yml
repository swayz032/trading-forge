name: Current MNQ Strategy v2.1 Clean Deterministic Run

on:
  push:
    branches:
      - research/current-mnq-strategy-v2-1-fidelity
    paths:
      - 'research/current_mnq_strategy_v2_1_fidelity.py'
      - 'research/current_mnq_strategy_v2_1_fidelity_cleanrun.py'
      - '.github/workflows/current-mnq-strategy-v2-1-cleanrun.yml'
  workflow_dispatch:

jobs:
  cleanrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy
      - name: Execute clean separated v2.1 suite
        run: PYTHONPATH=. python research/current_mnq_strategy_v2_1_fidelity_cleanrun.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-mnq-strategy-v2-1-clean-results
          path: research/_mnq_v21_clean/
          if-no-files-found: error
