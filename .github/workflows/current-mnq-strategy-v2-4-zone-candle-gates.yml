name: Current MNQ Strategy v2.4 Zone + Candle Production Gates

on:
  push:
    branches:
      - research/current-mnq-strategy-v2-4-zone-first-candles
    paths:
      - 'research/current_mnq_strategy_v2_4_*.py'
      - 'research/current_mnq_strategy_v2_4_*.json'
      - 'research/current_mnq_strategy_v2_3_*.py'
      - 'src/engine/indicators/fvg_native.py'
      - 'research/mnq_v23_realtime/**'
      - 'research/mnq_v23_requirements.txt'
      - 'tests/test_current_mnq_strategy_v2_4*.py'
      - '.github/workflows/current-mnq-strategy-v2-4-zone-candle-gates.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/current_mnq_strategy_v2_4_*.py'
      - 'research/current_mnq_strategy_v2_4_*.json'
      - 'research/current_mnq_strategy_v2_3_*.py'
      - 'src/engine/indicators/fvg_native.py'
      - 'research/mnq_v23_realtime/**'
      - 'research/mnq_v23_requirements.txt'
      - 'tests/test_current_mnq_strategy_v2_4*.py'
      - '.github/workflows/current-mnq-strategy-v2-4-zone-candle-gates.yml'
  workflow_dispatch:

jobs:
  production-architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install pinned isolated research dependencies
        run: python -m pip install --disable-pip-version-check -r research/mnq_v23_requirements.txt
      - name: Compile all v2.4 modules
        run: python -m py_compile research/current_mnq_strategy_v2_4_*.py
      - name: Run inherited production safety plus v2.4 fidelity and edge gates
        run: |
          PYTHONPATH=. pytest --confcutdir=tests -q \
            tests/test_current_mnq_strategy_v2_2_contracts.py \
            tests/test_current_mnq_strategy_v2_2_projectx_history.py \
            tests/test_current_mnq_strategy_v2_2_projectx_broker.py \
            tests/test_current_mnq_strategy_v2_2_gold_lifecycle.py \
            tests/test_current_mnq_strategy_v2_2_risk_metrics.py \
            tests/test_current_mnq_strategy_v2_2_engine_final.py \
            tests/test_current_mnq_strategy_v2_3_account_risk.py \
            tests/test_current_mnq_strategy_v2_3_broker_risk.py \
            tests/test_current_mnq_strategy_v2_3_databento.py \
            tests/test_current_mnq_strategy_v2_3_device.py \
            tests/test_current_mnq_strategy_v2_3_evidence.py \
            tests/test_current_mnq_strategy_v2_3_live_data.py \
            tests/test_current_mnq_strategy_v2_3_operations_drill.py \
            tests/test_current_mnq_strategy_v2_3_production.py \
            tests/test_current_mnq_strategy_v2_3_promotion.py \
            tests/test_current_mnq_strategy_v2_3_realtime.py \
            tests/test_current_mnq_strategy_v2_3_roll_tick.py \
            tests/test_current_mnq_strategy_v2_3_shadow_coverage.py \
            tests/test_current_mnq_strategy_v2_3_signal.py \
            tests/test_current_mnq_strategy_v2_4*.py \
            --junitxml=/tmp/mnq_v24_junit.xml
      - name: Prove corrected semantic and weakest-link edge contract
        run: |
          PYTHONPATH=. python - <<'PY'
          from research.current_mnq_strategy_v2_4_policy import (
              load_spec, load_fvg_spec, load_edge_spec, load_key_level_spec,
          )
          p=load_spec(); f=load_fvg_spec(); e=load_edge_spec(); k=load_key_level_spec()
          assert p['zone_gate']['mandatory'] is True
          assert p['zone_gate']['pattern_without_zone_interaction']=='NO_TRADE'
          assert p['zone_gate']['mere_approach_without_touch']=='NO_TRADE'
          assert p['zone_gate']['mid_range_pattern']=='NO_TRADE'
          assert p['candlestick_semantics']['role']=='CONFIRMATION_AND_BUYER_SELLER_CONTROL_AT_ZONE_NOT_STANDALONE_SIGNAL'
          assert p['anti_overfit']['v2_3_sealed_result_not_valid_as_final_evidence_for_v2_4'] is True
          assert f['detector_authority']['repository_path']=='src/engine/indicators/fvg_native.py'
          assert f['detector_authority']['timeframe_for_current_strategy']=='15m'
          assert f['trader_target_rule']['liquidity_cluster_before_fvg']=='TARGET_LIQUIDITY_CLUSTER'
          assert f['trader_target_rule']['fvg_before_liquidity_cluster']=='TARGET_FVG'
          assert f['trader_target_rule']['rank_distance_uses']=='near_edge_of_reaction_area_not_midpoint'
          assert k['established_zone_path']['minimum_independent_rejections']==2
          assert k['exceptional_single_swing_path']['absolute_displacement_floor_atr']==1.0
          assert k['exceptional_single_swing_path']['recent_displacement_percentile']==0.75
          assert k['anti_overfit']['no_PnL_selection'] is True
          assert e['equation']['name']=='WEAKEST_LINK_ROBUST_EXPECTANCY'
          assert e['gates']['top_winner_fraction_removed']==0.05
          assert e['gates']['leave_best_calendar_month_out'] is True
          assert e['anti_overfit']['no_threshold_rescue_after_result'] is True
          seen=e['anti_overfit']['known_seen_performance_ranges']
          assert any(x['start']=='2022-01-01' and x['end']=='2026-08-17' for x in seen)
          print('PASS: v2.4 levels -> zone -> candles -> first-reaction TP -> weakest-link edge are frozen')
          PY
      - name: Verify read-only SignalR sidecar and hosted-runtime refusal
        working-directory: research/mnq_v23_realtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --check sidecar.mjs
          set +e
          output=$(node sidecar.mjs 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -ne 0
          echo "$output" | grep 'REMOTE_RUNTIME_REFUSE:PROJECTX_REALTIME'
      - name: Prove hosted Python cannot submit ProjectX orders
        run: |
          PYTHONPATH=. python - <<'PY'
          from research.current_mnq_strategy_v2_3_local_runtime import require_personal_device
          try:
              require_personal_device('PROJECTX_ORDER_SUBMISSION')
          except RuntimeError as e:
              assert 'REMOTE_RUNTIME_REFUSE' in str(e)
              print('PASS: hosted runner refused for ProjectX automation')
          else:
              raise SystemExit('FAIL: hosted runner was not refused')
          PY
      - name: Write v2.4 architecture evidence receipt
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          from research.current_mnq_strategy_v2_4_evidence import gold_counts
          from research.current_mnq_strategy_v2_4_policy import (
              semantics_hash, load_spec, load_fvg_spec, load_edge_spec, load_key_level_spec,
          )
          root=ET.parse('/tmp/mnq_v24_junit.xml').getroot()
          suites=list(root) if root.tag=='testsuites' else [root]
          tests=sum(int(x.attrib.get('tests',0)) for x in suites)
          failures=sum(int(x.attrib.get('failures',0))+int(x.attrib.get('errors',0)) for x in suites)
          spec=load_spec(); fvg=load_fvg_spec(); edge=load_edge_spec(); key=load_key_level_spec(); pos,neg=gold_counts()
          receipt={
              'release_id':spec['release_id'],
              'semantics_sha256':semantics_hash(),
              'tests':tests, 'failures':failures,
              'positive_user_gold_count':pos,
              'negative_semantic_fixture_count':len(spec['negative_semantic_fixtures']),
              'real_user_tempting_no_trade_gold_count':neg,
              'zone_gate_mandatory':True,
              'patterns_away_from_zone_refused':True,
              'shared_historical_live_candidate_kernel':True,
              'established_zone_min_independent_rejections':key['established_zone_path']['minimum_independent_rejections'],
              'exceptional_single_swing_equation':key['exceptional_single_swing_path']['equation'],
              'native_fvg_detector':fvg['detector_authority']['repository_path'],
              'native_fvg_timeframe':'15m',
              'first_reaction_target_ordering':True,
              'edge_equation':edge['equation']['definition'],
              'clean_oos_seen_history_exclusion':edge['anti_overfit']['known_seen_performance_ranges'],
              'signalr_sidecar_ci_automation_refused':True,
              'automation_approved':False,
              'reason':'v2.4 architecture only; clean sealed edge proof + real no-trade gold + local shadow/drills still required'
          }
          out=Path('research/_mnq_v24_architecture'); out.mkdir(parents=True,exist_ok=True)
          (out/'architecture_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mnq-v2-4-zone-candle-production-architecture-evidence
          path: research/_mnq_v24_architecture/
          if-no-files-found: error
