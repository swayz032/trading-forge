name: Trading Forge Fast Lane

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Machine-enforced push verdict
    runs-on: [self-hosted, linux, wsl-tower]
    timeout-minutes: 30
    env:
      NODE_ENV: test
      TF_RUNTIME_STAGE: preprod
      DATABASE_URL: postgresql://forge:forge_ci@localhost:5432/trading_forge_ci_${{ github.run_id }}
      API_KEY: ci-placeholder-api-key
      N8N_BASE_URL: http://localhost:5678
      N8N_API_KEY: ci-placeholder-n8n-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the production and hosted-CI Node major.
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Do not enable setup-python's global pip cache on this persistent
          # runner. It previously tried to archive 9+ GB of unrelated wheels
          # during post-job cleanup; the bounded fast requirements install in
          # under a minute without that failure-prone disk amplification.

      - name: Verify capped runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          python --version
          test "$(nproc)" -le 4

      - name: Package-lock structural integrity (pre-install)
        run: node scripts/check-package-lock-integrity.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Install CPU-only Python fast-lane dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check -q -r ci/requirements-fast.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Provision isolated PostgreSQL test database
        shell: bash
        run: |
          set -euo pipefail
          psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'forge') THEN
              CREATE ROLE forge LOGIN PASSWORD 'forge_ci';
            ELSE
              ALTER ROLE forge WITH LOGIN PASSWORD 'forge_ci';
            END IF;
          END
          $do$;
          SQL
          ci_database="trading_forge_ci_${GITHUB_RUN_ID}"
          [[ "$ci_database" =~ ^trading_forge_ci_[0-9]+$ ]]
          dropdb --if-exists --force "$ci_database"
          createdb --owner=forge "$ci_database"

      - name: Apply database migrations
        run: npm run db:migrate

      - name: TypeScript typecheck
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Hard gates
        shell: bash
        run: |
          set -euo pipefail
          npm run check:production-isolation
          npm run check:2026-compliance
          npm run system-map:check

      - name: Remaining contract and parity checks
        run: node ci/run-checks.mjs

      # The scripts/ estate spans two runners. Both lanes run; the lane-coverage guard inside
      # the node:test lane fails loudly if any scripts/ test file is claimed by zero lanes or
      # by both. See ci/vitest.config.mjs for the split (ops-experience 2026-07-19, OR-009).
      - name: Rails unit tests (vitest lane)
        run: node node_modules/vitest/vitest.mjs run --config ci/vitest.config.mjs

      - name: Rails/soak unit tests (node:test lane)
        run: npm run test:scripts

      # NON-BLOCKING on purpose (OR-086). The false-success class has surfaced 3x in this
      # project; this fence reports it. It runs green today, and lands non-blocking so its
      # first act is never to block the lane it exists to protect — a guard that arrives as
      # an obstacle gets disabled rather than fixed. Promote to --strict once it has run
      # clean across the whole ops surface for a stretch.
      # BLOCKING: the runsheet is generated from a typed source, so a drift here means
      # someone hand-edited an evidence claim — the exact dishonesty the schema prevents.
      #
      # CORRECTION (OR-102): the first version of this comment claimed "zero false-positive
      # surface". That was FALSE as written — a surface existed: core.autocrlf smudged the
      # LF blob to CRLF on Windows clones and the gate false-REDs. Closed two ways (a
      # .gitattributes eol=lf rule + an EOL-normalised comparison), so the claim is true
      # NOW — but it was a claim ahead of its evidence when written, which is the thing this
      # whole leg is about.
      - name: Cold-recovery runsheet matches its typed source
        run: npm run runsheet:check

      - name: False-success lint (ops surface, non-blocking)
        continue-on-error: true
        run: npm run lint:false-success

      - name: Prepare evidence directory
        run: mkdir -p ci/out

      - name: Collect full Vitest report
        id: vitest_report
        continue-on-error: true
        run: node node_modules/vitest/vitest.mjs run --pool=threads --maxWorkers=1 --minWorkers=1 --reporter=json --outputFile=ci/out/vitest.json

      - name: Collect fast pytest report
        id: pytest_report
        continue-on-error: true
        shell: bash
        run: |
          . .venv/bin/activate
          python -m pytest \
            src/engine/tests/test_metric_snapshot.py \
            src/engine/tests/test_golden_fixtures.py \
            src/engine/tests/test_frankenstein.py \
            src/engine/tests/test_cross_engine_parity.py \
            --junitxml=ci/out/pytest.xml

      - name: Upload raw fast-lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-lane-evidence-${{ github.run_id }}
          path: ci/out/
          retention-days: 7

      - name: Compare Vitest with frozen baseline
        id: vitest_compare
        if: always()
        continue-on-error: true
        run: node ci/compare-baseline.mjs --suite vitest --results ci/out/vitest.json

      - name: Compare pytest with frozen baseline
        id: pytest_compare
        if: always()
        continue-on-error: true
        run: node ci/compare-baseline.mjs --suite pytest --results ci/out/pytest.xml

      - name: Final fast-lane verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.vitest_compare.outcome }}" = "success"
          test "${{ steps.pytest_compare.outcome }}" = "success"
          echo "FAST_LANE_GREEN"

      - name: Remove isolated PostgreSQL test database
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_RUN_ID:-}"
          ci_database="trading_forge_ci_${GITHUB_RUN_ID}"
          [[ "$ci_database" =~ ^trading_forge_ci_[0-9]+$ ]]
          dropdb --if-exists --force "$ci_database"
