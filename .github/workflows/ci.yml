name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  TF_RUNTIME_STAGE: preprod
  DATABASE_URL: postgresql://forge:forge_ci@localhost:5432/trading_forge_ci
  API_KEY: ci-placeholder-api-key
  N8N_BASE_URL: http://localhost:5678
  N8N_API_KEY: ci-placeholder-n8n-key
  OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318/v1/traces

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
      - name: System map drift gate
        run: npm run system-map:check
      - run: npm run lint

      # ─── Hard gates (fail-closed) ──────────────────────────────────────────
      # These run in the lint job because lint is the upstream dependency of every
      # other job (test-node / test-python / test-parity all `needs: lint`). A gate
      # failure here short-circuits the entire pipeline. Each gate script exits
      # non-zero on a real violation, so no `|| true` / `|| echo` swallow is allowed.
      - name: Gate — production isolation
        run: npm run check:production-isolation
      - name: Gate — 2026 prop-firm rules compliance
        run: npm run check:2026-compliance
      - name: Gate — family-grade postscript on all notify calls
        run: npm run check:family-grade-postscript

  test-node:
    name: Node Tests + Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_ci
          POSTGRES_DB: trading_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://forge:forge_ci@localhost:5432/trading_forge_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Run migrations
        run: npm run db:migrate

      - name: Verify system map freshness
        run: npm run system-map:check

      - name: Run vitest with coverage
        run: npx vitest run --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-coverage
          path: coverage/
          retention-days: 14

  test-python:
    name: Python Tests + Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_ci
          POSTGRES_DB: trading_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://forge:forge_ci@localhost:5432/trading_forge_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Python dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r src/engine/requirements.txt
          pip install pytest pytest-cov

      - name: Verify system map freshness
        run: npm run system-map:check

      - name: Run pytest with coverage
        run: |
          pytest src/engine/ --cov=src/engine --cov-report=xml --cov-report=html -v

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: htmlcov/
          retention-days: 14

  test-parity:
    name: Cross-Engine Parity (A3)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Python dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r src/engine/requirements.txt
          pip install pytest

      - name: Run cross-engine parity tests
        run: |
          pytest src/engine/tests/test_cross_engine_parity.py -v \
            --tb=short \
            -x

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test-node, test-python, test-parity]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # The TS<->Python exit-parity gate spawns a Python subprocess that imports
      # src/engine/exits/adaptive_exits.py. That module is stdlib-only at import
      # time (no numpy/pandas), so a bare interpreter is sufficient — no engine
      # requirements install needed here.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: npm ci
      - name: System map drift gate
        run: npm run system-map:check
      - name: Build — tsc --noEmit
        run: npx tsc --noEmit

      # ─── Hard gates (fail-closed): TS<->Python parity ──────────────────────
      # Each script exits non-zero on a real divergence between TS and Python
      # surfaces. Engine-parity uses fixture-based comparison; the rules/version
      # gates compute SHA-256 over canonical-sorted JSON of TS+Python config
      # mirrors and refuse to ship when they disagree.
      - name: Gate — TS/Python exit-engine parity
        run: npm run check:ts-python-exit-parity
      - name: Gate — TS/Python firm-rules version
        run: npm run check:ts-python-firm-rules-version
      - name: Gate — TS/Python Tier 1 macro calendar parity
        run: npm run check:ts-python-tier1-parity
      - name: Gate — TS/Python PM size-factor parity
        run: npm run check:ts-python-pm-factor-parity
      # H-3 / F-3 / F-8: kills the key-drift grandfather-pass. Fails if walk_forward.py
      # writes a GATE-consumed WF-metadata key (wfe_*/pbo_*/dsr_*/bif/k_eff) that is
      # absent from the WfResultsBlob / WfMetadataShape TS contract.
      - name: Gate — Python→TS WF-metadata contract parity
        run: npm run check:wf-metadata-parity
