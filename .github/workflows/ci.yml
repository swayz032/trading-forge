name: CI

# Deep-scan #6 S5 (2026-07-01): the active codebase lives on hardening/phase-0
# (long-lived integration branch), NOT main — so CI never actually ran on the code
# being shipped. Trigger on the hardening line + PRs targeting it so the gates run
# where the work happens, not just on the near-dormant main.
on:
  push:
    branches: [main, develop, "hardening/**"]
  pull_request:
    branches: [main, develop, "hardening/**"]

env:
  # Node 24 matches the tower/production runtime (v24.13.0 / npm 11). CI previously
  # pinned Node 22 (npm 10), whose semver parser rejected the npm-11-generated
  # package-lock.json with "Invalid Version" — npm ci died on step 1 and every
  # downstream job (needs: lint) silently skipped, so CI tested nothing. (2026-07-11)
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"
  TF_RUNTIME_STAGE: preprod
  DATABASE_URL: postgresql://forge:forge_ci@localhost:5432/trading_forge_ci
  API_KEY: ci-placeholder-api-key
  N8N_BASE_URL: http://localhost:5678
  N8N_API_KEY: ci-placeholder-n8n-key
  OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318/v1/traces

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
      - name: System map drift gate
        run: npm run system-map:check
      # Lint is ADVISORY during the accumulated-debt paydown (baseline-and-enforce, 2026-07-11):
      # CI was dead-on-arrival at `npm ci` for weeks, so ESLint debt (178 errors / 673 warnings)
      # piled up unenforced. The SAFETY-critical enforcement is the hard gates + tests below, which
      # must stay green and now actually run. Burn the 178 down incrementally, then flip back to
      # blocking (remove continue-on-error) — ideally via a lint-baseline that fails only on NEW errors.
      - name: Lint (advisory — accumulated-debt paydown)
        continue-on-error: true
        run: npm run lint

      # deepscan6 O5 (2026-07-01): dependency vulnerability scanning. ADVISORY today
      # (continue-on-error) so a newly-disclosed CVE surfaces in CI without blocking the
      # pipeline; triage high/critical findings and flip to blocking once the baseline is clean.
      - name: Dependency audit — npm (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

      # deepscan6 O10 (2026-07-01): SSE broadcast-vs-frontend-catalog drift visibility.
      # ADVISORY — surfaces server events missing from the typed catalog so a renamed
      # event can't silently stop feeding a dashboard tile.
      - name: SSE contract drift (advisory)
        continue-on-error: true
        run: npm run check:sse-contract

      # ─── Hard gates (fail-closed) ──────────────────────────────────────────
      # These run in the lint job because lint is the upstream dependency of every
      # other job (test-node / test-python / test-parity all `needs: lint`). A gate
      # failure here short-circuits the entire pipeline. Each gate script exits
      # non-zero on a real violation, so no `|| true` / `|| echo` swallow is allowed.
      - name: Gate — production isolation
        run: npm run check:production-isolation
      - name: Gate — 2026 prop-firm rules compliance
        run: npm run check:2026-compliance
      - name: Gate — family-grade postscript on all notify calls
        run: npm run check:family-grade-postscript
      - name: Gate — cron/manual promotion-gate parity (deepscan18 D-D1)
        run: npm run check:gate-parity
      - name: Gate — migration immutability (deep-scan #22 fix #5)
        run: npm run check:migration-immutability
      - name: Gate — fault-injection coverage for the strict/AST gates (deep-scan #22 Y1)
        run: npm run check:gate-fault-injection

  test-node:
    name: Node Tests + Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_ci
          POSTGRES_DB: trading_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://forge:forge_ci@localhost:5432/trading_forge_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Run migrations
        run: npm run db:migrate

      - name: Verify system map freshness
        run: npm run system-map:check

      # hardening-rails 2026-07-12 (Wave 1 Track A): baseline-and-enforce for the Node suite.
      # Uses Codex's tested comparator (ci/compare-baseline.mjs). CAPTURE PHASE: vitest runs
      # advisory + emits a JSON report; the comparator runs advisory and PRINTS today's failing
      # test IDs (newFailures[]) to the log. Those get frozen — each with a reason — into
      # ci/baseline-failures.json, then the gate step flips to BLOCKING (remove continue-on-error)
      # so only NEW failures (or a collection-floor drop) fail CI. Known failures are quarantined.
      - name: Run vitest → JSON report for baseline (advisory)
        continue-on-error: true
        run: |
          npx vitest run --reporter=json --outputFile=ci/vitest-results.json || true
          echo "--- vitest-results.json bytes: $(wc -c < ci/vitest-results.json 2>/dev/null || echo MISSING) ---"
          head -c 120 ci/vitest-results.json 2>/dev/null || true

      - name: Upload vitest results (baseline capture/diff)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-vitest-results
          path: ci/vitest-results.json
          retention-days: 14

      - name: Baseline gate — vitest known-failures (CAPTURE PHASE — advisory; flip to blocking after freezing baseline)
        continue-on-error: true
        run: node ci/compare-baseline.mjs --suite vitest --results ci/vitest-results.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-coverage
          path: coverage/
          retention-days: 14

  test-python:
    name: Python Tests + Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_ci
          POSTGRES_DB: trading_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://forge:forge_ci@localhost:5432/trading_forge_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Python dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r src/engine/requirements.txt
          pip install pytest pytest-cov pytest-timeout ruff mypy pip-audit

      - name: Verify system map freshness
        run: npm run system-map:check

      # deepscan6 O4 (2026-07-01, burn-down 2026-07-02): Python static-analysis gates.
      # The BUG-DETECTION subset (undefined names, redefinitions, syntax/comparison bugs)
      # is CLEAN and BLOCKING — a real regression here fails CI. The broad STYLE set
      # (E/W/I/UP/B, ~1000 pre-existing cosmetic findings) stays ADVISORY until the
      # cosmetic burn-down (`ruff check --fix src/engine`, mostly Optional[X]→X|None).
      - name: Python lint — ruff bug-detection (BLOCKING)
        run: python -m ruff check src/engine --select F821,F811,F823,F706,F707,E9,F63,F7,F501,F502,F506,F522
      - name: Python lint — ruff full style (advisory)
        continue-on-error: true
        run: python -m ruff check src/engine
      - name: Python type-check — mypy (advisory)
        continue-on-error: true
        run: python -m mypy src/engine || true
      - name: Dependency audit — pip (advisory)
        continue-on-error: true
        run: python -m pip_audit -r src/engine/requirements.txt || true

      # hardening-rails 2026-07-12: the full-tree `pytest src/engine/` run can HANG for
      # hours (documented vectorbt-JIT-under-pytest-collection class, CLAUDE.md §2b) with
      # no natural cap — observed >90 min on run 29179583669. Guard it two ways:
      #   * step-level timeout-minutes is the HARD backstop for a collection-phase hang
      #     (pytest-timeout's --timeout does NOT cover collection);
      #   * --timeout (pytest-timeout, thread method) fails an EXECUTION-phase hang loudly
      #     with a faulthandler traceback naming the culprit test.
      # ADVISORY for now (continue-on-error, same posture as the ruff-style + mypy steps)
      # so a hang or pre-existing failure fails FAST instead of blocking-by-hanging every
      # push. Restore to BLOCKING after the root-cause mock audit / Codex pytest baseline.
      - name: Run pytest with coverage
        continue-on-error: true
        timeout-minutes: 25
        run: |
          pytest src/engine/ --cov=src/engine --cov-report=xml --cov-report=html -v --timeout=120 --timeout-method=thread

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: htmlcov/
          retention-days: 14

  test-parity:
    name: Cross-Engine Parity (A3)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Python dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r src/engine/requirements.txt
          pip install pytest

      - name: Run cross-engine parity tests
        run: |
          pytest src/engine/tests/test_cross_engine_parity.py -v \
            --tb=short \
            -x

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test-node, test-python, test-parity]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # The TS<->Python exit-parity gate spawns a Python subprocess that imports
      # src/engine/exits/adaptive_exits.py. That module is stdlib-only at import
      # time (no numpy/pandas), so a bare interpreter is sufficient — no engine
      # requirements install needed here.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: npm ci
      - name: System map drift gate
        run: npm run system-map:check
      - name: Build — tsc --noEmit
        run: npx tsc --noEmit

      # ─── Hard gates (fail-closed): TS<->Python parity ──────────────────────
      # Each script exits non-zero on a real divergence between TS and Python
      # surfaces. Engine-parity uses fixture-based comparison; the rules/version
      # gates compute SHA-256 over canonical-sorted JSON of TS+Python config
      # mirrors and refuse to ship when they disagree.
      - name: Gate — TS/Python exit-engine parity
        run: npm run check:ts-python-exit-parity
      - name: Gate — TS/Python firm-rules version
        run: npm run check:ts-python-firm-rules-version
      - name: Gate — TS/Python Tier 1 macro calendar parity
        run: npm run check:ts-python-tier1-parity
      - name: Gate — TS/Python PM size-factor parity
        run: npm run check:ts-python-pm-factor-parity
      # deep-scan re-verify: wire the two new contract/schema gates into CI (were script-only —
      # Paper re-verify Finding 1 caught gate-contract-keys shipped unwired, so drift wasn't caught).
      - name: Gate — JSONB gate-input contract keys (producer↔consumer)
        run: npm run check:gate-contract-keys
      - name: Gate — PGlite CORE_DDL ↔ schema.ts parity
        run: npm run check:pglite-ddl-parity
