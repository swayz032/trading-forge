name: PR38 one-shot CI repair

on:
  push:
    branches:
      - research/current-mnq-strategy-v2-4-zone-first-candles

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: research/current-mnq-strategy-v2-4-zone-first-candles
          fetch-depth: 0

      - name: Integrate main and repair stale documentation guards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          wave23 = "src/server/__tests__/wave23f-critic-look-ahead-engine-contract.test.ts"
          replace_once(
              wave23,
              'const CLAUDE_MD_PATH = resolve(__dirname, "../../../CLAUDE.md");',
              'const SCOUT_REFERENCE_PATH = resolve(process.cwd(), "docs/reference/claude-md-scout-architecture.md");',
          )
          replace_once(
              wave23,
              'const claudeMdSrc = readFileSync(CLAUDE_MD_PATH, "utf8");',
              'const scoutReferenceSrc = readFileSync(SCOUT_REFERENCE_PATH, "utf8");',
          )
          replace_once(
              wave23,
              'it("CLAUDE.md pinned-facts section documents the auto-shift contract", () => {',
              'it("canonical scout reference documents the auto-shift contract", () => {',
          )
          replace_once(
              wave23,
              'expect(claudeMdSrc).toMatch(/Backtest engine auto-shifts entries \\+1 bar/);',
              'expect(scoutReferenceSrc).toMatch(/Backtest engine auto-shifts entries \\+1 bar/);',
          )
          replace_once(
              wave23,
              'expect(claudeMdSrc).toMatch(/anti-pattern-catalog\\.md/);',
              'expect(scoutReferenceSrc).toMatch(/anti-pattern-catalog\\.md/);',
          )

          pass5 = "src/server/services/__tests__/pass5-lifecycle-wiring.test.ts"
          replace_once(
              pass5,
              'describe("Pass 5 Track D — CLAUDE.md §8 engine authority declaration", () => {',
              'describe("Pass 5 Track D — CLAUDE.md §8 engine authority declaration", () => {',
          )
          replace_once(
              pass5,
              'it("CLAUDE.md documents paper-engine authority declaration", () => {',
              'it("CLAUDE.md documents internal PAPER engine authority", () => {',
          )
          replace_once(
              pass5,
              '// Must mention paper-engine authority (case-insensitive — CLAUDE.md uses "Paper-engine authority")',
              '// The compact CLAUDE.md kernel states the same authority doctrine directly.',
          )
          replace_once(
              pass5,
              'expect(claudeMd.toLowerCase()).toContain("paper-engine authority");',
              'expect(claudeMd.toLowerCase()).toContain("paper is internal-engine-only");',
          )
          PY

          git rm .github/workflows/pr38-one-shot-ci-repair.yml
          git add src/server/__tests__/wave23f-critic-look-ahead-engine-contract.test.ts \
                  src/server/services/__tests__/pass5-lifecycle-wiring.test.ts

          if git rev-parse HEAD^2 >/dev/null 2>&1; then
            git commit --amend --no-edit
          else
            git commit -m "ci: repair stale documentation guards after main sync"
          fi

          git push origin HEAD:research/current-mnq-strategy-v2-4-zone-first-candles
