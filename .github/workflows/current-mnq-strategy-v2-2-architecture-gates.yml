name: Current MNQ Strategy v2.2 Architecture Gates

on:
  push:
    branches:
      - research/current-mnq-strategy-v2-2-robustness
    paths:
      - 'research/current_mnq_strategy_v2_2_contracts.py'
      - 'research/current_mnq_strategy_v2_2_projectx_history.py'
      - 'research/current_mnq_strategy_v2_2_gold_lifecycle.py'
      - 'research/current_mnq_strategy_v2_2_gold_set.json'
      - 'tests/test_current_mnq_strategy_v2_2_contracts.py'
      - 'tests/test_current_mnq_strategy_v2_2_projectx_history.py'
      - 'tests/test_current_mnq_strategy_v2_2_gold_lifecycle.py'
      - '.github/workflows/current-mnq-strategy-v2-2-architecture-gates.yml'
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy scipy pytest requests
      - name: Run roll/history/gold-set architecture gates
        run: PYTHONPATH=. pytest --confcutdir=tests -q tests/test_current_mnq_strategy_v2_2_contracts.py tests/test_current_mnq_strategy_v2_2_projectx_history.py tests/test_current_mnq_strategy_v2_2_gold_lifecycle.py
