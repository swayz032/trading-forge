name: Current MNQ Strategy v1 Research

on:
  push:
    branches:
      - research/current-mnq-strategy-v1
    paths:
      - 'research/current_mnq_strategy_v1.py'
      - '.github/workflows/current-mnq-strategy-v1.yml'
  workflow_dispatch:

jobs:
  backtest-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Execute frozen research backtest and stress suite
        run: python research/current_mnq_strategy_v1.py
      - name: Upload trade ledger and stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-mnq-strategy-v1-results
          path: research/_mnq_results/
          if-no-files-found: warn
