# deepscan6 O4 (2026-07-01, burn-down 2026-07-02): explicit ruff + mypy config so the
# Python static-analysis surface is stable and CI-consistent (was pre-commit-only, and
# pre-commit is bypassed by the mandated `git commit --no-verify`).
# CI split (ci.yml): the BUG-DETECTION subset (F821 undefined-name, F811 redefinition,
# F823, F63/F7 syntax+comparison bugs, E9, F50x string-format bugs) is CLEAN + BLOCKING.
# The broad STYLE set below (E/W/I/UP/B, ~1000 pre-existing cosmetic findings — mostly
# Optional[X]→X|None modernizations across 295 files) stays ADVISORY pending a verifiable
# burn-down (`ruff check --fix src/engine`; NOT done in one sweep because engine pytest
# collection hangs on vectorbt, so a 295-file unverifiable rewrite of the money engine
# was judged too risky). Two harmless string-annotation F821s carry documented noqa.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-length (formatter's job; not a correctness signal)
    "E741",  # ambiguous var names (l/I/O) — pervasive in math code
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["src/engine/tests", "tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Resolve the engine from this checkout before any user-site editable install.
# Keeping the repository root second still supports explicit `src.engine` imports.
pythonpath = ["src", "."]
filterwarnings = [
    "ignore:CUDA path could not be detected:UserWarning",
]
